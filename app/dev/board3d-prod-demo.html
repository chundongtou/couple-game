<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>V8 生产 3D 主桌 · 真实引擎 demo（不接 table）</title>
<style>
  /* ==========================================================================
     V8 生产 3D demo 外壳：只做 HUD / 真实题卡示意 / 操作按钮。
     3D 全部在 app/src/view/board3d/（App.Board3D）；此处不重复 3D 逻辑。
     ========================================================================== */
  :root{
    --bg:#070A12; --ink:#FFF3E6; --ink-2:#F1DFC9; --dim:#C9B6CE; --dim-2:#8E7C9E;
    --amber:#F3C077; --amber-2:#F8D29A; --line:rgba(255,226,196,.16);
    --panel:rgba(20,13,34,.94); --panel-2:rgba(30,20,48,.88);
    --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05070C}
  body{font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none}
  #app{position:fixed;inset:0;max-width:430px;margin:0 auto;overflow:hidden;background:var(--bg);
    box-shadow:0 0 0 1px rgba(255,226,196,.06)}

  /* ---------- 3D 舞台 host ---------- */
  .stage{position:absolute;inset:0;z-index:0;overflow:hidden;background:#070A12}
  .stage canvas{display:block}

  /* ---------- HUD ---------- */
  .hud{position:absolute;left:0;right:0;top:0;z-index:6;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0;
    pointer-events:none;background:linear-gradient(180deg,rgba(5,7,12,.82),rgba(5,7,12,.34) 72%,transparent)}
  .hud-top{display:flex;align-items:flex-start;gap:8px}
  .title{flex:1;min-width:0;font-size:10.5px;letter-spacing:.12em;color:var(--dim-2);line-height:1.4}
  .title b{display:block;font-size:12.5px;letter-spacing:.08em;color:var(--ink-2);font-weight:800}
  .status{max-width:58%;text-align:right;font-size:10px;line-height:1.5;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status b{font-size:11px}
  .pill-row{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
  .pill{font-size:9px;letter-spacing:.05em;color:var(--dim);border:1px solid var(--line);border-radius:999px;
    padding:2px 7px;background:rgba(12,8,20,.62);white-space:nowrap}
  .pill.amber{color:#2A1B12;background:linear-gradient(100deg,var(--amber-2),var(--amber));border-color:transparent;font-weight:800}
  .tool-row{display:flex;gap:5px;margin-top:6px;pointer-events:auto}
  .tool{flex:1;min-height:26px;border-radius:999px;border:1px solid var(--line);background:rgba(12,8,20,.66);
    color:var(--dim);font-family:inherit;font-size:9.5px;letter-spacing:.05em}
  .tool[aria-pressed="true"]{color:#2A1B12;background:linear-gradient(100deg,var(--amber-2),var(--amber));border-color:transparent;font-weight:800}
  .tool:active{transform:scale(.98)}

  /* ---------- 题卡 / 小游戏 / 选择 ---------- */
  .sheet{position:absolute;left:9px;right:9px;bottom:calc(146px + var(--safe-b));z-index:8;max-height:46vh;
    display:flex;flex-direction:column;gap:8px;padding:13px 13px 12px;border-radius:20px;
    background:linear-gradient(168deg,rgba(40,27,60,.985),rgba(19,12,31,.995));
    border:1px solid rgba(255,226,196,.2);box-shadow:0 18px 46px rgba(3,2,10,.72);
    overflow:auto;-webkit-overflow-scrolling:touch;pointer-events:auto}
  .sheet[hidden]{display:none}
  .sheet-kicker{font-size:9.5px;letter-spacing:.14em;color:var(--amber);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .sheet-kicker .dot{width:5px;height:5px;border-radius:50%;background:var(--amber)}
  .sheet-title{margin:0;font-size:15px;line-height:1.35;font-weight:800;color:var(--ink)}
  .sheet-text{margin:0;font-size:13.5px;line-height:1.62;color:var(--ink-2);word-break:break-word}
  .sheet-meta{font-size:9px;letter-spacing:.06em;color:var(--dim-2)}
  .sheet-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
  .btn{font-family:inherit;border-radius:13px;border:1px solid var(--line);background:rgba(14,9,24,.78);
    color:var(--ink-2);font-size:12px;letter-spacing:.06em;min-height:42px;padding:0 12px;flex:1}
  .btn.yes{color:#2B1710;background:linear-gradient(100deg,var(--amber-2),var(--amber));border:0;font-weight:800}
  .btn.ghost{flex:0 1 auto}
  .btn:active{transform:scale(.98)}
  .fate-option{flex:1 1 100%;text-align:left;font-size:12.5px;line-height:1.5;min-height:48px;padding:8px 11px}
  .fate-option b{display:block;font-size:9px;letter-spacing:.12em;color:var(--amber);margin-bottom:3px;font-weight:800}

  /* ---------- 底部操作 ---------- */
  .deck{position:absolute;left:12px;right:12px;bottom:calc(12px + var(--safe-b));z-index:7;
    display:flex;flex-direction:column;gap:7px;pointer-events:none}
  .deck > *{pointer-events:auto}
  .hint{font-size:10px;letter-spacing:.05em;color:var(--dim);text-align:center;min-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .roll{min-height:52px;border:0;border-radius:999px;font-family:inherit;font-size:15px;font-weight:800;letter-spacing:.18em;
    color:#2B1710;background:linear-gradient(100deg,var(--amber-2),#F2B77C 42%,#E98D7F);box-shadow:0 10px 26px rgba(233,136,122,.26)}
  .roll:disabled{opacity:.5;box-shadow:none}
  .row{display:flex;gap:6px}
  .row .btn{flex:1;min-height:32px;font-size:10.5px;border-radius:11px;background:rgba(14,9,24,.72)}

  .loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#05070C;
    color:var(--dim-2);font-size:11px;letter-spacing:.2em;text-align:center;padding:24px;line-height:1.8;transition:opacity .4s}
  body[data-ready="1"] .loading{opacity:0;pointer-events:none}
  .toast{position:absolute;left:50%;bottom:calc(206px + var(--safe-b));transform:translateX(-50%) translateY(6px);
    z-index:12;padding:7px 12px;border-radius:999px;background:rgba(10,6,18,.94);border:1px solid var(--line);
    color:var(--ink-2);font-size:10.5px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:86%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}

  @media (max-width:400px){
    .title b{font-size:11.5px}
    .status{font-size:9px;max-width:60%}
    .tool{font-size:9px;min-height:24px}
    .sheet{left:7px;right:7px;bottom:calc(138px + var(--safe-b));padding:11px 11px 10px;border-radius:17px;max-height:48vh}
    .sheet-title{font-size:13.5px}
    .sheet-text{font-size:12px;line-height:1.55}
    .btn{min-height:40px;font-size:11.5px}
    .roll{min-height:48px;font-size:13.5px}
  }
  @media (max-width:340px){
    .sheet-text{font-size:11px}
    .hint{font-size:9px}
  }
</style>
</head>
<body data-ready="0" data-reduced="0">
<div id="app">
  <div class="stage" id="stage" data-test="stage" aria-hidden="true"></div>

  <header class="hud">
    <div class="hud-top">
      <div class="title"><b>今晚飞行棋 · 3D 生产模块</b>V8 · 真实引擎（App.Flight）· 不接 table</div>
      <div class="status" data-test="demo-status">装配中…</div>
    </div>
    <div class="pill-row">
      <span class="pill amber" data-test="demo-phase">phase: boot</span>
      <span class="pill" data-test="demo-dice">骰子 —</span>
      <span class="pill" data-test="demo-turn">—</span>
      <span class="pill" data-test="demo-cards">第 0 张</span>
    </div>
    <div class="tool-row" role="group" aria-label="主题 / 减少动画">
      <button class="tool" type="button" data-theme-btn="cloud" data-test="theme-cloud" aria-pressed="true">云海机舱</button>
      <button class="tool" type="button" data-theme-btn="star" data-test="theme-star" aria-pressed="false">星轨夜航</button>
      <button class="tool" type="button" data-theme-btn="paper" data-test="theme-paper" aria-pressed="false">纸雕童话</button>
      <button class="tool" type="button" data-test="reduced-toggle" aria-pressed="false">减少动画</button>
    </div>
  </header>

  <section class="sheet" id="sheet" data-test="sheet" hidden aria-live="polite"></section>

  <div class="deck">
    <div class="hint" data-test="demo-hint">正在装配 3D…</div>
    <button class="roll" type="button" data-test="demo-roll" disabled>掷 骰</button>
    <div class="row">
      <button class="btn" type="button" data-test="demo-auto">自动 4 回合</button>
      <button class="btn" type="button" data-test="demo-new">重开一局</button>
      <button class="btn" type="button" data-test="demo-skip">跳过动画</button>
    </div>
  </div>

  <div class="toast" id="toast" data-test="toast"></div>
  <div class="loading" id="loading">正在装配 3D 桌面…<br><span style="font-size:9.5px;letter-spacing:.1em">加载真实引擎与 App.Board3D</span></div>
</div>

<!-- 真实引擎（与 index.template / build_app.py 的 JS_MODULES 同源；demo 直接引源码） -->
<script src="../src/data/cards.js"></script>
<script src="../src/engine/flight-rules.js"></script>
<script src="../src/engine/flight-board.js"></script>
<script src="../src/engine/flight-meta.js"></script>
<script src="../src/engine/flight-draw.js"></script>
<script src="../src/engine/flight-engine.js"></script>

<script type="module">
import Board3D from '../src/view/board3d/entry.js';

const q = new URLSearchParams(location.search);
const $ = (s) => document.querySelector(s);
const el = {
  stage: $('#stage'), loading: $('#loading'), sheet: $('#sheet'), toast: $('#toast'),
  status: $('[data-test="demo-status"]'), phase: $('[data-test="demo-phase"]'),
  dice: $('[data-test="demo-dice"]'), turn: $('[data-test="demo-turn"]'),
  cards: $('[data-test="demo-cards"]'), hint: $('[data-test="demo-hint"]'),
  roll: $('[data-test="demo-roll"]'), auto: $('[data-test="demo-auto"]'),
  newGame: $('[data-test="demo-new"]'), skip: $('[data-test="demo-skip"]'),
  reducedBtn: $('[data-test="reduced-toggle"]')
};

const KIND_LABEL = {
  'cell-truth': '真心话', 'cell-dare': '大冒险', 'cell-touch': '靠近',
  capture: '击落', 'stack-duo': '叠机', 'home-entry': '进航', fate: '命运', ending: '收尾'
};
const COLOR_NAME = { red: '红', yellow: '黄', blue: '蓝', green: '绿' };
const MINIGAME_LABEL = { thermo: '温度计', 'truth-wheel': '真心话转盘', 'dare-wheel': '大冒险转盘' };

let state = null;
let view = null;
let busy = false;
let autoBusy = false;
let reduced = q.get('reduced') === '1' || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
let dieValue = null;
let currentTheme = q.get('theme') || 'cloud';
let toastTimer = 0;

/* ------------------------------ 工具 ------------------------------ */
function namesFor(pid) { return state && state.names && state.names[pid] ? state.names[pid] : (pid === 'a' ? '红方' : '黄方'); }
function colorOf(pid) { return state && state.colors && state.colors[pid] ? state.colors[pid] : (pid === 'b' ? 'yellow' : 'red'); }
function colorName(color) { return COLOR_NAME[color] || color || '—'; }
function pieceName(id) {
  const p = state && state.pieces ? state.pieces.find((x) => x.id === id) : null;
  const idx = id && /:(\d+)$/.test(id) ? Number(id.split(':').pop()) + 1 : 1;
  return (p ? colorName(p.color) : '') + ' ' + idx + ' 号机';
}
function toast(msg) {
  if (!el.toast) return;
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2200);
}
function setReduced(flag) {
  reduced = !!flag;
  document.body.setAttribute('data-reduced', reduced ? '1' : '0');
  el.reducedBtn.setAttribute('aria-pressed', reduced ? 'true' : 'false');
  window.App.Board3D.setReduced(reduced);
  if (state) { view = window.App.Flight.view(state, { reduced }); window.App.Board3D.setState(state, view); }
  render();
}

/* ------------------------------ 引擎 ------------------------------ */
function newGame() {
  const mode = q.get('mode') === 'long' ? 'long' : 'quick';
  const res = window.App.Flight.newGame({
    names: { a: q.get('a') || '小满', b: q.get('b') || '阿野' },
    colors: { a: 'red', b: 'yellow' },
    scale: q.get('scale') || 'warm',
    mode,
    planeCount: mode === 'long' ? 4 : 2,
    boundaries: []
  }, q.get('seed') ? Number(q.get('seed')) : 20261118);
  if (!res.ok) { toast(res.error.message || '开局失败'); return false; }
  state = res.state;
  view = window.App.Flight.view(state, { reduced });
  window.App.Board3D.setState(state, view);
  hideSheet();
  dieValue = null;
  render();
  return true;
}

function syncView() {
  if (!state) return;
  view = window.App.Flight.view(state, { reduced });
  window.App.Board3D.setState(state, view);
}

/* ------------------------------ HUD ------------------------------ */
function render() {
  if (!state) return;
  const v = view || { meta: { heat: 0, streak: 0 }, planesHome: { a: 0, b: 0 } };
  const meta = v.meta || state.meta || { heat: 0, streak: 0 };
  const home = v.planesHome || { a: 0, b: 0 };
  const goal = state.planeCount || 2;
  const turn = state.turn === 'b' ? 'b' : 'a';
  el.status.innerHTML =
    `<b style="color:#FFC9A8">${colorName(colorOf('a'))} ${namesFor('a')}</b> 已到家 ${home.a}/${goal}` +
    `<br><b style="color:#FFE3AC">${colorName(colorOf('b'))} ${namesFor('b')}</b> 已到家 ${home.b}/${goal}` +
    ` · 心动值 ${meta.heat || 0} · 连击 ${meta.streak || 0}`;
  el.turn.textContent = `${colorName(colorOf(turn))}方回合 · ${namesFor(turn)}`;
  el.cards.textContent = `第 ${state.cardsProcessed || 0} 张`;
  el.dice.textContent = dieValue ? `骰子 ${dieValue}` : '骰子 —';
  updatePhase();
  updateHint();
  el.roll.disabled = busy || autoBusy || !(state.awaiting && state.awaiting.type === 'roll');
}

function updatePhase() {
  const p = el.stage.getAttribute('data-3d-phase') || 'boot';
  el.phase.textContent = `phase: ${p}`;
  el.phase.setAttribute('data-phase', p);
}

function updateHint() {
  if (!state) { el.hint.textContent = '正在装配 3D…'; return; }
  if (state.phase === 'ended' || state.phase === 'safe-ended') { el.hint.textContent = '今晚收尾 · 点「重开一局」再来一次'; return; }
  const aw = state.awaiting || { type: 'none' };
  if (aw.type === 'roll') el.hint.textContent = `${colorName(colorOf(state.turn))}方掷骰 · 6 起飞`;
  else if (aw.type === 'choose-piece') el.hint.textContent = '选一架飞机走这一步';
  else if (aw.type === 'prompt' || aw.type === 'ending-prompt') el.hint.textContent = '本格内容 · 做了 / 放过';
  else if (aw.type === 'minigame') el.hint.textContent = '小游戏 · 完成 / 跳过';
  else el.hint.textContent = '…';
}

/* ------------------------------ 动作 ------------------------------ */
async function doRoll(dieOpt) {
  if (busy || !state) return { ok: false, error: 'busy' };
  if (!state.awaiting || state.awaiting.type !== 'roll') return { ok: false, error: 'not-roll' };
  busy = true;
  hideSheet();
  el.roll.disabled = true;
  try {
    const res = window.App.Flight.roll(state, dieOpt);
    if (!res.ok) { toast(res.error.message || '这步不能掷'); return res; }
    state = res.state;
    const diceEv = res.events.find((e) => e.type === 'dice');
    if (diceEv) dieValue = diceEv.die;
    syncView();
    render();
    await window.App.Board3D.play(res.events, { kind: 'roll' });
    afterEvents();
    return res;
  } finally {
    busy = false;
    render();
  }
}

async function doMove(pieceId) {
  if (busy || !state) return { ok: false, error: 'busy' };
  busy = true;
  hideSheet();
  try {
    const res = window.App.Flight.move(state, pieceId);
    if (!res.ok) { toast(res.error.message || '这架飞机走不了'); return res; }
    state = res.state;
    syncView();
    render();
    await window.App.Board3D.play(res.events, { kind: 'move' });
    afterEvents();
    return res;
  } finally {
    busy = false;
    render();
  }
}

async function doResolvePrompt(outcome, cardIndex) {
  if (busy || !state) return { ok: false, error: 'busy' };
  busy = true;
  hideSheet();
  try {
    const opts = (cardIndex === 0 || cardIndex === 1) ? { cardIndex } : undefined;
    const res = window.App.Flight.resolvePrompt(state, outcome, opts);
    if (!res.ok) { toast(res.error.message || '现在还不能结算'); return res; }
    state = res.state;
    syncView();
    render();
    await window.App.Board3D.play(res.events, { kind: 'prompt', outcome });
    afterEvents();
    return res;
  } finally {
    busy = false;
    render();
  }
}

async function doResolveMinigame(outcome) {
  if (busy || !state) return { ok: false, error: 'busy' };
  busy = true;
  hideSheet();
  try {
    const res = window.App.Flight.resolveMinigame(state, outcome);
    if (!res.ok) { toast(res.error.message || '现在还不能结算小游戏'); return res; }
    state = res.state;
    syncView();
    render();
    await window.App.Board3D.play(res.events, { kind: 'minigame' });
    afterEvents();
    return res;
  } finally {
    busy = false;
    render();
  }
}

function afterEvents() {
  if (!state) return;
  if (state.phase === 'ended' || state.phase === 'safe-ended') { showResult(); return; }
  const aw = state.awaiting || { type: 'none' };
  if (aw.type === 'choose-piece') { showChoices(aw.pieceIds || (view && view.choices) || []); return; }
  if (aw.type === 'prompt' || aw.type === 'ending-prompt') { showPrompt(aw.prompt); return; }
  if (aw.type === 'minigame') { showMinigame(aw.kind); return; }
  hideSheet();
}

/* ------------------------------ 面板 ------------------------------ */
function hideSheet() {
  el.sheet.hidden = true;
  el.sheet.innerHTML = '';
}

function showChoices(pieceIds) {
  if (!pieceIds || !pieceIds.length) { hideSheet(); return; }
  el.sheet.hidden = false;
  el.sheet.innerHTML = '';
  const kicker = document.createElement('div');
  kicker.className = 'sheet-kicker';
  kicker.innerHTML = '<span class="dot"></span><span>选飞机 · 掷出 ' + (state.awaiting && state.awaiting.die ? state.awaiting.die : dieValue || '?') + '</span>';
  el.sheet.appendChild(kicker);
  const title = document.createElement('h2');
  title.className = 'sheet-title';
  title.textContent = '这一步让哪一架飞？';
  el.sheet.appendChild(title);
  const actions = document.createElement('div');
  actions.className = 'sheet-actions';
  pieceIds.forEach((id) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn yes';
    b.setAttribute('data-test', 'piece-choice');
    b.setAttribute('data-piece', id);
    b.textContent = pieceName(id);
    b.addEventListener('click', () => { doMove(id); });
    actions.appendChild(b);
  });
  el.sheet.appendChild(actions);
}

function promptActorName(prompt) {
  if (!prompt) return '';
  if (prompt.kind === 'stack-duo') return `${namesFor('a')} + ${namesFor('b')}`;
  const pid = prompt.kind === 'capture' ? (prompt.targetId || prompt.actorId) : (prompt.actorId || 'a');
  return namesFor(pid);
}

function showPrompt(prompt) {
  if (!prompt) { hideSheet(); return; }
  el.sheet.hidden = false;
  el.sheet.innerHTML = '';
  const isFate = prompt.kind === 'fate' && Array.isArray(prompt.options) && prompt.options.length;
  const card = prompt.card || (isFate ? prompt.options[0] : null);
  const kicker = document.createElement('div');
  kicker.className = 'sheet-kicker';
  kicker.innerHTML = '<span class="dot"></span><span data-test="prompt-kicker">' +
    (KIND_LABEL[prompt.kind] || '题卡') + ' · 归属 ' + promptActorName(prompt) +
    '</span><span data-test="prompt-star">' + (card && card.star ? '· ' + card.star + '★' : '') + '</span>';
  el.sheet.appendChild(kicker);

  if (isFate) {
    const title = document.createElement('h2');
    title.className = 'sheet-title';
    title.textContent = '命运格：两张卡，选一张';
    el.sheet.appendChild(title);
    prompt.options.forEach((opt, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn fate-option';
      b.setAttribute('data-test', 'fate-option-' + i);
      const lab = document.createElement('b');
      lab.textContent = '选项 ' + (i + 1) + (opt.star ? ' · ' + opt.star + '★' : '');
      b.appendChild(lab);
      b.appendChild(document.createTextNode(opt.text || ''));
      b.addEventListener('click', () => { doResolvePrompt('done', i); });
      el.sheet.appendChild(b);
    });
    const actions = document.createElement('div');
    actions.className = 'sheet-actions';
    const none = document.createElement('button');
    none.type = 'button';
    none.className = 'btn ghost';
    none.setAttribute('data-test', 'prompt-skip');
    none.textContent = '今晚先不选';
    none.addEventListener('click', () => { doResolvePrompt('skipped'); });
    actions.appendChild(none);
    el.sheet.appendChild(actions);
    const note = document.createElement('div');
    note.className = 'sheet-meta';
    note.textContent = '命运格不计入目标题卡；都不选也不会被惩罚。';
    el.sheet.appendChild(note);
    return;
  }

  const text = document.createElement('p');
  text.className = 'sheet-text';
  text.setAttribute('data-test', 'prompt-text');
  text.textContent = (card && card.text) || '（这一格没有句子）';
  el.sheet.appendChild(text);

  const meta = document.createElement('div');
  meta.className = 'sheet-meta';
  meta.setAttribute('data-test', 'prompt-actor');
  meta.textContent = '归属：' + promptActorName(prompt) + (card && card.pool ? ' · 池 ' + card.pool : '') + ' · 真实题库';
  el.sheet.appendChild(meta);

  const actions = document.createElement('div');
  actions.className = 'sheet-actions';
  const done = document.createElement('button');
  done.type = 'button';
  done.className = 'btn yes';
  done.setAttribute('data-test', 'prompt-done');
  done.textContent = prompt.kind === 'ending' ? '收了这张' : '做了';
  done.addEventListener('click', () => { doResolvePrompt('done'); });
  const skip = document.createElement('button');
  skip.type = 'button';
  skip.className = 'btn';
  skip.setAttribute('data-test', 'prompt-skip');
  skip.textContent = prompt.kind === 'ending' ? '放过这张' : '放过';
  skip.addEventListener('click', () => { doResolvePrompt('skipped'); });
  actions.appendChild(done);
  actions.appendChild(skip);
  el.sheet.appendChild(actions);
}

function showMinigame(kind) {

  el.sheet.innerHTML = '';
  const kicker = document.createElement('div');
  kicker.className = 'sheet-kicker';
  kicker.innerHTML = '<span class="dot"></span><span>小游戏 · ' + (MINIGAME_LABEL[kind] || kind) + '</span>';
  el.sheet.appendChild(kicker);
  const title = document.createElement('h2');
  title.className = 'sheet-title';
  title.textContent = '到小游戏格了';
  el.sheet.appendChild(title);
  const text = document.createElement('p');
  text.className = 'sheet-text';
  text.textContent = '生产环境这里由 App.MiniGame 打开面板；demo 只验证 3D 镜头与引擎结算（完成 +5 心动值，跳过不扣）。';
  el.sheet.appendChild(text);
  const actions = document.createElement('div');
  actions.className = 'sheet-actions';
  const done = document.createElement('button');
  done.type = 'button';
  done.className = 'btn yes';
  done.setAttribute('data-test', 'minigame-done');
  done.textContent = '完成';
  done.addEventListener('click', () => { doResolveMinigame('done'); });
  const skip = document.createElement('button');
  skip.type = 'button';
  skip.className = 'btn';
  skip.setAttribute('data-test', 'minigame-skip');
  skip.textContent = '跳过';
  skip.addEventListener('click', () => { doResolveMinigame('skipped'); });

  actions.appendChild(skip);

}

function showResult() {
  const ledger = state.result || (window.App.Flight.buildLedger ? window.App.Flight.buildLedger(state) : null);
  el.sheet.hidden = false;
  el.sheet.innerHTML = '';
  const kicker = document.createElement('div');
  kicker.className = 'sheet-kicker';
  kicker.innerHTML = '<span class="dot"></span><span>今晚收尾 · 真实 ledger</span>';
  el.sheet.appendChild(kicker);
  const title = document.createElement('h2');
  title.className = 'sheet-title';
  title.setAttribute('data-test', 'demo-result-title');
  title.textContent = !ledger ? '今晚收尾' :
    ledger.ending === 'safe' ? '安全词收棋 · 今晚就到这' :
    ledger.winnerId ? namesFor(ledger.winnerId) + ' 先到家' : '今晚一起走到这里';
  el.sheet.appendChild(title);
  const text = document.createElement('p');
  text.className = 'sheet-text';
  text.setAttribute('data-test', 'demo-result');
  if (ledger) {
    text.textContent =
      `已到家 ${ledger.stats.planesHome.a}/${state.planeCount} : ${ledger.stats.planesHome.b}/${state.planeCount}` +
      ` · 题卡做 ${ledger.stats.cardsDone} / 放过 ${ledger.stats.cardsSkipped}` +
      ` · 心动值 ${ledger.stats.heat} · 最高连击 ${ledger.stats.bestStreak}` +
      ` · 小游戏 ${ledger.stats.minigames}`;
  } else {
    text.textContent = '本局结束。';
  }
  el.sheet.appendChild(text);
  const actions = document.createElement('div');
  actions.className = 'sheet-actions';
  const again = document.createElement('button');
  again.type = 'button';
  again.className = 'btn yes';
  again.setAttribute('data-test', 'demo-again');
  again.textContent = '再开一局';
  again.addEventListener('click', () => { newGame(); });
  actions.appendChild(again);
  el.sheet.appendChild(actions);
}

/* ------------------------------ 自动 ------------------------------ */
async function autoRun(maxActions, diceCycle) {
  if (autoBusy || busy) return { ok: false, error: 'busy' };
  autoBusy = true;
  el.auto.disabled = true;
  const cycle = Array.isArray(diceCycle) && diceCycle.length ? diceCycle : [6, 3, 5, 2, 6, 4, 1, 3, 6, 5];
  let di = 0;
  let steps = 0;
  try {
    while (state && state.phase === 'playing' && steps < maxActions) {
      const aw = state.awaiting || { type: 'none' };
      steps++;
      if (aw.type === 'roll') await doRoll(cycle[di++ % cycle.length]);
      else if (aw.type === 'choose-piece') await doMove(aw.pieceIds[0]);
      else if (aw.type === 'prompt' || aw.type === 'ending-prompt') await doResolvePrompt('done', aw.prompt && aw.prompt.kind === 'fate' ? 0 : undefined);
      else if (aw.type === 'minigame') await doResolveMinigame('done');
      else break;
      await new Promise((r) => setTimeout(r, 40));
    }
  } finally {
    autoBusy = false;
    el.auto.disabled = false;
    render();
  }
  return { ok: true, steps, phase: state ? state.phase : 'none' };
}

/* ------------------------------ 事件注入（证据用） ------------------------------ */
async function injectEvents(events, pieces) {
  if (!state) return null;
  if (Array.isArray(pieces)) {
    const s = JSON.parse(JSON.stringify(state));
    const byId = {};
    s.pieces.forEach((p) => { byId[p.id] = p; });
    pieces.forEach((pp) => {
      const t = pp && byId[pp.id];
      if (!t) return;
      if (pp.squareId) t.squareId = pp.squareId;
      if (pp.arrived !== undefined) t.arrived = !!pp.arrived;
    });
    const fixed = window.App.Flight.validate(s);
    if (fixed) state = fixed;
  }
  syncView();
  render();
  await window.App.Board3D.play(events || [], { kind: 'synthetic' });
  return window.App.Board3D._debug();
}

/* ------------------------------ 启动 ------------------------------ */
async function boot() {
  try {
    if (!window.App || !window.App.Flight || !window.App.FlightBoard) throw new Error('引擎未加载');
    if (!newGame()) throw new Error('开局失败');
    const inst = await window.App.Board3D.mount(el.stage, {
      reduced,
      theme: currentTheme,
      state,
      view,
      mode: state.mode,
      sound: q.get('sound') === '1',
      adapt: q.get('adapt') !== '0',
      stageAim: { nx: 0, ny: 0.12 }
    });
    if (!inst) {
      const why = el.stage.getAttribute('data-3d-fallback') || 'unknown';
      throw new Error('3D 挂载失败（' + why + '）');
    }
    window.__board3dInst = inst;
    el.stage.setAttribute('data-test', 'stage');
    syncView();
    document.body.setAttribute('data-ready', '1');
    document.body.setAttribute('data-reduced', reduced ? '1' : '0');
    el.reducedBtn.setAttribute('aria-pressed', reduced ? 'true' : 'false');
    document.querySelectorAll('[data-theme-btn]').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-theme-btn') === currentTheme));
    });
    render();
    setInterval(updatePhase, 200);
    if (q.get('auto')) autoRun(Math.max(1, Math.min(40, Number(q.get('auto')) || 6)));
  } catch (err) {
    console.error('[demo] boot failed', err);
    el.loading.innerHTML = '3D demo 未能启动<br><span style="font-size:10px;letter-spacing:.05em">' +
      String(err && err.message ? err.message : err) + '</span>';
    el.loading.style.opacity = '1';
    el.loading.style.pointerEvents = 'auto';
  }
}

/* ------------------------------ 交互 ------------------------------ */
el.roll.addEventListener('click', () => { doRoll(); });
el.auto.addEventListener('click', () => { autoRun(12); });
el.newGame.addEventListener('click', () => {
  window.App.Board3D.unmount();
  window.__board3dInst = null;
  boot();
});
el.skip.addEventListener('click', () => { window.App.Board3D.skip(); });
el.reducedBtn.addEventListener('click', () => { setReduced(!reduced); });
document.querySelectorAll('[data-theme-btn]').forEach((b) => {
  b.addEventListener('click', () => {
    currentTheme = b.getAttribute('data-theme-btn');
    window.App.Board3D.setTheme(currentTheme);
    document.querySelectorAll('[data-theme-btn]').forEach((x) => {
      x.setAttribute('aria-pressed', String(x === b));
    });
  });
});

/* ------------------------------ 自测钩子 ------------------------------ */
window.__demo = {
  version: 'v8-prod-demo-1',
  state: () => state,
  view: () => view,
  phase: () => el.stage.getAttribute('data-3d-phase') || 'boot',
  debug: () => window.App.Board3D._debug(),
  engineView: () => (state ? window.App.Flight.view(state, { reduced }) : null),
  roll: (die) => doRoll(die),
  move: (id) => doMove(id),
  resolve: (outcome, cardIndex) => doResolvePrompt(outcome, cardIndex),
  resolveMinigame: (outcome) => doResolveMinigame(outcome),
  auto: (n, dice) => autoRun(n, dice),
  newGame: () => { newGame(); },
  theme: (id) => { currentTheme = id; window.App.Board3D.setTheme(id); },
  reduced: (flag) => setReduced(flag),
  skip: () => window.App.Board3D.skip(),
  injectEvents,
  themeList: () => ['cloud', 'star', 'paper'],
  info: () => ({
    phase: el.stage.getAttribute('data-3d-phase') || 'boot',
    awaiting: state && state.awaiting ? state.awaiting.type : null,
    turn: state ? state.turn : null,
    dice: dieValue,
    cards: state ? state.cardsProcessed : 0,
    heat: state && state.meta ? state.meta.heat : 0,
    ended: state ? (state.phase === 'ended' || state.phase === 'safe-ended') : false,
    reduced,
    theme: currentTheme,
    mounted: !!window.__board3dInst
  })
};

boot();
</script>
