<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>V8 P0 · 真 3D 主桌原型（不进构建 / 不接生产）</title>
<style>
  /* ==========================================================================
     V8 P0 真 3D 原型 · 独立 demo 外壳
     只用于验证手感/性能，不进构建、不接题库、不引外部资源。
     3D 全部在 board3d.js（three.js module）；这里只放 HUD / 内容卡 / 线速感 DOM。
     ========================================================================== */
  :root{
    --bg:#070A12; --ink:#FFF3E6; --ink-2:#F1DFC9; --dim:#C9B6CE; --dim-2:#8E7C9E;
    --amber:#F3C077; --amber-2:#F8D29A; --line:rgba(255,226,196,.16);
    --panel:rgba(20,13,34,.92); --panel-2:rgba(30,20,48,.86);
    --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    --safe-b:env(safe-area-inset-bottom,0px);
    --stage-w:40%;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05070C}
  body{font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none}
  #app{position:fixed;inset:0;max-width:430px;margin:0 auto;overflow:hidden;background:var(--bg);
    box-shadow:0 0 0 1px rgba(255,226,196,.06)}
  canvas#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}

  /* ---------- HUD ---------- */
  .hud{position:absolute;left:0;right:0;top:0;z-index:6;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0;
    display:flex;align-items:flex-start;gap:8px;pointer-events:none}
  .hud-title{font-size:11px;letter-spacing:.14em;color:var(--dim-2);line-height:1.35;flex:1;min-width:0}
  .hud-title b{display:block;font-size:12.5px;letter-spacing:.1em;color:var(--ink-2);font-weight:800}
  .hud-status{font-size:10.5px;letter-spacing:.06em;color:var(--amber);text-align:right;white-space:nowrap;
    max-width:52%;overflow:hidden;text-overflow:ellipsis}
  .hud-status small{display:block;color:var(--dim-2);letter-spacing:.04em;margin-top:2px}

  /* ---------- 主题 ---------- */
  .themes{position:absolute;left:12px;right:12px;top:calc(52px + env(safe-area-inset-top,0px));z-index:6;
    display:flex;gap:6px;pointer-events:none}
  .themes button{pointer-events:auto;flex:1;min-height:26px;padding:0 4px;border-radius:999px;
    border:1px solid var(--line);background:rgba(12,8,20,.62);color:var(--dim);font-family:inherit;
    font-size:10px;letter-spacing:.06em;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .themes button[aria-pressed="true"]{color:#2A1B12;background:linear-gradient(100deg,var(--amber-2),var(--amber));
    border-color:rgba(243,192,119,.7);font-weight:800}

  /* ---------- 底部操作 ---------- */
  .deck{position:absolute;left:12px;right:12px;bottom:calc(14px + var(--safe-b));z-index:7;
    display:flex;flex-direction:column;gap:7px;align-items:stretch}
  .deck .row{display:flex;gap:6px}
  .btn{font-family:inherit;border-radius:14px;border:1px solid var(--line);background:rgba(14,9,24,.72);
    color:var(--ink-2);font-size:11.5px;letter-spacing:.08em;min-height:34px;padding:0 10px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .12s,background .18s}
  .btn:active{transform:scale(.97);background:rgba(38,26,56,.9)}
  .btn.primary{flex:1;min-height:50px;border:0;border-radius:999px;font-size:15px;font-weight:800;letter-spacing:.18em;
    color:#2B1710;background:linear-gradient(100deg,var(--amber-2),#F2B77C 42%,#E98D7F);
    box-shadow:0 10px 26px rgba(233,136,122,.26)}
  .btn.primary:disabled{opacity:.55;box-shadow:none}
  .btn.ghost{flex:1}
  .btn.ghost[aria-pressed="true"]{background:rgba(243,192,119,.22);border-color:rgba(243,192,119,.55);color:var(--ink)}

  /* ---------- 速度线（只在 fly 出现；reduced 关闭） ---------- */
  .speedlines{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .25s}
  body[data-phase="fly"] .speedlines{opacity:1}
  .speedlines i{position:absolute;top:-30%;width:2px;height:34%;border-radius:2px;
    background:linear-gradient(180deg,rgba(255,243,230,0),rgba(255,243,230,.55),rgba(255,243,230,0));
    left:var(--x);animation:sl var(--d) linear infinite;animation-delay:var(--dl)}
  @keyframes sl{0%{transform:translateY(-20%) scaleY(.4);opacity:0}
    18%{opacity:.9}100%{transform:translateY(260%) scaleY(1.5);opacity:0}}

  /* ---------- 45° 格子舞台：右侧内容卡 ---------- */
  .card{position:absolute;z-index:8;right:9px;top:calc(88px + env(safe-area-inset-top,0px));
    bottom:calc(96px + var(--safe-b));width:calc(100% - var(--stage-w) - 22px);
    display:flex;flex-direction:column;gap:0;padding:13px 13px 11px;border-radius:20px;
    background:linear-gradient(168deg,rgba(40,27,60,.985),rgba(19,12,31,.995));
    border:1px solid rgba(255,226,196,.2);box-shadow:0 18px 46px rgba(3,2,10,.72);
    transform:translateX(18px) scale(.98);opacity:0;pointer-events:none;
    transition:transform .34s cubic-bezier(.22,.9,.24,1),opacity .28s}
  /* 卡片中段留白用大字水印填（本格字形），不抢正文 */
  .card-mark{position:absolute;left:0;right:0;top:48%;transform:translateY(-50%);
    text-align:center;font:900 108px/1 var(--font);letter-spacing:-.06em;
    color:rgba(243,192,119,.085);pointer-events:none;user-select:none}
  body[data-card="open"] .card{transform:none;opacity:1;pointer-events:auto}
  .card-kicker{font-size:9.5px;letter-spacing:.16em;color:var(--amber);margin-bottom:5px;
    display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .card-kicker .dot{width:5px;height:5px;border-radius:50%;background:var(--amber);opacity:.9}
  .card-title{font-size:15px;line-height:1.34;font-weight:800;letter-spacing:.02em;color:var(--ink);margin:0 0 7px}
  .card-body{font-size:11.5px;line-height:1.62;color:var(--dim);margin:0 0 8px}
  .card-meta{font-size:9px;letter-spacing:.08em;color:var(--dim-2);margin-bottom:9px}
  .card-spacer{flex:1}
  .card-actions{display:flex;gap:6px;margin-top:6px}
  .card-actions .btn{flex:1;min-height:38px;font-size:12px;border-radius:12px}
  .card-actions .yes{color:#2B1710;background:linear-gradient(100deg,var(--amber-2),var(--amber));border:0;font-weight:800}
  .card-note{margin-top:7px;font-size:8.5px;letter-spacing:.05em;color:rgba(201,182,206,.55);text-align:center}
  .card-bearline{margin-top:6px;font-size:10px;letter-spacing:.04em;color:rgba(243,192,119,.82);
    display:flex;align-items:center;gap:5px}
  .card-bearline b{color:var(--amber)}

  /* ---------- 载入 / 调试 ---------- */
  .loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#05070C;
    color:var(--dim-2);font-size:11px;letter-spacing:.22em;transition:opacity .4s}
  body[data-ready="1"] .loading{opacity:0;pointer-events:none}
  .debug{position:absolute;left:8px;bottom:calc(96px + var(--safe-b));z-index:9;display:none;
    padding:6px 8px;border-radius:10px;background:rgba(6,4,14,.86);border:1px solid var(--line);
    font:10px/1.5 ui-monospace,Consolas,monospace;color:#D8C7E2;white-space:pre;max-width:64%;pointer-events:none}
  body.ui-debug #debug{display:block}

  /* ---------- 窄屏适配（320/390） ---------- */
  @media (max-width:400px){
    :root{--stage-w:38%}
    .card{top:calc(84px + env(safe-area-inset-top,0px));padding:11px 11px 9px;border-radius:17px}
    .card-title{font-size:13.5px}
    .card-body{font-size:10.5px;line-height:1.56}
    .card-kicker{font-size:8.5px}
    .btn.primary{min-height:46px;font-size:13.5px}
    .themes button{font-size:9px;min-height:24px}
    .hud-title b{font-size:11.5px}
  }
  @media (max-width:340px){
    :root{--stage-w:35%}
    .card-body{display:none}
    .card{bottom:calc(88px + var(--safe-b))}
    .deck .row .btn{font-size:10.5px;min-height:31px}
  }
  @media (prefers-reduced-motion:reduce){
    .speedlines{display:none}
    .card{transition:opacity .18s}
    .btn{transition:none}
  }
</style>
</head>
<body data-phase="boot" data-theme="cloud" data-reduced="0" data-ready="0" data-card="closed">
<div id="app">
  <canvas id="scene" aria-label="3D 飞行棋桌面（原型）" role="img"></canvas>

  <div class="speedlines" aria-hidden="true">
    <i style="--x:9%;--d:520ms;--dl:0ms"></i><i style="--x:21%;--d:640ms;--dl:120ms"></i>
    <i style="--x:34%;--d:480ms;--dl:60ms"></i><i style="--x:46%;--d:700ms;--dl:220ms"></i>
    <i style="--x:58%;--d:560ms;--dl:20ms"></i><i style="--x:71%;--d:620ms;--dl:180ms"></i>
    <i style="--x:83%;--d:500ms;--dl:90ms"></i><i style="--x:93%;--d:660ms;--dl:250ms"></i>
  </div>

  <header class="hud">
    <div class="hud-title">
      <b>今晚飞行棋 · 3D 原型</b>
      P0 手感/性能验证 · 不接生产
    </div>
    <div class="hud-status" id="status" data-test="demo-status">俯瞰<small>红方 · 第 1 格</small></div>
  </header>

  <div class="themes" role="group" aria-label="主题">
    <button type="button" data-theme-btn="cloud" data-test="theme-cloud" aria-pressed="true">云海机舱</button>
    <button type="button" data-theme-btn="star" data-test="theme-star" aria-pressed="false">星轨夜航</button>
    <button type="button" data-theme-btn="paper" data-test="theme-paper" aria-pressed="false">纸雕童话</button>
  </div>

  <aside class="card" id="card" data-test="prompt-card" role="dialog" aria-label="本格内容（示意）">
    <div class="card-mark" data-test="card-mark" aria-hidden="true">敢</div>
    <div class="card-kicker"><span class="dot" aria-hidden="true"></span>
      <span data-test="prompt-kicker">第 4 格 · 敢做</span><span>· 3★</span></div>
    <h2 class="card-title" data-test="prompt-title">今晚最想一起做的一件小事？</h2>
    <p class="card-body">轮流说一件「想让今晚变得不一样」的小事，另一人不许说「不要」。三分钟，两句话就够。</p>
    <div class="card-meta">DARE · 归属：小红 · 今晚限定 · 示意文案</div>
    <div class="card-spacer"></div>
    <div class="card-bearline" data-test="bear-line">机长小熊：<b>慢慢说，我在听。</b></div>
    <div class="card-actions">
      <button class="btn yes" type="button" data-test="prompt-done">做了</button>
      <button class="btn" type="button" data-test="prompt-skip">放过</button>
    </div>
    <button class="btn" type="button" data-test="prompt-back" style="margin-top:6px">先看棋盘</button>
    <div class="card-note">示意文案 · 原型不接题库/存档</div>
  </aside>

  <div class="deck">
    <button class="btn primary" type="button" id="roll" data-test="roll">摇 骰</button>
    <div class="row">
      <button class="btn ghost" type="button" id="chain" data-test="chain">整链</button>
      <button class="btn ghost" type="button" id="step" data-test="step">单步</button>
      <button class="btn ghost" type="button" id="reset" data-test="reset">重置</button>
    </div>
  </div>

  <div class="debug" id="debug" data-test="debug"></div>
  <div class="loading" id="loading">正在装配 3D 机舱…</div>
</div>
<script type="module" src="./board3d.js"></script>
</body>
</html>
