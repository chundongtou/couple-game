<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>V6.2 机舱场景自测 · Cabin + 全动态相机（不进构建）</title>
<style>
  :root{
    --bg0:#08060F;--bg1:#120D24;--bg2:#150F2A;--nebula:#241540;--nebula-glow:#8E7BD8;
    --amber:#F3C077;--amber-deep:#E2965E;--rose:#E9887A;
    --ink:#FBF3E7;--dim:#C9B6CE;--dim2:#8E7C9E;
    --paper:#F7EAD6;--paper2:#F1DFC4;--paper-ink:#2C1C15;
    --glass:rgba(38,27,58,.42);--line:rgba(255,226,196,.13);
    --red:#F08C80;--yellow:#F0C877;--blue:#8FA6E8;--green:#7FC9A8;
    --font-display:"Noto Serif SC","Songti SC","STSong",serif;
    --font-body:"Noto Sans SC","Microsoft YaHei","PingFang SC",-apple-system,sans-serif;
    --safe-t:0px;--safe-b:0px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07050E}
  body{font-family:var(--font-body);color:var(--ink)}
  /* 自测外壳：430×932 手机比例；与真实主桌同构（cabin host + HUD + 棋盘 + 行动区） */
  .stage{position:relative;width:100vw;max-width:430px;height:100vh;max-height:932px;margin:0 auto;overflow:hidden;background:#08060F}

  /* ===== 以下布局刻意对齐 app/src/ui/screens/table.js 的 .v6-table（dev 脚手架） ===== */
  .v6-table{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
    padding:calc(8px + var(--safe-t)) 12px calc(8px + var(--safe-b));
    color:var(--ink);font-family:var(--font-body);background:#08060F}
  .v6-cabin{position:absolute;inset:0;z-index:0;pointer-events:none}
  .v6-hud{position:relative;z-index:2;flex:none;display:flex;align-items:flex-start;gap:8px}
  .v6-hud-tools{display:flex;gap:6px;flex:1;min-width:0}
  .v6-safe-slot{width:96px;height:56px;flex:none;display:flex;justify-content:flex-end;align-items:flex-start}
  .v6-icon-btn{min-width:44px;min-height:44px;padding:0 10px;border-radius:14px;cursor:pointer;
    border:1px solid var(--line);background:var(--glass);color:var(--dim);font-size:12px;letter-spacing:.08em;
    font-family:inherit;display:inline-flex;align-items:center;justify-content:center;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .safe-pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;
    border:1px solid rgba(243,192,119,.28);background:linear-gradient(180deg,rgba(243,192,119,.14),rgba(243,192,119,.05));
    color:#F0D6B4;font-size:11px;letter-spacing:.08em;white-space:nowrap;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .safe-pill i{width:7px;height:7px;border-radius:50%;background:var(--rose);box-shadow:0 0 10px 2px rgba(233,136,122,.55)}
  .v6-status{position:relative;z-index:2;flex:none;padding:6px 2px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
  .v6-status-line{font-size:11px;letter-spacing:.06em;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .v6-status-main{font-size:12.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .v6-status-main i{font-style:normal;margin-left:6px;font-size:11px;font-weight:700;color:var(--amber)}
  .v6-turns{position:relative;z-index:2;flex:none;display:flex;align-items:center;gap:6px;margin-top:6px;padding:5px;border-radius:20px;
    background:var(--glass);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
  .v6-turn{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:15px;transition:background .3s}
  .v6-turn .v6-tdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--dim2)}
  .v6-turn .v6-tnm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .v6-turn .v6-tclr{font-size:10px;letter-spacing:.08em;color:var(--dim2);flex:none}
  .v6-turn .v6-tstate{margin-left:auto;font-size:10px;letter-spacing:.1em;color:var(--dim2);flex:none}
  .v6-turn.on .v6-tstate{color:var(--amber)}
  .v6-turn-sep{width:1px;height:22px;background:rgba(255,226,196,.16);flex:none}
  .v6-rollstrip{position:relative;z-index:2;flex:none;display:flex;align-items:flex-start;gap:9px;margin-top:6px;padding:7px 9px;border-radius:16px;
    background:var(--glass);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
  .v6-die{position:relative;width:38px;height:38px;flex:none;border-radius:10px;display:grid;padding:6px;gap:2px;
    grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    background:linear-gradient(160deg,#3A2418,#24150E);box-shadow:0 1px 0 rgba(255,226,196,.25) inset}
  .v6-die i{width:6px;height:6px;border-radius:50%;background:transparent;align-self:center;justify-self:center}
  .v6-die i.on{background:#FBEBD2;box-shadow:0 0 6px rgba(251,235,210,.45)}
  .v6-rollinfo{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
  .v6-roll-line{display:flex;align-items:baseline;gap:6px;min-width:0;flex-wrap:wrap}
  .v6-dietext{font-size:13px;font-weight:600;white-space:nowrap}
  .v6-lsep{color:var(--dim2);font-size:11px}
  .v6-llabel{font-size:10.5px;letter-spacing:.1em;color:var(--dim2);flex:none}
  .v6-landing{font-size:12px;font-weight:600;color:var(--amber);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .v6-hint{font-size:11.5px;line-height:1.35;color:var(--rose)}
  .v6-boardwrap{flex:1;min-height:0;position:relative;z-index:1;margin:4px 0 0;display:flex;align-items:center;justify-content:center}
  .v6-board{position:relative;z-index:1;width:100%;aspect-ratio:720/750;max-height:100%;min-height:0;margin-top:-26px}
  .v6-action{position:relative;z-index:2;flex:none;display:flex;flex-direction:column;gap:6px;padding-top:2px}
  .v6-actions{display:flex;flex-direction:column;gap:8px}
  .v6-btn{min-height:48px;border-radius:999px;border:0;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.1em}
  .v6-btn:active{transform:scale(.99)}
  .v6-btn-primary{background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:#2C1C15;
    box-shadow:0 8px 20px rgba(226,150,94,.22),0 0 0 1px rgba(255,240,215,.35) inset}
  .v6-receipt{font-size:12px;letter-spacing:.04em;color:var(--amber);text-align:center;min-height:14px}
  .v6-receipt .v6-note{color:var(--dim);margin-left:6px;font-size:11px}

  /* ===== demo 自测工具（ui=0 时隐藏，不影响截图布局） ===== */
  .tools{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;width:54px}
  .tools button{font-family:var(--font-body);font-size:10px;letter-spacing:.04em;padding:7px 2px;border-radius:10px;
    border:1px solid rgba(243,192,119,.25);background:rgba(18,11,32,.78);color:#E8D8C2;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .tools button.on{background:rgba(243,192,119,.25);color:#FFF3E6}
  .demo-triggers{position:absolute;left:14px;right:14px;bottom:86px;z-index:30;display:flex;gap:6px;justify-content:center}
  .demo-triggers button{flex:1;min-width:0;height:30px;padding:0 4px;border-radius:999px;font-family:var(--font-body);
    font-size:10.5px;letter-spacing:.04em;border:1px solid rgba(243,192,119,.22);
    background:rgba(16,10,28,.72);color:#E8D8C2;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .demo-triggers button:active{background:rgba(243,192,119,.22)}
  .metrics{position:absolute;left:10px;top:10px;z-index:31;max-width:320px;padding:8px 10px;border-radius:12px;
    background:rgba(6,4,14,.9);border:1px solid rgba(255,226,196,.18);color:#D8C7E2;font-size:10px;line-height:1.5;
    white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;pointer-events:none}
  .metrics[hidden]{display:none}
  body.no-ui .tools,body.no-ui .demo-triggers{display:none}
  /* 题卡 demo 卡（只为验证 overlay 压暗/恢复；真实卡由 fe-cards 提供） */
  .demo-card{position:absolute;left:10px;right:10px;bottom:78px;z-index:20;border-radius:24px;padding:16px 18px 14px;
    background:linear-gradient(160deg,#FBF1E1,#F1DFC4);color:#2C1C15;box-shadow:0 18px 44px rgba(3,2,10,.55);
    pointer-events:auto;display:none}
  .demo-card.on{display:block}
  .demo-card .k{font-size:10.5px;letter-spacing:.14em;font-weight:700;color:#9A6A46}
  .demo-card .q{margin-top:6px;font-family:var(--font-display);font-size:18px;line-height:1.5;color:#2B1A12}
  .demo-card .row{display:flex;gap:8px;margin-top:12px}
  .demo-card button{flex:1;height:42px;border-radius:999px;border:0;font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.1em}
  .demo-card .ok{background:linear-gradient(180deg,#362117,#241410);color:#FFF4E4}
  .demo-card .no{background:transparent;border:1px solid rgba(60,35,24,.28);color:#6E4A33}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="v6-table" data-test="table">
    <div class="v6-cabin" data-test="cabin" id="cabin"></div>

    <header class="v6-hud" data-test="hud">
      <div class="v6-hud-tools">
        <button class="v6-icon-btn" type="button" data-act="noop">暂停</button>
        <button class="v6-icon-btn" type="button" data-act="noop">规则</button>
      </div>
      <div class="v6-safe-slot"><span class="safe-pill" data-test="safe"><i></i>先收棋</span></div>
    </header>

    <div class="v6-status" data-test="status">
      <div class="v6-status-line"><span id="s-round">第 3 回合</span> · <span id="s-dur">今晚 0:18</span> · <span id="s-fly">在飞 0 架</span> · <span id="s-cards">第 2 张</span></div>
      <div class="v6-status-main"><span id="s-home">红 0/2 · 黄 0/2</span> · <span id="s-heat">心动值 0</span> · <span id="s-streak">连击 0</span><i id="s-stage">灯刚亮</i></div>
    </div>

    <div class="v6-turns" data-test="turns">
      <div class="v6-turn on" data-test="turn-a" id="turn-a"><i class="v6-tdot" id="dot-a"></i><span class="v6-tnm" id="nm-a">他</span><span class="v6-tclr">红方</span><span class="v6-tstate">的回合</span></div>
      <span class="v6-turn-sep"></span>
      <div class="v6-turn" data-test="turn-b" id="turn-b"><i class="v6-tdot" id="dot-b"></i><span class="v6-tnm" id="nm-b">她</span><span class="v6-tclr">黄方</span><span class="v6-tstate">下一手</span></div>
    </div>

    <div class="v6-rollstrip" data-test="rollstrip">
      <div class="v6-die" id="die" data-value="0" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="v6-rollinfo">
        <div class="v6-roll-line"><span class="v6-dietext" id="die-text">还没掷骰</span><span class="v6-lsep">·</span><span class="v6-llabel">落点</span><span class="v6-landing" data-test="landing" id="landing">—</span></div>
        <div class="v6-hint" data-test="hint" id="hint">掷到 6 起飞；连续两次没 6，第三次任意点数保底。</div>
      </div>
    </div>

    <div class="v6-boardwrap" data-test="boardwrap">
      <div class="v6-board" data-board data-test="board" id="board"></div>
    </div>

    <div class="v6-action" data-test="action">
      <div class="v6-actions"><button class="v6-btn v6-btn-primary" type="button" data-test="roll" id="rollBtn">掷 骰</button></div>
      <div class="v6-receipt" data-test="receipt" id="receipt">她 刚记下一张 · 心动值 62</div>
    </div>
  </div>

  <div class="demo-triggers" id="demoTriggers">
    <button type="button" data-scn="dice">骰</button>
    <button type="button" data-scn="move">走子</button>
    <button type="button" data-scn="capture">击落</button>
    <button type="button" data-scn="turn">换手</button>
    <button type="button" data-scn="heat">升温</button>
    <button type="button" data-scn="win">收家</button>
    <button type="button" data-scn="prompt">题卡</button>
    <button type="button" data-scn="dawn">日出</button>
  </div>

  <div class="tools" id="tools">
    <button type="button" data-act="reset">重置</button>
    <button type="button" data-act="reduced">减动效</button>
    <button type="button" data-act="metrics">指标</button>
    <button type="button" data-act="hide">隐藏UI</button>
  </div>
  <div class="metrics" id="metrics" hidden></div>

  <div class="demo-card" id="demoCard">
    <div class="k">题卡 · 给了走到的人</div>
    <div class="q">今晚的哪一个瞬间，你最想被对方记住？</div>
    <div class="row"><button class="ok" type="button" data-card="done">做了</button><button class="no" type="button" data-card="skip">放过</button></div>
  </div>
</div>

<script src="../src/engine/flight-board.js"></script>
<script src="../src/view/board.js"></script>
<script src="../src/view/cabin.js"></script>
<script>
/* ==========================================================================
 * 机舱场景自测页（dev 脚手架，不进构建）
 * 1) 用真实 BoardView（92 格）+ 真实 CabinScene；mount/play/setMood 调用方式
 *    与 table.js 即将合入的写法一致（并行 play，不 await 场景）。
 * 2) 场景按钮：骰 / 走子 / 击落 / 换手 / 升温 / 收家 / 题卡 / 日出。
 * 3) window.__demo 供 Playwright 断言：run / setReduced / state / boardTransform /
 *    squareHit / sampleFrames / metrics。
 * 4) URL: ?scenario=dice|move|capture|turn|heat|win|prompt|dawn&ui=0&reduced=1&debug=1
 * ========================================================================== */
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var uiHidden = params.get('ui') === '0';
  if (uiHidden) document.body.classList.add('no-ui');

  var board = window.App.BoardView;
  var cabin = window.App.CabinScene;
  var boardEl = document.getElementById('board');
  var cabinHost = document.getElementById('cabin');

  var HEX = { red: '#F08C80', yellow: '#F0C877', blue: '#8FA6E8', green: '#7FC9A8' };
  var STAGE_NAMES = { cold: '灯刚亮', warm: '有点热', charged: '靠近了', burning: '很近了', blazing: '今晚可以更近' };
  var PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

  function p(id, color, squareId, arrived) {
    return { id: id, color: color, squareId: squareId, arrived: !!arrived, stackGroupId: null };
  }
  function baseSnapshot() {
    return {
      names: { a: '他', b: '她' }, colors: { a: 'red', b: 'yellow' }, turn: 'a',
      pieces: [
        p('a:0', 'red', 'hangar:red:0'), p('a:1', 'red', 'hangar:red:1'),
        p('a:2', 'red', 'hangar:red:2'), p('a:3', 'red', 'hangar:red:3'),
        p('b:0', 'yellow', 'hangar:yellow:0'), p('b:1', 'yellow', 'hangar:yellow:1'),
        p('b:2', 'yellow', 'hangar:yellow:2'), p('b:3', 'yellow', 'hangar:yellow:3')
      ],
      choices: [], fateCells: [5, 29],
      meta: { heat: 0, stage: 'cold', streak: 0, streakBest: 0 }
    };
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---------------- 场景定义 ---------------- */
  var SCENARIOS = {
    initial: {
      label: '初始：夜航待机（8 架在机坪）',
      snapshot: (function () {
        var s = baseSnapshot();
        s.pieces[0] = p('a:0', 'red', 'ring:6');
        s.pieces[4] = p('b:0', 'yellow', 'ring:19');
        s.meta = { heat: 18, stage: 'cold', streak: 0, streakBest: 2 };
        return s;
      })(),
      mood: { heat: 18, stage: 'cold', turn: 'a', winner: null, phase: 'playing', overlay: false },
      events: [],
      die: 0, landing: '—'
    },
    dice: {
      label: '掷骰：推近 + 舱灯轻闪',
      snapshot: (function () {
        var s = baseSnapshot();
        s.pieces[0] = p('a:0', 'red', 'ring:6');
        s.meta = { heat: 30, stage: 'warm', streak: 1, streakBest: 2 };
        return s;
      })(),
      mood: { heat: 30, stage: 'warm', turn: 'a', winner: null, phase: 'playing', overlay: false },
      events: [{ type: 'dice', die: 5 }],
      die: 5, landing: '第 7 格'
    },
    move: {
      label: '走子：跟拍落点方向 + 桌面涟漪',
      snapshot: (function () {
        var s = baseSnapshot();
        s.pieces[0] = p('a:0', 'red', 'ring:6');
        s.pieces[4] = p('b:0', 'yellow', 'ring:19');
        s.meta = { heat: 42, stage: 'charged', streak: 3, streakBest: 3 };
        return s;
      })(),
      mood: { heat: 42, stage: 'charged', turn: 'a', winner: null, phase: 'playing', overlay: false },
      events: [
        { type: 'dice', die: 5 },
        { type: 'move', pieceId: 'a:0', path: ['ring:7', 'ring:8', 'ring:9', 'ring:10', 'ring:11'] }
      ],
      die: 5, landing: '第 12 格 · 大冒险'
    },
    capture: {
      label: '击落：震动 + 闪白 + 红色波纹',
      snapshot: (function () {
        var s = baseSnapshot();
        s.pieces[0] = p('a:0', 'red', 'ring:24');
        s.pieces[4] = p('b:0', 'yellow', 'ring:27');
        s.meta = { heat: 54, stage: 'charged', streak: 2, streakBest: 3 };
        return s;
      })(),
      mood: { heat: 54, stage: 'charged', turn: 'a', winner: null, phase: 'playing', overlay: false },
      events: [
        { type: 'dice', die: 3 },
        { type: 'move', pieceId: 'a:0', path: ['ring:25', 'ring:26', 'ring:27'] },
        { type: 'capture', attackerId: 'a:0', victimIds: ['b:0'] },
        { type: 'turn', playerId: 'b', color: 'yellow' }
      ],
      die: 3, landing: '第 28 格 · 击落黄方 1 架'
    },
    stack: {
      label: '叠机：轻推 + 落点涟漪',
      snapshot: (function () {
        var s = baseSnapshot();
        s.pieces[0] = p('a:0', 'red', 'ring:13');
        s.pieces[1] = p('a:1', 'red', 'ring:14');
        s.pieces[4] = p('b:0', 'yellow', 'ring:22');
        s.meta = { heat: 48, stage: 'charged', streak: 3, streakBest: 4 };
        return s;
      })(),
      mood: { heat: 48, stage: 'charged', turn: 'a', winner: null, phase: 'playing', overlay: false },
      events: [
        { type: 'dice', die: 1 },
        { type: 'move', pieceId: 'a:0', path: ['ring:14'] },
        { type: 'stack', pieceIds: ['a:0', 'a:1'], at: 'ring:14' }
      ],
      die: 1, landing: '第 15 格 · 叠机 ×2'
    },
    turn: {
      label: '换手：镜头向当前玩家一侧平移',
      snapshot: (function () {
        var s = baseSnapshot();
        s.pieces[0] = p('a:0', 'red', 'ring:9');
        s.pieces[4] = p('b:0', 'yellow', 'ring:21');
        s.meta = { heat: 52, stage: 'charged', streak: 2, streakBest: 3 };
        return s;
      })(),
      mood: { heat: 52, stage: 'charged', turn: 'b', winner: null, phase: 'playing', overlay: false },
      events: [{ type: 'turn', playerId: 'b', color: 'yellow' }],
      die: 0, landing: '—'
    },
    heat: {
      label: '升温：舱灯琥珀→玫瑰 + 窗外星星变多',
      snapshot: (function () {
        var s = baseSnapshot();
        s.pieces[0] = p('a:0', 'red', 'ring:15');
        s.pieces[4] = p('b:0', 'yellow', 'ring:30');
        s.meta = { heat: 62, stage: 'burning', streak: 4, streakBest: 4 };
        return s;
      })(),
      mood0: { heat: 62, stage: 'burning', turn: 'b', winner: null, phase: 'playing', overlay: false },
      mood: { heat: 86, stage: 'blazing', turn: 'b', winner: null, phase: 'playing', overlay: false },
      events: [
        { type: 'heat', delta: 10, heat: 72, stage: 'burning' },
        { type: 'heat', delta: 14, heat: 86, stage: 'blazing', prevStage: 'burning' },
        { type: 'streak', count: 6, best: 6 }
      ],
      die: 4, landing: '第 31 格 · 靠近'
    },
    prompt: {
      label: '题卡：拉远到 0.99 + 压暗 + 落点聚光',
      snapshot: (function () {
        var s = baseSnapshot();
        s.pieces[0] = p('a:0', 'red', 'ring:16');
        s.pieces[4] = p('b:0', 'yellow', 'ring:29');
        s.meta = { heat: 66, stage: 'burning', streak: 4, streakBest: 4 };
        return s;
      })(),
      mood: { heat: 66, stage: 'burning', turn: 'a', winner: null, phase: 'playing', overlay: false },
      events: [
        { type: 'dice', die: 3 },
        { type: 'move', pieceId: 'a:0', path: ['ring:17', 'ring:18', 'ring:19'] },
        {
          type: 'prompt', prompt: {
            id: 'pr-demo-1', kind: 'cell-dare', actorId: 'a', targetId: 'a', pieceIds: ['a:0'],
            squareId: 'ring:19',
            card: { id: 'demo', text: '今晚的哪一个瞬间，你最想被对方记住？', star: 2, tags: [], pool: 'dare' }
          }
        }
      ],
      die: 3, landing: '第 20 格 · 大冒险', overlay: true
    },
    win: {
      label: '收家：拉远 + 窗外日出开始',
      snapshot: (function () {
        var s = baseSnapshot();
        s.pieces[0] = p('a:0', 'red', 'home:red:goal', true);
        s.pieces[1] = p('a:1', 'red', 'home:red:goal', true);
        s.pieces[4] = p('b:0', 'yellow', 'ring:22');
        s.turn = 'a';
        s.meta = { heat: 88, stage: 'blazing', streak: 6, streakBest: 6 };
        return s;
      })(),
      mood: { heat: 88, stage: 'blazing', turn: 'a', winner: 'a', phase: 'playing', overlay: false },
      events: [{ type: 'win', playerId: 'a' }],
      die: 0, landing: '到家 2 架', winner: true
    },
    dawn: {
      label: '日出态：8s 渐变后的晨光主桌',
      snapshot: (function () {
        var s = baseSnapshot();
        s.pieces[0] = p('a:0', 'red', 'home:red:goal', true);
        s.pieces[1] = p('a:1', 'red', 'home:red:goal', true);
        s.pieces[4] = p('b:0', 'yellow', 'ring:22');
        s.meta = { heat: 88, stage: 'blazing', streak: 6, streakBest: 6 };
        return s;
      })(),
      mood: { heat: 88, stage: 'blazing', turn: 'a', winner: 'a', phase: 'playing', overlay: false },
      events: [{ type: 'win', playerId: 'a' }],
      die: 0, landing: '到家 2 架', winner: true, waitDawn: true
    }
  };

  /* ---------------- HUD ---------------- */
  function paintDie(v) {
    var dieEl = document.getElementById('die');
    var pips = dieEl.querySelectorAll('i');
    for (var i = 0; i < pips.length; i++) pips[i].className = (PIPS[v] || []).indexOf(i) >= 0 ? 'on' : '';
    dieEl.setAttribute('data-value', String(v || 0));
    document.getElementById('die-text').textContent = v ? ('掷出 ' + v) : '还没掷骰';
  }
  function paintHud(snap, scn) {
    var namesMap = snap.names || { a: '他', b: '她' };
    var colorsMap = snap.colors || { a: 'red', b: 'yellow' };
    var meta = snap.meta || {};
    var turn = snap.turn || 'a';
    document.getElementById('nm-a').textContent = namesMap.a;
    document.getElementById('nm-b').textContent = namesMap.b;
    ['a', 'b'].forEach(function (pid) {
      var row = document.getElementById('turn-' + pid);
      var dot = document.getElementById('dot-' + pid);
      var color = colorsMap[pid];
      dot.style.background = HEX[color];
      dot.style.boxShadow = pid === turn ? ('0 0 12px 2px ' + hexA(HEX[color], .55)) : 'none';
      dot.style.opacity = pid === turn ? '1' : '.7';
      row.classList.toggle('on', pid === turn);
      row.style.background = pid === turn
        ? 'linear-gradient(180deg,' + hexA(HEX[color], .17) + ',' + hexA(HEX[color], .05) + ')'
        : 'transparent';
      row.style.border = pid === turn ? ('1px solid ' + hexA(HEX[color], .3)) : '1px solid transparent';
      var tag = row.querySelector('.v6-tstate');
      if (tag) tag.textContent = pid === turn ? '的回合' : '下一手';
    });
    var pieces = document.querySelectorAll('[data-piece]');
    var flying = 0, home = 0;
    Array.prototype.forEach.call(pieces, function (el) {
      var sq = String(el.getAttribute('data-piece-square') || '');
      if (el.getAttribute('data-arrived') === '1') home++;
      else if (sq.indexOf('hangar:') !== 0) flying++;
    });
    var stage = meta.stage || 'cold';
    document.getElementById('s-home').textContent =
      (namesMap.a.slice(0, 1) || '红') + ' ' + home + '/2 · ' + (namesMap.b.slice(0, 1) || '黄') + ' 0/2';
    document.getElementById('s-heat').textContent = '心动值 ' + (meta.heat || 0);
    document.getElementById('s-streak').textContent = '连击 ' + (meta.streak || 0);
    document.getElementById('s-stage').textContent = STAGE_NAMES[stage] || '灯刚亮';
    document.getElementById('s-fly').textContent = '在飞 ' + flying + ' 架';
    document.getElementById('s-round').textContent = '第 ' + (scn && scn.round ? scn.round : 3) + ' 回合';
    document.getElementById('die-text').textContent = scn && scn.die ? ('掷出 ' + scn.die) : '还没掷骰';
    paintDie(scn ? scn.die : 0);
    document.getElementById('landing').textContent = (scn && scn.landing) || '—';
    document.getElementById('receipt').textContent = scn && scn.winner
      ? (namesMap[turn] + ' 先到家 · 已到家 2/2 架')
      : ('她 刚记下一张 · 心动值 ' + (meta.heat || 0));
    document.getElementById('hint').textContent = scn && scn.winner
      ? '窗外开始亮起来了。'
      : '掷到 6 起飞；连续两次没 6，第三次任意点数保底。';
  }
  function hexA(hex, a) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return 'rgba(243,192,119,' + a + ')';
    var n = parseInt(m[1], 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  /* ---------------- 播放（与 table.js 同构：棋盘/场景并行，不 await 场景） ---------------- */
  var scene = null;
  var lastPlay = null;
  var current = 'initial';
  var cardEl = document.getElementById('demoCard');

  function closeCard() {
    cardEl.classList.remove('on');
    if (scene) scene.setMood({ overlay: false });
  }
  cardEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-card]');
    if (!b) return;
    closeCard();
    document.getElementById('receipt').textContent = '记下了 · 今晚第 3 张';
  });

  function setScenario(name) {
    var key = SCENARIOS[name] ? name : 'initial';
    var scn = SCENARIOS[key];
    current = key;
    var snap = clone(scn.snapshot);
    board.setState(snap);
    board.setChoices([]);
    closeCard();
    paintHud(snap, scn);
    var mood0 = scn.mood0 || scn.mood || { heat: 0, stage: 'cold', turn: 'a', winner: null, phase: 'playing', overlay: false };
    if (scene) scene.setMood(mood0);
    return { key: key, scn: scn, snap: snap };
  }

  function run(name) {
    var ctx = setScenario(name);
    var scn = ctx.scn;
    if (!scn.events.length) {
      lastPlay = { played: 0, totalMs: 0 };
      return Promise.resolve(lastPlay);
    }
    var playDone = board.play(scn.events);
    if (scene) {
      /* 场景失败/缺失不影响棋局 */
      try { scene.play(scn.events, { state: ctx.snap }); } catch (e) {}
    }
    return playDone.then(function (res) {
      lastPlay = res;
      paintHud(ctx.snap, scn);
      if (scn.overlay) {
        cardEl.classList.add('on');
        if (scene) scene.setMood({ overlay: true });
      }
      if (scene) {
        var mood = {};
        var baseMood = scn.mood || {};
        Object.keys(baseMood).forEach(function (k) { mood[k] = baseMood[k]; });
        if (scn.overlay) mood.overlay = true;
        scene.setMood(mood);
      }
      return res;
    });
  }

  /* 直接播一组已有事件（不做场景重置；与 table 的 commit 同构） */
  function playEvents(events) {
    var list = (events || []).slice();
    if (!list.length) return Promise.resolve(null);
    var boardP = board.play(list);
    if (scene) { try { scene.play(list, {}); } catch (e) {} }
    return boardP.then(function (res) {
      lastPlay = res;
      paintHud(SCENARIOS[current].snapshot, SCENARIOS[current]);
      return res;
    });
  }

  /* ---------------- 指标 / 帧采样 ---------------- */
  function metrics() {
    var d = scene ? scene._debug() : null;
    return {
      squares: document.querySelectorAll('[data-square]').length,
      ring: document.querySelectorAll('[data-square^="ring:"]').length,
      hangar: document.querySelectorAll('[data-square^="hangar:"]').length,
      home: document.querySelectorAll('[data-square^="home:"]').length,
      goal: document.querySelectorAll('[data-square$=":goal"]').length,
      pieces: document.querySelectorAll('[data-piece]').length,
      cabin: !!document.querySelector('[data-test="cabin"]'),
      cabinRoot: !!document.querySelector('.cabin-root'),
      cabinPointerEvents: (function () {
        var c = document.querySelector('[data-test="cabin"]');
        return c ? getComputedStyle(c).pointerEvents : null;
      })(),
      rootPointerEvents: (function () {
        var c = document.querySelector('.cabin-root');
        return c ? getComputedStyle(c).pointerEvents : null;
      })(),
      boardTransform: boardEl.style.transform,
      viewport: [window.innerWidth, window.innerHeight],
      scrollW: document.documentElement.scrollWidth,
      bodyScrollW: document.body.scrollWidth,
      scene: d
    };
  }
  function renderMetrics() {
    var el = document.getElementById('metrics');
    if (!el) return;
    var m = metrics();
    var d = m.scene || {};
    el.textContent =
      '格 ' + m.squares + '（环' + m.ring + '/坪' + m.hangar + '/航线' + m.home + '/终点' + m.goal + '）· 子 ' + m.pieces + '\n' +
      'cabin=' + m.cabin + ' root=' + m.cabinRoot + ' pe=' + m.cabinPointerEvents + '/' + m.rootPointerEvents + '\n' +
      'board transform: ' + (m.boardTransform || '(none)') + '\n' +
      'scene: dawn ' + (d.dawn != null ? d.dawn.toFixed(2) : '-') + ' warm ' + (d.warm != null ? d.warm.toFixed(2) : '-') +
      ' frames ' + (d.sceneFrames || 0) + ' raf ' + d.sceneRaf + ' cam ' + d.camRaf + ' camActive ' + d.camActive + '\n' +
      'boardBox ' + JSON.stringify(d.board) + ' particles ' + d.particleCount + ' dpr ' + d.dpr + '\n' +
      'vp ' + m.viewport.join('×') + ' scrollW ' + m.scrollW + '/' + m.bodyScrollW +
      ' play ' + (lastPlay ? (lastPlay.totalMs + 'ms/' + lastPlay.played) : '-');
  }
  function sampleFrames(ms) {
    ms = ms || 3000;
    return new Promise(function (resolve) {
      var deltas = [];
      var last = performance.now();
      var t0 = last;
      function tick(t) {
        deltas.push(t - last);
        last = t;
        if (t - t0 < ms) requestAnimationFrame(tick);
        else {
          var sorted = deltas.slice().sort(function (a, b) { return a - b; });
          var long = deltas.filter(function (d) { return d > 25; }).length;
          resolve({
            frames: deltas.length, durationMs: Math.round(t - t0),
            longFrames: long,
            ratio: deltas.length ? +(long / deltas.length * 100).toFixed(2) : 0,
            p95: sorted.length ? +sorted[Math.floor(sorted.length * 0.95)].toFixed(2) : 0,
            max: sorted.length ? +sorted[sorted.length - 1].toFixed(2) : 0,
            avg: deltas.length ? +(deltas.reduce(function (a, b) { return a + b; }, 0) / deltas.length).toFixed(2) : 0
          });
        }
      }
      requestAnimationFrame(tick);
    });
  }

  /* ---------------- 工具条 ---------------- */
  document.getElementById('tools').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'reset') run('initial');
    if (a === 'reduced') {
      var on = b.getAttribute('data-on') !== '1';
      b.setAttribute('data-on', on ? '1' : '0');
      b.classList.toggle('on', on);
      if (scene) scene.setReduced(on);
      if (board && board.setReduced) board.setReduced(on);
    }
    if (a === 'metrics') {
      var el = document.getElementById('metrics');
      el.hidden = !el.hidden;
      if (!el.hidden) renderMetrics();
    }
    if (a === 'hide') document.body.classList.toggle('no-ui');
  });
  document.getElementById('demoTriggers').addEventListener('click', function (e) {
    var b = e.target.closest('[data-scn]');
    if (!b) return;
    run(b.getAttribute('data-scn')).then(renderMetrics);
  });
  document.getElementById('rollBtn').addEventListener('click', function () {
    run('dice').then(renderMetrics);
  });
  window.addEventListener('resize', function () { if (document.getElementById('metrics').hidden === false) renderMetrics(); });

  /* ---------------- 启动 ---------------- */
  function boot() {
    var reduced = params.get('reduced') === '1';
    board.mount(boardEl, { reduced: reduced, sound: false });
    scene = cabin.mount(cabinHost, { boardEl: boardEl, reduced: reduced, sound: false, names: { a: '他', b: '她' } });

    var name = params.get('scenario') || 'initial';
    if (!SCENARIOS[name]) name = 'initial';
    var first = run(name);
    var ready = first.then(function () {
      if (SCENARIOS[name] && SCENARIOS[name].waitDawn) {
        return new Promise(function (resolve) { setTimeout(resolve, 9000); });
      }
      return null;
    });
    ready.then(function () {
      if (params.get('debug') === '1') {
        document.getElementById('metrics').hidden = false;
        renderMetrics();
      }
      document.documentElement.setAttribute('data-demo-ready', '1');
      window.__demo.ready = true;
    });

    window.__demo = {
      board: board,
      cabin: cabin,
      scene: scene,
      scenarios: Object.keys(SCENARIOS),
      current: function () { return current; },
      run: function (n) { return run(n).then(function (r) { renderMetrics(); return r; }); },
      setScenario: setScenario,
      setReduced: function (f) { if (scene) scene.setReduced(!!f); if (board && board.setReduced) board.setReduced(!!f); },
      setMood: function (m) { if (scene) scene.setMood(m); },
      closeCard: closeCard,
      state: function () { return scene ? scene._debug() : null; },
      boardTransform: function () { return boardEl.style.transform; },
      squareList: function () {
        return Array.prototype.map.call(document.querySelectorAll('[data-square]'), function (el) {
          return el.getAttribute('data-square');
        });
      },
      squareHit: function (id) {
        var el = document.querySelector('[data-square="' + id + '"]');
        if (!el) return { found: false };
        var r = el.getBoundingClientRect();
        var x = r.left + r.width / 2, y = r.top + r.height / 2;
        var hit = document.elementFromPoint(x, y);
        var sq = hit && hit.closest ? hit.closest('[data-square]') : null;
        return {
          found: true, x: Math.round(x), y: Math.round(y),
          hitTag: hit ? hit.tagName : null,
          hitSquare: sq ? sq.getAttribute('data-square') : null,
          inCabin: !!(hit && hit.closest && hit.closest('.cabin-root'))
        };
      },
      metrics: metrics,
      renderMetrics: renderMetrics,
      sampleFrames: sampleFrames,
      playEvents: playEvents,
      lastPlay: function () { return lastPlay; },
      ready: false
    };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
