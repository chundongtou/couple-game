<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>FullGame CDN test</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#eee;font-family:sans-serif}
#unity-canvas{width:100%;height:100%;display:block}
#status{position:fixed;left:12px;top:12px;z-index:9;background:#000a;padding:6px 10px;border-radius:6px}
</style>
</head>
<body>
<div id="status">loading…</div>
<canvas id="unity-canvas" width="1280" height="720"></canvas>
<script src="https://raw.githubusercontent.com/chundongtou/couple-game/722487f/fullgame/Build/FullWebGL.loader.js"></script>
<script>
const status = document.getElementById('status');
const build = 'https://raw.githubusercontent.com/chundongtou/couple-game/722487f/fullgame/Build';
createUnityInstance(document.getElementById('unity-canvas'), {
  dataUrl: build + '/FullWebGL.data.unityweb',
  frameworkUrl: build + '/FullWebGL.framework.js.unityweb',
  codeUrl: build + '/FullWebGL.wasm.unityweb',
  streamingAssetsUrl: build + '/StreamingAssets',
  companyName: 'CoupleGame',
  productName: 'FullGameCDN',
  productVersion: '0.1'
}, (p) => { status.textContent = 'loading ' + Math.round(p * 100) + '%'; })
.then((instance) => {
  window.__unityInstance = instance;
  status.textContent = 'ready';
  instance.SendMessage('FullGame', 'WebRoll');
})
.catch((e) => { status.textContent = 'ERROR: ' + e; console.error(e); });
</script>
</body>
</html>
