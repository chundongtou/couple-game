<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070411">
<title>飞行棋 · 3D 开局</title>
<style>
  :root{--bg:#070411;--ink:#f6efff;--dim:#a99abf;--dim2:#76678f;--gold:#f3c879;--rose:#ff5f9e;--violet:#9b6cff;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.18);--glass:rgba(18,10,33,.74);--safe-b:calc(112px + env(safe-area-inset-bottom,0px))}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:auto;background:radial-gradient(80% 50% at 50% 0%,rgba(80,35,120,.25),transparent 60%),#070411;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  body{padding-bottom:var(--safe-b)}
  .wrap{max-width:460px;margin:0 auto;padding:18px 16px 28px}
  .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
  .head h1{font-size:19px;margin:0;letter-spacing:.06em}
  .head .tag{font-size:8.5px;letter-spacing:.16em;color:var(--gold);border:1px solid rgba(243,200,121,.28);border-radius:999px;padding:6px 9px;white-space:nowrap}
  .sub{font-size:10px;line-height:1.7;color:var(--dim2);margin:0 0 14px}
  .resume{display:none;margin:0 0 12px;padding:11px 12px;border:1px solid rgba(243,200,121,.35);border-radius:16px;background:linear-gradient(135deg,rgba(243,200,121,.13),rgba(255,95,158,.07));align-items:center;gap:9px}
  .resume.on{display:flex}
  .resume .tx{flex:1;min-width:0}.resume b{display:block;font-size:12px}.resume span{display:block;font-size:9.5px;color:var(--dim2);margin-top:3px}
  .resume button{height:38px;padding:0 12px;border-radius:11px;border:0;background:linear-gradient(135deg,#f3c879,#ff5f9e);color:#2a1206;font-size:11px;font-weight:800}
  .resume .x{background:transparent;border:1px solid var(--line);color:var(--dim);padding:0 9px}
  .group{border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:13px 13px 12px;margin:0 0 10px}
  .group h2{font-size:12px;margin:0 0 10px;color:var(--ink);letter-spacing:.05em;display:flex;align-items:baseline;gap:7px}
  .group h2 span{font-size:9px;color:var(--dim2);font-weight:400;letter-spacing:.02em}
  .row{display:flex;align-items:center;gap:8px;margin:8px 0}
  .row .lbl{width:58px;flex:0 0 auto;font-size:10px;color:var(--dim)}
  .opts{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .opt{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--dim);font-size:11px}
  .opt.on{border-color:rgba(243,200,121,.5);background:rgba(243,200,121,.12);color:var(--ink);font-weight:800}
  .names{display:flex;gap:7px;flex:1}
  .names input{flex:1;min-width:0;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font-size:12px;padding:0 9px}
  .laps-row{display:none}.laps-row.on{display:flex}
  .diy{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .diy select{flex:1;min-width:0;height:38px;border-radius:10px;border:1px solid var(--line);background:#140b26;color:var(--ink);font-size:11px;padding:0 8px}
  .diy a{color:var(--gold);font-size:9.5px;text-decoration:none;border-bottom:1px dotted rgba(243,200,121,.4);white-space:nowrap}
  .diysum{width:100%;font-size:9.5px;color:var(--dim2);line-height:1.6}
  .foot{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,rgba(7,4,17,.92) 35%,#070411)}
  .start{width:min(428px,100%);min-height:56px;display:block;margin:0 auto;border:0;border-radius:16px;background:linear-gradient(135deg,#f3c879,#ff5f9e);color:#2a1206;font-size:15px;font-weight:850;letter-spacing:.08em;box-shadow:0 10px 28px rgba(255,95,158,.25)}
  .foot p{margin:7px 0 0;text-align:center;font-size:9px;color:var(--dim2)}
  .loading{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(7,4,17,.97);color:var(--ink);text-align:center;padding:24px}
  .loading.on{display:flex}.sp{width:32px;height:32px;border:2px solid rgba(243,200,121,.2);border-top-color:var(--gold);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
  .loading b{font-size:13px}.loading span{font-size:10px;color:var(--dim)}
  .loading .acts{display:none;gap:7px;margin-top:8px}.loading .acts button{height:38px;padding:0 12px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--ink);font-size:10.5px}
  .loading .acts button:first-child{background:linear-gradient(135deg,#f3c879,#ff5f9e);color:#2a1206;border:0}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:5000;background:#070411}
  @media (max-width:360px){.opt{padding:0 9px}.row .lbl{width:50px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>✈️ 飞行棋 · 3D 开局</h1><span class="tag">80 格夜航</span></div>
  <p class="sub">旧地址不变。选好之后，直接进入 3D 棋盘。</p>

  <div class="resume" id="resume">
    <div class="tx"><b>继续 3D 棋局</b><span id="resumeInfo"></span></div>
    <button id="resumeGo" type="button">继续</button>
    <button class="x" id="resumeX" type="button">新开</button>
  </div>

  <section class="group">
    <h2>基础 <span>人数 · 称呼 · 玩法</span></h2>
    <div class="row"><span class="lbl">人数</span><div class="opts" id="players"><button class="opt" data-n="2">2 人</button><button class="opt" data-n="4">4 人</button></div></div>
    <div class="row"><span class="lbl">称呼</span><div class="names"><input id="nameM" maxlength="6" placeholder="男方称呼"><input id="nameF" maxlength="6" placeholder="女方称呼"></div></div>
    <div class="row" id="p34Row" style="display:none"><span class="lbl">3/4 号</span><div class="names"><input id="nameP3" maxlength="6" placeholder="玩家3"><input id="nameP4" maxlength="6" placeholder="玩家4"></div></div>
    <div class="row"><span class="lbl">玩法</span><div class="opts" id="modes"><button class="opt" data-mode="A">对飞</button><button class="opt" data-mode="B">环岛</button><button class="opt" data-mode="C">双轨</button><button class="opt" data-mode="D">融合</button></div></div>
    <div class="row laps-row" id="lapsRow"><span class="lbl">圈数</span><div class="opts" id="laps"><button class="opt" data-laps="1">1 圈</button><button class="opt" data-laps="2">2 圈</button><button class="opt" data-laps="3">3 圈</button></div></div>
  </section>

  <section class="group">
    <h2>节奏 <span>难度</span></h2>
    <div class="row"><span class="lbl">难度</span><div class="opts" id="diffs"><button class="opt" data-diff="1">温柔</button><button class="opt" data-diff="2">轻</button><button class="opt" data-diff="3">标准</button><button class="opt" data-diff="4">刺激</button></div></div>
  </section>

  <section class="group">
    <h2>DIY 预设 <span>沿用上次</span></h2>
    <div class="diy">
      <select id="diySelect"></select>
      <a href="classic.html?game=flight&embed=1">完整旧设置</a>
      <div class="diysum" id="diySum"></div>
    </div>
  </section>
</div>

<div class="foot">
  <button class="start" id="start" type="button">进入 3D 夜航</button>
  <p>进入后原地址不变 · 3D 加载慢会自动提示</p>
</div>

<div class="loading" id="loading">
  <div class="sp"></div><b>3D 棋盘加载中…</b><span>第一次加载会慢一点</span>
  <div class="acts"><button id="retry" type="button">重新加载</button><button id="classic" type="button">旧版 2D</button></div>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var game = params.get('game') || 'flight';
  if (game === 'truth' || game === 'dare') {
    location.replace('classic.html?game=' + encodeURIComponent(game) + '&embed=1');
    return;
  }
  var KEY = 'couple3d.liteSetup';
  var DIY_KEY = 'couple-flight-diy-presets-v1';
  var SAVE_KEY = 'couple3d.flightSave';
  var setup = { n:2, m:1, f:1, mode:'A', laps:1, diff:3, names:{m:'他',f:'她',p3:'玩家3',p4:'玩家4'} };
  try { var old = JSON.parse(localStorage.getItem(KEY) || 'null'); if (old) setup = Object.assign(setup, old, { names: Object.assign(setup.names, old.names || {}) }); } catch(e) {}
  var $ = function(id){ return document.getElementById(id); };
  var diyStore = null;
  try { diyStore = JSON.parse(localStorage.getItem(DIY_KEY) || 'null'); } catch(e) {}
  function activeDiy(){
    if (!diyStore || !diyStore.presets || !diyStore.presets.length) return null;
    var p = null; diyStore.presets.forEach(function(x){ if (x.id === diyStore.activeId) p = x; });
    return p || diyStore.presets[0];
  }
  function saveSetup(){ try { localStorage.setItem(KEY, JSON.stringify(setup)); } catch(e){} }
  function bindOpts(box, key){
    Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(b){
      b.addEventListener('click', function(){
        setup[key] = (key === 'mode') ? b.getAttribute('data-mode') : Number(b.getAttribute('data-' + key));
        render(); saveSetup();
      });
    });
  }
  bindOpts($('players'), 'n');
  bindOpts($('modes'), 'mode');
  bindOpts($('laps'), 'laps');
  bindOpts($('diffs'), 'diff');
  ['nameM','nameF','nameP3','nameP4'].forEach(function(id){
    $(id).addEventListener('input', function(){
      if (id === 'nameM') setup.names.m = $(id).value.slice(0,6);
      if (id === 'nameF') setup.names.f = $(id).value.slice(0,6);
      if (id === 'nameP3') setup.names.p3 = $(id).value.slice(0,6);
      if (id === 'nameP4') setup.names.p4 = $(id).value.slice(0,6);
      saveSetup();
    });
  });
  function render(){
    if (setup.n !== 4) { setup.m = 1; setup.f = 1; }
    Array.prototype.forEach.call($('players').children, function(b){ b.classList.toggle('on', Number(b.getAttribute('data-n')) === setup.n); });
    Array.prototype.forEach.call($('modes').children, function(b){ b.classList.toggle('on', b.getAttribute('data-mode') === setup.mode); });
    Array.prototype.forEach.call($('laps').children, function(b){ b.classList.toggle('on', Number(b.getAttribute('data-laps')) === setup.laps); });
    Array.prototype.forEach.call($('diffs').children, function(b){ b.classList.toggle('on', Number(b.getAttribute('data-diff')) === setup.diff); });
    $('p34Row').style.display = setup.n === 4 ? 'flex' : 'none';
    $('lapsRow').classList.toggle('on', setup.mode === 'B' || setup.mode === 'D');
    $('nameM').value = setup.names.m || '';
    $('nameF').value = setup.names.f || '';
    $('nameP3').value = setup.names.p3 || '玩家3';
    $('nameP4').value = setup.names.p4 || '玩家4';
    var d = activeDiy();
    var sel = $('diySelect');
    sel.innerHTML = '';
    if (diyStore && diyStore.presets) {
      diyStore.presets.forEach(function(p){
        var o = document.createElement('option'); o.value = p.id; o.textContent = p.name + (p.builtin ? ' · 内置' : '');
        if (d && p.id === d.id) o.selected = true;
        sel.appendChild(o);
      });
    } else {
      var o = document.createElement('option'); o.textContent = '未选择'; sel.appendChild(o);
    }
    $('diySum').textContent = d ? ('当前：' + d.name + ' · ' + (d.cards || []).length + ' 张自定义卡') : '未读取到 DIY 预设';
    var save = null;
    try { save = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch(e) {}
    var card = $('resume');
    if (save && save.positions && save.positions.length) {
      card.classList.add('on');
      $('resumeInfo').textContent = '他 ' + save.positions[0] + ' 格 · 第 ' + ((save.turn || 0) + 1) + ' 位 · 温度 ' + (save.heat || 0);
    } else card.classList.remove('on');
  }
  $('diySelect').addEventListener('change', function(){
    if (!diyStore) return;
    diyStore.activeId = this.value;
    try { localStorage.setItem(DIY_KEY, JSON.stringify(diyStore)); } catch(e){}
    render();
  });
  $('resumeX').addEventListener('click', function(){ try { localStorage.removeItem(SAVE_KEY); } catch(e){}; render(); });
  $('resumeGo').addEventListener('click', function(){ launch(true); });
  $('start').addEventListener('click', function(){ launch(false); });
  $('retry').addEventListener('click', function(){ launch(false); });
  $('classic').addEventListener('click', function(){ location.href = 'classic.html?game=flight&embed=1'; });

  var frame = null;
  function launch(resume){
    saveSetup();
    var d = activeDiy();
    var payload = {
      v:1, ts:Date.now(),
      setup: {
        n: setup.n, m: setup.m, f: setup.f,
        mode: setup.mode, modeName: ({A:'对飞',B:'环岛',C:'双轨',D:'融合'})[setup.mode],
        laps: setup.laps, diff: setup.diff,
        names: setup.names, lite: true
      },
      diy: d,
      resume: !!resume
    };
    try { localStorage.setItem('couple3d.flightLaunch', JSON.stringify(payload)); } catch(e){}
    var old = document.getElementById('v3Flight3DFrame'); if (old) old.remove();
    frame = document.createElement('iframe');
    frame.id = 'v3Flight3DFrame';
    frame.src = '../3d/?from=arcade&embed=1';
    frame.setAttribute('allow','fullscreen');
    document.body.appendChild(frame);
    var ld = $('loading'); ld.classList.add('on');
    var loaded = false;
    frame.addEventListener('load', function(){ loaded = true; ld.classList.remove('on'); });
    setTimeout(function(){
      if (loaded) return;
      ld.querySelector('b').textContent = '3D 还没有加载出来';
      ld.querySelector('span').textContent = '可以重试，或先用旧版 2D。';
      ld.querySelector('.acts').style.display = 'flex';
    }, 12000);
  }
  window.addEventListener('message', function(e){
    if (!e || !e.data) return;
    if (e.data.type === 'arcade:flight-wish') {
      if (window.parent !== window) { try { window.parent.postMessage(e.data, '*'); } catch(err){} }
      else { try { localStorage.setItem('couple3d.wish', JSON.stringify(e.data)); } catch(err){} }
      return;
    }
    if (e.data.type === 'arcade:back') {
      var f = document.getElementById('v3Flight3DFrame'); if (f) f.remove();
      $('loading').classList.remove('on');
      render();
    }
  });
  render();
})();
</script>
</body>
</html>
