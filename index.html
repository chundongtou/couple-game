  background:radial-gradient(120% 90% at 18% 0%,#FDF5E7 0%,var(--paper,#F7EAD6) 52%,var(--paper2,var(--paper-2,#F1DFC4)) 100%);

.pc-inner{position:relative;z-index:1}
.pc-top{display:flex;align-items:flex-start;gap:8px}

.pc-kicker .pc-actor{color:#5A2E1C}
.pc-kicker .pc-tail{color:#8A5A32;font-weight:650}

.pc-stars{color:#C8902F;font-size:13px;letter-spacing:.14em}
.pc-meta .pc-dot{opacity:.5}
.pc-reroll{min-height:30px;padding:0 10px;border-radius:999px;border:1px solid rgba(90,50,30,.22);
  background:rgba(255,255,255,.35);color:#6E4A33;font-size:11px;font-weight:700;letter-spacing:.04em;font-family:inherit}
.pc-reroll[disabled]{opacity:.42}
.pc-legend-btn{min-height:30px;padding:0 8px;border-radius:999px;border:1px solid rgba(90,50,30,.24);
  color:#8A6A50;font-size:10.5px;line-height:1;background:transparent;font-family:inherit;letter-spacing:.02em}
.pc-legend{display:none;margin-top:6px;font-size:11px;line-height:1.5;color:#6E4A33;background:rgba(255,255,255,.35);
  border-radius:10px;padding:7px 9px}
.pc-legend.on{display:block}

  font-weight:600;font-size:clamp(17px,4.7vw,21px);line-height:1.58;letter-spacing:.01em;color:#2B1A12}

.mg-head{display:flex;align-items:flex-start;gap:10px}

.mg-title{font-family:var(--font-display,var(--font,"Noto Serif SC","Songti SC",serif));font-size:22px;line-height:1.2;font-weight:700;color:var(--ink,#FBF3E7)}

.mg-range{width:100%;margin:10px 0 2px;accent-color:var(--rose,#E9887A);height:34px}
.mg-ticks{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim2,#8E7C9E);letter-spacing:.04em}
.mg-acts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.mg-btn{width:100%;min-height:48px;border-radius:999px;font-size:15px;font-weight:800;letter-spacing:.12em;font-family:inherit;

.mg-cover p{font-size:13px;line-height:1.6;color:var(--dim2,#8E7C9E);margin:0}

.mg-hub{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;z-index:2;

.lg-page{background:radial-gradient(120% 60% at 50% 0%,rgba(36,21,64,.5) 0%,rgba(8,6,15,.9) 60%,var(--bg0,#08060F) 100%);
  color:var(--ink,#FBF3E7);padding-bottom:calc(28px + var(--safe-b,0px))}
.lg-done{position:relative;margin-top:6px;padding:18px 16px;border-radius:var(--r-lg,26px);
  background:linear-gradient(180deg,rgba(243,192,119,.16),rgba(233,136,122,.08));
  border:1px solid rgba(243,192,119,.26);overflow:hidden}
.lg-done::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(60% 90% at 85% 0%,rgba(233,136,122,.22),transparent 70%)}
.lg-done-title{position:relative;font-family:var(--font-display,var(--font,"Noto Serif SC","Songti SC",serif));
  font-size:clamp(28px,8.4vw,38px);line-height:1.15;font-weight:700;color:var(--ink,#FBF3E7);letter-spacing:.04em}
.lg-done-sub{position:relative;margin-top:8px;font-size:12.5px;color:var(--dim,#C9B6CE);letter-spacing:.04em}
.lg-done-sub b{color:var(--amber,#F3C077);font-weight:700;font-variant-numeric:tabular-nums}
.lg-title{margin-top:22px;font-family:var(--font-display,var(--font,"Noto Serif SC","Songti SC",serif));
  font-size:clamp(24px,7vw,32px);line-height:1.2;font-weight:700;letter-spacing:.06em;color:var(--ink,#FBF3E7)}
.lg-sub{margin-top:6px;font-size:12.5px;color:var(--dim2,#8E7C9E);letter-spacing:.04em}
.lg-stats{margin-top:14px;border-radius:var(--r-lg,26px);overflow:hidden;
  background:var(--glass,rgba(38,27,58,.42));border:1px solid var(--line,rgba(255,226,196,.13));
  box-shadow:0 14px 34px rgba(3,2,10,.3)}
.lg-stat{display:flex;align-items:baseline;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line,rgba(255,226,196,.1))}
.lg-stat:last-child{border-bottom:0}
.lg-stat-label{flex:none;width:64px;font-size:11.5px;letter-spacing:.12em;color:var(--dim2,#8E7C9E);font-weight:700}
.lg-stat-val{flex:1;min-width:0;font-size:14px;line-height:1.5;color:var(--ink,#FBF3E7);word-break:break-word}
.lg-stat-val b{color:var(--amber,#F3C077);font-variant-numeric:tabular-nums}
.lg-curve{margin-top:12px;padding:12px 14px 10px;border-radius:var(--r-lg,26px);
  background:var(--glass,rgba(38,27,58,.42));border:1px solid var(--line,rgba(255,226,196,.13))}
.lg-curve svg{display:block;width:100%;height:64px}
.lg-curve-cap{display:flex;justify-content:space-between;gap:10px;margin-top:4px;font-size:11px;color:var(--dim2,#8E7C9E);letter-spacing:.06em}
.lg-curve-cap b{color:var(--amber,#F3C077);font-weight:700}
.lg-sec-title{margin-top:22px;font-size:11px;letter-spacing:.18em;color:var(--dim2,#8E7C9E);font-weight:800}
.lg-list{margin-top:8px;display:flex;flex-direction:column;gap:7px}
.lg-item{border-radius:16px;background:rgba(255,236,214,.045);border:1px solid var(--line,rgba(255,226,196,.12));overflow:hidden}
.lg-row{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:11px 12px;text-align:left;
  font-family:inherit;color:var(--ink,#FBF3E7);background:transparent}
.lg-row-main{flex:1;min-width:0;font-size:13px;line-height:1.5}
.lg-row-main .lg-who{color:var(--amber,#F3C077);font-weight:700}
.lg-row-main .lg-res{color:var(--dim,#C9B6CE)}
.lg-row-main .lg-res.skipped{color:var(--dim2,#8E7C9E)}
.lg-row-toggle{flex:none;font-size:10.5px;letter-spacing:.06em;color:var(--dim2,#8E7C9E);
  padding:6px 8px;border-radius:999px;border:1px solid var(--line,rgba(255,226,196,.14))}
.lg-row-text{display:none;padding:0 12px 12px;font-size:14px;line-height:1.7;color:var(--paper-ink,#2C1C15);
  background:radial-gradient(120% 90% at 18% 0%,#FDF5E7 0%,var(--paper,#F7EAD6) 60%,var(--paper2,var(--paper-2,#F1DFC4)) 100%);
  margin:0 10px 10px;border-radius:12px;padding:11px 12px;box-shadow:0 6px 16px rgba(3,2,10,.25)}
.lg-item.open .lg-row-text{display:block}
.lg-item.open .lg-row-toggle{color:var(--amber,#F3C077);border-color:rgba(243,192,119,.4)}
.lg-mini{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.lg-mini-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;
  font-size:12.5px;color:var(--dim,#C9B6CE);background:rgba(255,236,214,.04);border:1px solid var(--line,rgba(255,226,196,.1))}
.lg-mini-row .lg-mini-dot{width:6px;height:6px;border-radius:50%;background:var(--amber,#F3C077);flex:none}
.lg-empty{margin-top:10px;padding:14px;border-radius:16px;border:1px dashed rgba(255,226,196,.2);
  font-size:12.5px;line-height:1.65;color:var(--dim2,#8E7C9E)}
.lg-bound{margin-top:14px;font-size:10.5px;line-height:1.7;color:var(--dim2,#8E7C9E);letter-spacing:.03em}
.lg-actions{margin-top:20px;display:flex;flex-direction:column;gap:9px}
.lg-btn{width:100%;min-height:50px;border-radius:999px;font-size:15px;font-weight:800;letter-spacing:.1em;font-family:inherit;
  transition:transform var(--t-fast,160ms) var(--ease-out,cubic-bezier(.16,1,.3,1))}
.lg-btn:active{transform:scale(.985)}
.lg-btn.main{background:linear-gradient(180deg,var(--amber,#F3C077),var(--amber-deep,#E2965E));color:#2A140E;
  box-shadow:0 10px 26px rgba(243,192,119,.2)}
.lg-btn.soft{background:rgba(255,236,214,.08);border:1px solid var(--line,rgba(255,226,196,.16));color:var(--ink,#FBF3E7)}
.lg-btn.ghost{background:transparent;border:1px solid var(--line,rgba(255,226,196,.12));color:var(--dim,#C9B6CE);min-height:44px;font-size:13px}

.mg-hall-page{background:radial-gradient(120% 55% at 50% 0%,rgba(36,21,64,.55) 0%,rgba(8,6,15,.92) 62%,var(--bg0,#08060F) 100%);
  color:var(--ink,#FBF3E7)}
.mg-hall-title{margin-top:8px;font-family:var(--font-display,var(--font,"Noto Serif SC","Songti SC",serif));
  font-size:clamp(30px,9vw,42px);line-height:1.15;font-weight:700;letter-spacing:.06em}
.mg-hall-sub{margin-top:10px;font-size:13px;line-height:1.7;color:var(--dim,#C9B6CE)}
.mg-hall-list{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.mg-hall-card{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:12px 14px;border-radius:var(--r-md,18px);
  text-align:left;font-family:inherit;color:var(--ink,#FBF3E7);
  background:linear-gradient(180deg,rgba(255,236,214,.075),rgba(255,236,214,.03));
  border:1px solid var(--line,rgba(255,226,196,.13));
  box-shadow:0 10px 28px rgba(3,2,10,.28);transition:transform var(--t-fast,160ms) var(--ease-out,cubic-bezier(.16,1,.3,1))}
.mg-hall-card:active{transform:scale(.99)}
.mg-hall-ico{flex:none;width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display,var(--font,serif));font-size:20px;font-weight:700;color:#2A140E;
  background:radial-gradient(circle at 36% 30%,#FFE6BE,var(--amber,#F3C077) 56%,var(--amber-deep,#E2965E));
  box-shadow:0 6px 16px rgba(243,192,119,.22)}
.mg-hall-card.t2 .mg-hall-ico{background:radial-gradient(circle at 36% 30%,#FFD9D1,var(--rose,#E9887A) 58%,#B8554C)}
.mg-hall-card.t3 .mg-hall-ico{background:radial-gradient(circle at 36% 30%,#DCD3FF,#8E7BD8 58%,#5E42A0);color:#F6F0FF}
.mg-hall-body{flex:1;min-width:0}
.mg-hall-body b{display:block;font-size:16px;font-weight:700;letter-spacing:.04em}
.mg-hall-body span{display:block;margin-top:3px;font-size:11.5px;line-height:1.5;color:var(--dim2,#8E7C9E)}
.mg-hall-arrow{flex:none;color:var(--dim2,#8E7C9E);font-size:18px}
.mg-hall-acts{margin-top:18px;display:flex;flex-direction:column;gap:9px}
.mg-play-host{position:static}
.mg-result-card{margin-top:18px;padding:18px 16px;border-radius:var(--r-lg,26px);
  background:radial-gradient(120% 100% at 30% 0%,rgba(243,192,119,.16),rgba(38,27,58,.42));
  border:1px solid rgba(243,192,119,.24)}
.mg-result-big{font-family:var(--font-display,var(--font,"Noto Serif SC","Songti SC",serif));
  font-size:38px;line-height:1.15;font-weight:700;color:var(--amber,#F3C077)}
.mg-result-body{margin-top:8px;font-size:14px;line-height:1.65;color:var(--dim,#C9B6CE)}
.mg-result-text{margin-top:10px;font-family:var(--font-display,var(--font,"Noto Serif SC","Songti SC",serif));
  font-size:18px;line-height:1.55;color:var(--ink,#FBF3E7)}
.mg-actions{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.mg-act-btn{width:100%;min-height:50px;border-radius:999px;font-size:15px;font-weight:800;letter-spacing:.1em;font-family:inherit}
.mg-act-btn.main{background:linear-gradient(180deg,var(--amber,#F3C077),var(--amber-deep,#E2965E));color:#2A140E;
  box-shadow:0 10px 26px rgba(243,192,119,.2)}
.mg-act-btn.soft{background:rgba(255,236,214,.08);border:1px solid var(--line,rgba(255,226,196,.16));color:var(--ink,#FBF3E7)}
.mg-act-btn.ghost{background:transparent;border:1px solid var(--line,rgba(255,226,196,.12));color:var(--dim,#C9B6CE);min-height:44px;font-size:13px}
