.cs-bear{position:relative;display:block;width:100%;max-width:200px;margin:0 auto;pointer-events:none;
  -webkit-user-select:none;user-select:none;filter:drop-shadow(0 12px 20px rgba(3,2,10,.42));
  --ease-out:cubic-bezier(.16,1,.3,1);--ease-soft:cubic-bezier(.22,.8,.28,1);}
.cs-bear-svg{display:block;width:100%;height:auto;overflow:visible}
.cs-bear-shadow{fill:rgba(3,2,10,.34)}
.cs-bear-torso{fill:var(--b-fur,#C99A6B)}
.cs-bear-belly{fill:var(--b-belly,#F3DCC2)}
.cs-bear-ear-in{fill:var(--b-ear,#E9B7A0)}
.cs-bear-muzzle{fill:var(--b-muzzle,#F7E7D2)}
.cs-bear-nose{fill:var(--b-nose,#3A2418)}
.cs-bear-line{stroke:var(--b-nose,#3A2418);fill:none;stroke-linecap:round;stroke-width:2.2}
.cs-bear-blush{fill:var(--b-blush,#E9887A);opacity:.32}
.cs-bear-eye-white{fill:#FFF9F0}
.cs-bear-pupil{fill:var(--b-eye,#33221A)}
.cs-bear-spark{fill:#FFF6E6;opacity:.9}
.cs-bear-lid{fill:var(--b-fur,#C99A6B);transform-box:fill-box;transform-origin:center;transform:scaleY(0);animation:csBearBlink 5.4s var(--ease-soft) infinite}
.cs-bear-eye--r .cs-bear-lid{animation-delay:.05s}

/* 身体呼吸（只动躯干，头部/耳朵各自独立动画，互不抢 transform） */
.cs-bear-body{transform-box:view-box;transform-origin:70px 170px;animation:csBearBreath 5.8s ease-in-out infinite}
/* 耳朵抖：左右不同节奏，像不经意的耳朵一动 */
.cs-bear-ear{transform-box:fill-box}
.cs-bear-ear--l{transform-origin:80% 80%;animation:csBearEarL 7.3s ease-in-out infinite}
.cs-bear-ear--r{transform-origin:20% 80%;animation:csBearEarR 8.6s ease-in-out infinite}
/* 举牌：坐着时牌子轻轻晃 */
.cs-bear-sign{transform-box:fill-box;transform-origin:50% 100%;animation:csBearSignSway 6.2s ease-in-out infinite}
.cs-bear-sign-board{fill:var(--b-sign,#F7EAD6);stroke:var(--b-sign-line,#8A5A32);stroke-width:2}
.cs-bear-sign-pin{fill:var(--b-sign-line,#8A5A32)}
.cs-bear-glyph{fill:var(--b-glyph,#C4685E);stroke:none}
.cs-bear-glyph--letter{fill:var(--b-sign-line,#8A5A32)}
.cs-bear-glyph--play{fill:var(--b-glyph,#E2965E)}
.cs-bear-glyph--arrow{fill:none;stroke:var(--b-glyph,#8A5A32);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.cs-bear-glyph{display:none}
.cs-bear[data-glyph="heart"] .cs-bear-glyph--heart,
.cs-bear[data-glyph="star"] .cs-bear-glyph--star,
.cs-bear[data-glyph="letter"] .cs-bear-glyph--letter,
.cs-bear[data-glyph="play"] .cs-bear-glyph--play,
.cs-bear[data-glyph="arrow"] .cs-bear-glyph--arrow{display:inline}

/* 探头入场：从格子后面升起来，牌子随后举起 */
.cs-bear.cs-bear--in{animation:csBearRise .58s var(--ease-out) both}
.cs-bear.cs-bear--in .cs-bear-hold{transform-box:fill-box;transform-origin:50% 100%;animation:csBearSignUp .62s .16s var(--ease-out) both}

/* 动作 */
.cs-bear.is-nod .cs-bear-head{transform-box:view-box;transform-origin:70px 62px;animation:csBearNod .78s var(--ease-soft) both}
.cs-bear.is-put .cs-bear-hold{transform-box:fill-box;transform-origin:50% 100%;animation:csBearPut .82s var(--ease-soft) forwards}
.cs-bear.is-put .cs-bear-head{transform-box:view-box;transform-origin:70px 62px;animation:csBearTilt .82s var(--ease-soft) forwards}
.cs-bear.is-wave .cs-bear-arm--l{transform-box:fill-box;transform-origin:70% 15%;animation:csBearWave .56s var(--ease-soft) 2}
.cs-bear.is-happy .cs-bear-ear{animation:csBearEarHappy .42s var(--ease-soft) 3}
.cs-bear.is-happy .cs-bear-sign{animation:csBearSignHop .42s var(--ease-soft) 3}
.cs-bear.is-blink .cs-bear-lid{animation:csBearBlinkOnce .42s var(--ease-soft) both}
.cs-bear.is-ear .cs-bear-ear--l{animation:csBearEarTwitch .5s var(--ease-soft) 1}
.cs-bear.is-ear .cs-bear-ear--r{animation:csBearEarTwitch .5s .06s var(--ease-soft) 1}

@keyframes csBearRise{from{opacity:0;transform:translateY(44px) scale(.97)}to{opacity:1;transform:none}}
@keyframes csBearSignUp{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
@keyframes csBearBreath{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(1.4px) scaleY(1.004)}}
@keyframes csBearBlink{0%,93.5%,100%{transform:scaleY(0)}95.2%,97.4%{transform:scaleY(1)}}
@keyframes csBearBlinkOnce{0%,100%{transform:scaleY(0)}40%,60%{transform:scaleY(1)}}
@keyframes csBearEarL{0%,87%,100%{transform:rotate(0)}89.5%{transform:rotate(-9deg)}92%{transform:rotate(4.5deg)}94.5%{transform:rotate(-3deg)}97%{transform:rotate(0)}}
@keyframes csBearEarR{0%,90%,100%{transform:rotate(0)}92.5%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}97.5%{transform:rotate(0)}}
@keyframes csBearEarHappy{0%,100%{transform:rotate(0)}35%{transform:rotate(-12deg)}70%{transform:rotate(7deg)}}
@keyframes csBearEarTwitch{0%,100%{transform:rotate(0)}35%{transform:rotate(-10deg)}70%{transform:rotate(5deg)}}
@keyframes csBearSignSway{0%,100%{transform:rotate(0)}30%{transform:rotate(1.1deg)}65%{transform:rotate(-1.2deg)}}
@keyframes csBearSignHop{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-3px) rotate(1.5deg)}}
@keyframes csBearNod{0%,100%{transform:rotate(0) translateY(0)}28%{transform:rotate(2.4deg) translateY(3px)}48%{transform:rotate(3deg) translateY(5px)}72%{transform:rotate(-.8deg) translateY(1px)}}
@keyframes csBearTilt{to{transform:rotate(-3.2deg) translateY(2px)}}
@keyframes csBearPut{0%{transform:none}32%{transform:translateY(-3px) rotate(1deg)}100%{transform:translateY(19px) rotate(-4.5deg);opacity:.74}}
@keyframes csBearWave{0%,100%{transform:rotate(0)}35%{transform:rotate(-24deg)}70%{transform:rotate(-8deg)}}

/* 三套服装：同一只熊，换帽子/披风/纸围巾 */

  --b-fur:#C99A6B;--b-belly:#F3DCC2;--b-muzzle:#F7E7D2;--b-ear:#E9B7A0;--b-eye:#33221A;--b-nose:#3A2418;

  --b-blush:#E9887A;--b-accent:#8E7BD8;--b-accent-2:#6E5AB0;--b-gold:#F3C077;--b-cape:#34215C;--b-cape-line:#8E7BD8;

  --b-blush:#D98A74;--b-accent:#C9AE86;--b-accent-2:#B99A6E;--b-paper:#D9C3A1;--b-paper-2:#BFA277;--b-paper-line:#7A5B3A;

.pc-dock{position:relative;pointer-events:auto;width:100%;max-width:520px;border-radius:12px;padding:15px 16px 13px;color:#2A1D14;background:linear-gradient(160deg,#F6EBD8,#E7D5B6);border:1px solid rgba(176,138,87,.55);box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.24);overflow:hidden;transform-origin:50% 100%;animation:pcIn .26s var(--ease-out,cubic-bezier(.16,1,.3,1)) both}

@keyframes pcIn{from{opacity:0;transform:translateY(16px) scale(.99)}to{opacity:1;transform:none}}
body.reduce .pc-dock{animation-duration:80ms!important}
@media (prefers-reduced-motion: reduce){.pc-dock{animation-duration:80ms!important}}
.pc-inner{position:relative;z-index:1}
.pc-top{display:flex;align-items:flex-start;gap:8px}
.pc-kicker{flex:1;min-width:0;font-size:11px;letter-spacing:.1em;font-weight:700;color:#7A5A38;line-height:1.55;word-break:break-word}
.pc-kicker .pc-type{color:#732A35}
.pc-kicker .pc-sep{opacity:.5}
.pc-kicker .pc-actor{color:#4A2E1C}
.pc-kicker .pc-tail{color:#7A5A38;font-weight:500}
.pc-collapse{flex:none;min-height:30px;padding:0 9px;border-radius:5px;border:1px solid rgba(90,50,30,.28);background:rgba(255,255,255,.22);color:#6E4A33;font-size:10.5px;font-weight:600;letter-spacing:.04em;font-family:inherit}
.pc-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px;font-size:10.5px;letter-spacing:.04em;color:#8A6A50;min-height:22px}
.pc-stars{color:#A9793A;font-size:11px;letter-spacing:.14em}
.pc-meta .pc-dot{opacity:.5}
.pc-reroll,.pc-legend-btn{min-height:28px;padding:0 9px;border-radius:5px;border:1px solid rgba(90,50,30,.24);background:rgba(255,255,255,.22);color:#6E4A33;font-size:10.5px;font-weight:600;letter-spacing:.03em;font-family:inherit}
.pc-reroll[disabled]{opacity:.42}
.pc-legend-btn{padding:0 7px;background:transparent;color:#8A6A50;font-size:10px}
.pc-legend{display:none;margin-top:6px;font-size:10.5px;line-height:1.5;color:#6E4A33;background:rgba(255,255,255,.24);border:1px solid rgba(90,50,30,.16);border-radius:5px;padding:6px 8px}
.pc-legend.on{display:block}
.pc-text{position:relative;z-index:1;margin:10px 0 0;font-family:var(--font-display,serif);font-weight:600;font-size:clamp(17px,4.7vw,21px);line-height:1.6;letter-spacing:.01em;color:#2A1D14}
.pc-attrib{position:relative;z-index:1;margin-top:9px;font-size:11.5px;color:#7C4A30;letter-spacing:.03em;line-height:1.5}
.pc-attrib b{color:#4A2E1C}
.pc-acts{position:relative;z-index:1;display:flex;gap:9px;margin-top:13px}
.pc-btn{flex:1;min-height:46px;border-radius:8px;font-size:14.5px;font-weight:600;letter-spacing:.14em;font-family:inherit;transition:transform var(--t-fast,150ms) var(--ease-out,cubic-bezier(.16,1,.3,1))}
.pc-btn.ink{background:linear-gradient(180deg,#3A2519,#241610);color:#F6EBD8;border:1px solid rgba(176,138,87,.5);box-shadow:inset 0 1px 0 rgba(255,226,196,.16)}
.pc-btn.line{background:rgba(255,255,255,.2);border:1px solid rgba(90,50,30,.34);color:#4A2A1A}
.pc-btn.wide{width:100%}
.pc-btn[disabled]{opacity:.5}
.pc-foot{position:relative;z-index:1;margin-top:10px;font-size:9.5px;letter-spacing:.04em;color:#A0896C;text-align:center;line-height:1.5}
.pc-fate{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pc-opt{display:block;width:100%;text-align:left;min-height:74px;padding:11px 12px;border-radius:8px;border:1px solid rgba(90,50,30,.26);background:rgba(255,255,255,.28);color:#2A1D14;font-family:inherit;transition:transform var(--t-fast,150ms) var(--ease-out,cubic-bezier(.16,1,.3,1))}
.pc-opt-tag{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#732A35}
.pc-opt-text{display:block;margin-top:4px;font-family:var(--font-display,serif);font-size:14.5px;line-height:1.5;font-weight:600;color:#2A1D14}
.pc-lead{position:relative;z-index:1;margin:9px 0 0;font-size:12.5px;line-height:1.6;color:#6E4A33}
.pc-restore{display:none;margin-top:10px}
.pc-dock.pc-collapsed .pc-meta,.pc-dock.pc-collapsed .pc-text,.pc-dock.pc-collapsed .pc-attrib,.pc-dock.pc-collapsed .pc-acts,.pc-dock.pc-collapsed .pc-foot,.pc-dock.pc-collapsed .pc-fate,.pc-dock.pc-collapsed .pc-lead,.pc-dock.pc-collapsed .pc-legend{display:none!important}
.pc-dock.pc-collapsed .pc-restore{display:block}
.pc-dock.pc-collapsed .pc-collapse{display:none}

.mg-root{position:fixed;inset:0;z-index:32;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(7,5,14,.58);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  padding:0;pointer-events:auto;font-family:var(--font-body,var(--sans,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif));
  animation:mgFade 200ms var(--ease-out,cubic-bezier(.16,1,.3,1)) both}

.mg-panel{width:100%;max-width:520px;max-height:90vh;overflow-y:auto;overflow-x:hidden;
  border-radius:var(--r-lg,26px) var(--r-lg,26px) 0 0;

body.reduce .mg-panel{animation-duration:80ms!important}
@media (prefers-reduced-motion: reduce){.mg-panel{animation-duration:80ms!important}}
.mg-head{display:flex;align-items:flex-start;gap:10px}
.mg-head-main{flex:1;min-width:0}
.mg-title{font-family:var(--font-display,var(--font,"Noto Serif SC","Songti SC",serif));font-size:22px;line-height:1.2;font-weight:700;color:var(--ink,#FBF3E7)}
.mg-sub{margin-top:4px;font-size:11.5px;line-height:1.5;color:var(--dim2,#8E7C9E);letter-spacing:.02em}
.mg-hbtns{display:flex;gap:6px;flex-shrink:0}
.mg-hbtn{min-height:36px;padding:0 10px;border-radius:999px;border:1px solid var(--line,rgba(255,226,196,.13));
  background:rgba(255,236,214,.06);color:var(--dim,#C9B6CE);font-size:11.5px;font-weight:700;letter-spacing:.04em;font-family:inherit}
.mg-hbtn.ghost{background:transparent}
.mg-copy{margin:14px 0 0;font-size:14px;line-height:1.65;color:var(--dim,#C9B6CE)}
.mg-copy b{color:var(--ink,#FBF3E7)}
.mg-slider{display:block;margin-top:14px;padding:12px 13px 10px;border-radius:var(--r-md,18px);
  background:var(--glass,rgba(38,27,58,.42));border:1px solid var(--line,rgba(255,226,196,.13))}
.mg-slider-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

.mg-slider-val{font-family:var(--font-display,var(--font,"Noto Serif SC","Songti SC",serif));font-size:15px;color:var(--amber,#F3C077)}

.mg-acts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.mg-btn{width:100%;min-height:48px;border-radius:999px;font-size:15px;font-weight:800;letter-spacing:.12em;font-family:inherit;
  transition:transform var(--t-fast,160ms) var(--ease-out,cubic-bezier(.16,1,.3,1))}
.mg-btn:active{transform:scale(.985)}
.mg-btn.main{background:linear-gradient(180deg,var(--amber,#F3C077),var(--amber-deep,#E2965E));color:#2A140E;
  box-shadow:0 10px 26px rgba(243,192,119,.22)}
.mg-btn.soft{background:rgba(255,236,214,.08);border:1px solid var(--line,rgba(255,226,196,.13));color:var(--ink,#FBF3E7)}
.mg-btn.ghost{background:transparent;border:1px solid var(--line,rgba(255,226,196,.13));color:var(--dim,#C9B6CE);min-height:42px;font-size:13px;letter-spacing:.08em}
.mg-btn[disabled]{opacity:.4}
.mg-cover{margin-top:18px;padding:26px 16px;border-radius:var(--r-md,18px);
  background:radial-gradient(120% 90% at 50% 0%,rgba(243,192,119,.12),rgba(38,27,58,.42));
  border:1px solid var(--line,rgba(255,226,196,.13));text-align:center}
.mg-cover h2{font-family:var(--font-display,var(--font,"Noto Serif SC","Songti SC",serif));font-size:26px;line-height:1.3;margin:0 0 8px;color:var(--ink,#FBF3E7)}
.mg-cover p{font-size:13px;line-height:1.6;color:var(--dim2,#8E7C9E);margin:0}
.mg-cover .mg-acts{margin-top:18px}
.mg-result{margin-top:16px;padding:16px;border-radius:var(--r-md,18px);

.mg-result-num{font-family:var(--font-display,var(--font,"Noto Serif SC","Songti SC",serif));

.mg-result-num small{font-size:18px;color:var(--dim,#C9B6CE);margin-left:4px}
.mg-result-text{margin-top:8px;font-size:13.5px;line-height:1.65;color:var(--dim,#C9B6CE)}
.mg-wheel-wrap{position:relative;width:min(240px,64vw);height:min(240px,64vw);margin:16px auto 6px}

  border-left:9px solid transparent;border-right:9px solid transparent;border-top:18px solid var(--amber,#F3C077)}
.mg-rotor{width:100%;height:100%;border-radius:50%;position:relative;
  background:conic-gradient(
    rgba(243,192,119,.30) 0 60deg, rgba(233,136,122,.28) 60deg 120deg,
    rgba(142,123,216,.30) 120deg 180deg, rgba(243,192,119,.30) 180deg 240deg,

  border:1px solid rgba(255,226,196,.2)}
.mg-rotor.spinning{transition:transform 1.25s cubic-bezier(.15,.85,.18,1)}
.mg-hub{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;z-index:2;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 38% 32%,#FFE6BE,var(--amber,#F3C077) 55%,var(--amber-deep,#E2965E));

.mg-slot .mg-slot-text{min-width:0}

.mg-result-title{margin-top:14px;font-size:11px;letter-spacing:.16em;color:var(--dim2,#8E7C9E);font-weight:700}
.mg-card-text{margin-top:6px;font-family:var(--font-display,var(--font,"Noto Serif SC","Songti SC",serif));

.mg-note{margin-top:8px;font-size:11.5px;color:var(--dim2,#8E7C9E)}
.mg-empty{margin-top:16px;padding:14px;border-radius:14px;border:1px dashed rgba(255,226,196,.22);
  font-size:12.5px;line-height:1.6;color:var(--dim2,#8E7C9E)}

.lg-page{background:radial-gradient(120% 60% at 50% 0%,rgba(12,23,34,.85),rgba(7,8,13,.96) 62%,#07080D);color:var(--ink,#F2E8D8);padding-top:calc(64px + var(--safe-t,0px));padding-bottom:calc(28px + var(--safe-b,0px))}
.lg-done{position:relative;margin-top:6px;padding:18px 16px;border-radius:10px;background:linear-gradient(160deg,#F6EBD8,#E7D5B6);color:var(--paper-ink,#2A1D14);border:1px solid rgba(176,138,87,.55);box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.26);overflow:hidden}
.lg-done::before{content:"";position:absolute;left:14px;right:14px;top:8px;height:1px;background:linear-gradient(90deg,transparent,rgba(176,138,87,.8),transparent)}
.lg-done-title{position:relative;font-family:var(--font-display,var(--font,serif));font-size:clamp(26px,7.8vw,34px);line-height:1.16;font-weight:700;letter-spacing:.04em;color:#2A1D14}
.lg-done-sub{position:relative;margin-top:8px;font-size:12.5px;color:#6E5544;letter-spacing:.04em}
.lg-done-sub b{color:var(--wine,#732A35);font-weight:700;font-variant-numeric:tabular-nums}
.lg-title{margin-top:22px;font-family:var(--font-display,var(--font,serif));font-size:clamp(24px,7vw,32px);line-height:1.2;font-weight:700;letter-spacing:.05em;color:var(--ink,#F2E8D8)}
.lg-sub{margin-top:6px;font-size:12.5px;color:var(--dim2,#7E705C);letter-spacing:.04em}
.lg-stats{margin-top:14px;border-radius:10px;overflow:hidden;background:rgba(8,12,18,.72);border:1px solid var(--line,rgba(176,138,87,.24))}
.lg-stat{display:flex;align-items:baseline;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line,rgba(176,138,87,.16))}
.lg-stat:last-child{border-bottom:0}
.lg-stat-label{flex:none;width:62px;font-size:10.5px;letter-spacing:.14em;color:var(--dim2,#7E705C);font-weight:600}
.lg-stat-val{flex:1;min-width:0;font-size:13.5px;line-height:1.55;color:var(--ink,#F2E8D8);word-break:break-word}
.lg-stat-val b{color:var(--amber,#E0A45E);font-variant-numeric:tabular-nums}
.lg-curve{margin-top:12px;padding:12px 14px 10px;border-radius:10px;background:rgba(8,12,18,.72);border:1px solid var(--line,rgba(176,138,87,.24))}
.lg-curve svg{display:block;width:100%;height:64px}
.lg-curve-cap{display:flex;justify-content:space-between;gap:10px;margin-top:4px;font-size:10.5px;color:var(--dim2,#7E705C);letter-spacing:.08em}
.lg-curve-cap b{color:var(--amber,#E0A45E);font-weight:600}
.lg-sec-title{margin-top:22px;font-size:10.5px;letter-spacing:.2em;color:var(--dim,#B7A88F);font-weight:600}
.lg-list{margin-top:8px;display:flex;flex-direction:column;gap:7px}
.lg-item{border-radius:8px;background:rgba(8,12,18,.6);border:1px solid var(--line,rgba(176,138,87,.24));overflow:hidden}
.lg-row{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:11px 12px;text-align:left;font-family:inherit;color:var(--ink,#F2E8D8);background:transparent}
.lg-row-main{flex:1;min-width:0;font-size:12.5px;line-height:1.5}
.lg-row-main .lg-who{color:var(--amber,#E0A45E);font-weight:600}
.lg-row-main .lg-res{color:var(--dim,#B7A88F)}
.lg-row-main .lg-res.skipped{color:var(--dim2,#7E705C)}
.lg-row-toggle{flex:none;font-size:10px;letter-spacing:.06em;color:var(--dim2,#7E705C);padding:5px 7px;border-radius:4px;border:1px solid var(--line2,rgba(176,138,87,.4))}
.lg-row-text{display:none;margin:0 8px 8px;padding:11px 12px;border-radius:6px;font-size:13.5px;line-height:1.75;color:#2A1D14;background:linear-gradient(160deg,#F6EBD8,#E9D8BB);border:1px solid rgba(176,138,87,.45);box-shadow:0 6px 16px rgba(0,0,0,.28)}
.lg-item.open .lg-row-text{display:block}
.lg-item.open .lg-row-toggle{color:var(--amber,#E0A45E);border-color:rgba(176,138,87,.55)}
.lg-mini{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.lg-mini-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:12.5px;color:var(--dim,#B7A88F);background:rgba(8,12,18,.6);border:1px solid var(--line,rgba(176,138,87,.24))}
.lg-mini-row .lg-mini-dot{width:5px;height:5px;background:var(--amber,#E0A45E);transform:rotate(45deg);flex:none}
.lg-empty{margin-top:10px;padding:14px;border-radius:8px;border:1px dashed rgba(176,138,87,.4);font-size:12.5px;line-height:1.65;color:var(--dim2,#7E705C)}
.lg-bound{margin-top:14px;font-size:10.5px;line-height:1.7;color:var(--dim2,#7E705C);letter-spacing:.03em}
.lg-actions{margin-top:20px;display:flex;flex-direction:column;gap:9px}
.lg-btn{width:100%;min-height:50px;border-radius:10px;font-size:14.5px;font-weight:600;letter-spacing:.12em;font-family:inherit;transition:transform var(--t-fast,150ms) var(--ease-out,cubic-bezier(.16,1,.3,1))}
.lg-btn:active{transform:scale(.985)}
.lg-btn.main{background:linear-gradient(180deg,#DDB273,#B08A57 58%,#96703F);color:#1A120B;border:1px solid rgba(255,232,196,.26);box-shadow:inset 0 1px 0 rgba(255,240,215,.42),0 8px 20px rgba(0,0,0,.36)}
.lg-btn.soft{background:rgba(241,228,206,.06);border:1px solid var(--line2,rgba(176,138,87,.4));color:var(--ink,#F2E8D8)}
.lg-btn.ghost{background:transparent;border:1px solid var(--line,rgba(176,138,87,.22));color:var(--dim,#B7A88F);min-height:44px;font-size:12.5px}
.lg-btn.small{min-height:40px;font-size:11px;letter-spacing:.06em}
.lg-foot{margin-top:14px;text-align:center;font-size:10px;color:var(--dim2,#7E705C);letter-spacing:.08em}

.mg-hall-page{background:radial-gradient(120% 55% at 50% 0%,rgba(36,21,64,.55) 0%,rgba(8,6,15,.92) 62%,var(--bg0,#08060F) 100%);
  color:var(--ink,#FBF3E7)}
.mg-hall-title{margin-top:8px;font-family:var(--font-display,var(--font,"Noto Serif SC","Songti SC",serif));
  font-size:clamp(30px,9vw,42px);line-height:1.15;font-weight:700;letter-spacing:.06em}
.mg-hall-sub{margin-top:10px;font-size:13px;line-height:1.7;color:var(--dim,#C9B6CE)}
.mg-hall-list{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.mg-hall-card{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:12px 14px;border-radius:var(--r-md,18px);
  text-align:left;font-family:inherit;color:var(--ink,#FBF3E7);
  background:linear-gradient(180deg,rgba(255,236,214,.075),rgba(255,236,214,.03));
  border:1px solid var(--line,rgba(255,226,196,.13));
  box-shadow:0 10px 28px rgba(3,2,10,.28);transition:transform var(--t-fast,160ms) var(--ease-out,cubic-bezier(.16,1,.3,1))}
.mg-hall-card:active{transform:scale(.99)}
.mg-hall-ico{flex:none;width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display,var(--font,serif));font-size:20px;font-weight:700;color:#2A140E;
  background:radial-gradient(circle at 36% 30%,#FFE6BE,var(--amber,#F3C077) 56%,var(--amber-deep,#E2965E));
  box-shadow:0 6px 16px rgba(243,192,119,.22)}
.mg-hall-card.t2 .mg-hall-ico{background:radial-gradient(circle at 36% 30%,#FFD9D1,var(--rose,#E9887A) 58%,#B8554C)}
.mg-hall-card.t3 .mg-hall-ico{background:radial-gradient(circle at 36% 30%,#DCD3FF,#8E7BD8 58%,#5E42A0);color:#F6F0FF}
.mg-hall-body{flex:1;min-width:0}
.mg-hall-body b{display:block;font-size:16px;font-weight:700;letter-spacing:.04em}
.mg-hall-body span{display:block;margin-top:3px;font-size:11.5px;line-height:1.5;color:var(--dim2,#8E7C9E)}
.mg-hall-arrow{flex:none;color:var(--dim2,#8E7C9E);font-size:18px}
.mg-hall-acts{margin-top:18px;display:flex;flex-direction:column;gap:9px}
.mg-play-host{position:static}
.mg-result-card{margin-top:18px;padding:18px 16px;border-radius:var(--r-lg,26px);
  background:radial-gradient(120% 100% at 30% 0%,rgba(243,192,119,.16),rgba(38,27,58,.42));
  border:1px solid rgba(243,192,119,.24)}
.mg-result-big{font-family:var(--font-display,var(--font,"Noto Serif SC","Songti SC",serif));
  font-size:38px;line-height:1.15;font-weight:700;color:var(--amber,#F3C077)}
.mg-result-body{margin-top:8px;font-size:14px;line-height:1.65;color:var(--dim,#C9B6CE)}
.mg-result-text{margin-top:10px;font-family:var(--font-display,var(--font,"Noto Serif SC","Songti SC",serif));
  font-size:18px;line-height:1.55;color:var(--ink,#FBF3E7)}
.mg-actions{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.mg-act-btn{width:100%;min-height:50px;border-radius:999px;font-size:15px;font-weight:800;letter-spacing:.1em;font-family:inherit}
.mg-act-btn.main{background:linear-gradient(180deg,var(--amber,#F3C077),var(--amber-deep,#E2965E));color:#2A140E;
  box-shadow:0 10px 26px rgba(243,192,119,.2)}
.mg-act-btn.soft{background:rgba(255,236,214,.08);border:1px solid var(--line,rgba(255,226,196,.16));color:var(--ink,#FBF3E7)}
