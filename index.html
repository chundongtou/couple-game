      '<div class="st-scale-desc" id="stScaleDesc">' + scaleMeta(s.maxStar).desc + "</div>" +
      "</div>" +

      '<div class="glass st-card st-safe settings-enter">' +
      '<div class="st-card-head">安全词</div>' +
      '<p class="st-safe-text">任何时候说「<b>停</b>」，或长按屏幕上的「停」按钮 <b>2 秒</b>——今晚会直接温柔收尾。不扣数据，也不需要解释理由。</p>' +
      '<div class="st-safe-line">⌁ 可以随时反悔，这不算扫兴。</div>' +
      "</div>" +

      '<div class="glass st-card settings-enter">' +
      '<div class="st-card-head"><span>数据</span><span class="hint">只存在这台手机里</span></div>' +
      '<div class="st-data-actions">' +
      '<button class="btn soft wide" data-act="export" data-test="settings-export">⬇ 导出备份</button>' +
      '<button class="btn soft wide" data-act="import" data-test="settings-import">⬆ 导入备份</button>' +
      '<input type="file" accept="application/json,.json" data-test="settings-file" class="hidden" id="stFile">' +
      '<button class="btn danger wide" data-act="reset" data-test="settings-reset">清除所有数据</button>' +
      "</div>" +
      '<p class="st-note">换手机、清缓存、无痕模式都会丢掉记录。建议偶尔导出一次，文件名会带上日期。</p>' +
      "</div>" +

      '<div class="glass st-card settings-enter">' +
      '<div class="st-card-head">关于</div>' +
      '<div class="st-meta"><span>版本</span><b data-test="settings-version">' + U.escape(versionText()) + "</b></div>" +
      '<div class="st-meta"><span>题库</span><b>' + cardCount() + " 张卡</b></div>" +
      '<div class="st-meta"><span>结局</span><b>' + endingCount() + " 种</b></div>" +
      '<p class="st-note">升温夜航 · 一台手机，三幕夜航，六种结局。没有账号，不联网，数据归你们。</p>' +
      "</div>" +

      '<div class="settings-foot">' +
      '<button class="btn primary wide" data-act="back">返回</button>' +
      "</div>" +
      "</div>";
  }

  function render() {
    if (!S) return;
    S.root.innerHTML = bodyHtml();
    if (!M.reduced()) {
      U.qsa(".settings-enter", S.root).forEach(function (el, i) {
        el.style.animationDelay = (i * 55) + "ms";
      });
    }
  }

  /* ---------------- 交互 ---------------- */
  function syncToggleDom(key) {
    var btn = qs('[data-act="toggle"][data-key="' + key + '"]');
    if (!btn) return;
    var on = S.settings[key] !== false;
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-checked", on ? "true" : "false");
  }

  function toggle(key) {
    var patch = {};
    patch[key] = !(S.settings[key] !== false);
    S.settings = App.Store.saveSettings(patch);
    try { App.UI.syncSettings(); } catch (e) {}
    syncToggleDom(key);
    App.Audio.play("select");
    if (key === "haptics" && S.settings.haptics) App.UI.haptic("success");
    var names = { sound: "声音", haptics: "触感", reduced: "减少动效" };
    App.UI.toast((names[key] || key) + "：" + (S.settings[key] ? "开" : "关"));
  }

  function selectScale(n) {
    n = U.clamp(parseInt(n, 10) || 3, 1, 4);
    if (S.settings.maxStar === n) return;
    S.settings = App.Store.saveSettings({ maxStar: n });
    qsa('[data-act="scale"]').forEach(function (el) {
      var on = parseInt(el.getAttribute("data-n"), 10) === n;
      el.classList.toggle("on", on);
      el.setAttribute("aria-checked", on ? "true" : "false");
    });
    var desc = qs("#stScaleDesc");
    if (desc) desc.textContent = scaleMeta(n).desc;
    App.Audio.play("select");
    App.UI.haptic();
    App.UI.toast("默认尺度：" + scaleMeta(n).name);
  }

  function exportBackup() {
    try {
      var data = App.Store.exportAll();
      var text = JSON.stringify(data, null, 2);
      var fname = exportFileName();
      var blob = new Blob([text], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        try { URL.revokeObjectURL(url); } catch (e) {}
        try { a.remove(); } catch (e) {}
      }, 800);
      App.Audio.play("chime");
      App.UI.haptic("success");
      App.UI.toast("备份已导出 · " + fname);
    } catch (e) {
      App.UI.toast("导出没有成功，再试一次？", { kind: "rose" });
    }
  }

  function pickFile() {
    var input = qs('[data-test="settings-file"]');
    if (input) input.click();
  }

  function onFile(e) {
    var input = e.target;
    if (!input || !input.files || !input.files[0]) return;
    var file = input.files[0];
    var reader = new FileReader();
    reader.onload = function () {
      var obj = null;
      try { obj = JSON.parse(String(reader.result || "")); } catch (err) { obj = null; }
      if (!obj || typeof obj !== "object") {
        App.UI.toast("备份文件格式不对", { kind: "rose" });
        input.value = "";
        return;
      }
      var res = null;
      try { res = App.Store.importAll(obj); } catch (err) { res = { ok: false, msg: "恢复失败" }; }
      input.value = "";
      if (!res || !res.ok) {
        App.UI.toast((res && res.msg) || "导入失败", { kind: "rose" });
        return;
      }
      try { App.UI.syncSettings(); } catch (err) {}
      S.settings = App.Store.getSettings();
      render();
      App.Audio.play("chime");
      App.UI.haptic("success");
      var when = obj && obj.exportedAt ? "（" + String(obj.exportedAt).slice(0, 10) + " 的备份）" : "";
      App.UI.toast("已恢复" + when);
    };
    reader.onerror = function () { App.UI.toast("读取文件失败", { kind: "rose" }); };
    reader.readAsText(file);
  }

  function resetAll() {
    App.UI.confirm({
      title: "清除所有数据？",
      text: "今晚的存档、回忆册和设置都会被删掉，无法恢复。",
      ok: "清除",
      cancel: "再想想"
    }).then(function (yes) {
      if (!yes) return;
      try { App.Store.resetAll(); } catch (e) {}
      try { App.UI.syncSettings(); } catch (e) {}
      App.Audio.play("warn");
      App.UI.haptic("heavy");
      App.UI.toast("已清除，回到首页");
      if (App.Router.reset) App.Router.reset("boot");
      else App.Router.go("boot");
    });
  }

  function goBack() {
    App.Audio.play("tap");
    App.Router.back();
  }

  function onClick(e) {
    if (!S) return;
    var t = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!t) return;
    var act = t.getAttribute("data-act");
    if (act === "back") { e.preventDefault(); goBack(); }
    else if (act === "toggle") { e.preventDefault(); toggle(t.getAttribute("data-key")); }
    else if (act === "scale") { e.preventDefault(); selectScale(t.getAttribute("data-n")); }
    else if (act === "export") { e.preventDefault(); exportBackup(); }
    else if (act === "import") { e.preventDefault(); pickFile(); }
    else if (act === "reset") { e.preventDefault(); resetAll(); }
  }

  function onChange(e) {
    if (!e.target) return;
    if (e.target.getAttribute && e.target.getAttribute("data-test") === "settings-file") onFile(e);
  }

  function onKey(e) {
    if (e.key === "Escape") { e.preventDefault(); goBack(); }
  }

  App.Screens = App.Screens || {};
  App.Screens.settings = {
    mount: function (root) {
      S = { root: root, settings: App.Store.getSettings() };
      render();
      root.addEventListener("click", onClick);
      root.addEventListener("change", onChange);
      root.addEventListener("keydown", onKey);
      return function cleanup() {
        try {
          root.removeEventListener("click", onClick);
          root.removeEventListener("change", onChange);
          root.removeEventListener("keydown", onKey);
        } catch (e) {}
        S = null;
      };
    },
    unmount: function () {}
  };
})();

/* ===== src/ui/pwa.js ===== */
/* ===== V3 ui/pwa.js：PWA 注册 / 装到桌面入口 / 离线提示 / 版本更新 =====
 *
 * 对外 API：
 *   App.PWA.register()    —— app.js 启动时调用（幂等）
 *   App.PWA.showInstall() —— 任意屏幕可调用，打开「装到桌面」说明抽屉
 *   App.PWA.installed     —— 只读布尔（standalone / 本次会话已安装）
 *
 * 行为：
 *   · 仅 http/https 注册 ./sw.js（load 后）；file:// 静默跳过，不报错；
 *   · 捕获 beforeinstallprompt（preventDefault 存起来），有原生安装能力时
 *     右下角出现小胶囊「装到桌面」；iOS 没有 beforeinstallprompt，始终给出手动入口；
 *   · 已安装 / standalone 不显示胶囊；
 *   · 胶囊 z-index 400 < 抽屉 500，绝不挡弹层；
 *   · offline / online / appinstalled / SW 新版本就绪 各 toast 一次；
 *   · 不发起任何外部网络请求，不改任何游戏/引擎数据。
 */
(function () {
  var App = (window.App = window.App || {});

  var STATE = {
    booted: false,
    styleDone: false,
    deferred: null,      // beforeinstallprompt 事件（一次性）
    eligible: false,     // 本次会话曾经可安装（prompt 用掉后仍保留手动入口）
    installed: false,    // 本次会话内触发过 appinstalled
    online: (typeof navigator.onLine === "boolean" ? navigator.onLine : true),
    updateToasted: false,
    reg: null,
    pill: null
  };
  /* 右下角「装到桌面」胶囊已移除；安装说明 API 保留。 */
  var SHOW_PILL = false;

  /* ------------------------------------------------------------------ */
  /* 环境判断                                                            */
  /* ------------------------------------------------------------------ */
  function isHttp() {
    return location.protocol === "http:" || location.protocol === "https:";
  }

  function isStandalone() {
    try {
      if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
      if (window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches) return true;
    } catch (e) {}
    if (navigator.standalone === true) return true; // iOS 主屏启动
    return false;
  }

  function isInstalled() {
    return STATE.installed || isStandalone();
  }

  function isIOS() {
    var ua = String(navigator.userAgent || "");
    if (/iPad|iPhone|iPod/.test(ua)) return true;
    return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
  }

  function platform() {
    var ua = String(navigator.userAgent || "");
    if (isIOS()) return "ios";
    if (/Android/i.test(ua)) return "android";
    return "desktop";
  }

  function canPrompt() {
    return !!STATE.deferred;
  }

  /* ------------------------------------------------------------------ */
  /* toast 兜底                                                          */
  /* ------------------------------------------------------------------ */
  function toast(msg) {
    try {
      if (App.UI && App.UI.toast) App.UI.toast(msg);
    } catch (e) {}
  }

  /* ------------------------------------------------------------------ */
  /* 样式（运行时注入一次，全部走 base.css 设计令牌）                    */
  /* ------------------------------------------------------------------ */
  var CSS = [
    /* 右下角小胶囊：不打扰、低于抽屉(z500) */
    ".pwa-pill{position:fixed;z-index:400;",
    "  right:calc(14px + env(safe-area-inset-right,0px));",
    "  bottom:calc(16px + var(--safe-b));",
    "  display:inline-flex;align-items:center;gap:7px;",
    "  min-height:46px;padding:0 16px 0 14px;border-radius:999px;",
    "  background:rgba(24,16,42,.84);border:1px solid var(--line2);",
    "  color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.06em;",
    "  box-shadow:var(--sh-1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);",
    "  opacity:0;transform:translateY(10px) scale(.96);pointer-events:none;",
    "  transition:opacity var(--t-mid) var(--ease-out),transform var(--t-mid) var(--ease-out),",
    "             color var(--t-fast),border-color var(--t-fast);",
    "  -webkit-user-select:none;user-select:none;}",
    ".pwa-pill i{font-style:normal;font-size:14px;line-height:1;}",
    ".pwa-pill.on{opacity:.94;transform:none;pointer-events:auto;}",
    ".pwa-pill:active{transform:scale(.95);}",
    ".pwa-pill:hover{color:var(--ink);border-color:rgba(243,200,121,.42);}",
    /* 安全词优先：play 屏右下角是「长按安全词」按钮，隐藏胶囊，绝不遮挡 */
    'body[data-screen="play"] .pwa-pill{display:none;}',
    "@media (max-width:340px){.pwa-pill{right:10px;bottom:12px;font-size:11.5px;min-height:44px;}}",
    /* 安装说明抽屉 */
    ".pwa-sheet .sheet-sub{margin-bottom:2px;}",
    ".pwa-steps{display:flex;flex-direction:column;gap:10px;margin-top:14px;}",
    ".pwa-step{display:flex;align-items:flex-start;gap:11px;",
    "  padding:12px 14px;border-radius:var(--r-md);",
    "  background:var(--glass);border:1px solid var(--line);}",
    ".pwa-step b{flex:0 0 auto;width:22px;height:22px;border-radius:50%;",
    "  display:inline-flex;align-items:center;justify-content:center;",
    "  font-size:11.5px;font-weight:800;color:#2a0f1c;",
    "  background:linear-gradient(135deg,var(--gold),var(--rose));}",
    ".pwa-step span{font-size:13px;line-height:1.62;color:var(--dim);}",
    ".pwa-step span em{font-style:normal;color:var(--ink);font-weight:700;}",
    ".pwa-note{margin-top:14px;font-size:11.5px;line-height:1.7;color:var(--dim2);",
    "  border-top:1px solid var(--line);padding-top:12px;}",
    ".pwa-sheet .btn{margin-top:16px;}"
  ].join("\n");

  function injectStyle() {
    if (STATE.styleDone) return;
    try {
      if (App.UI && App.UI.injectStyle) App.UI.injectStyle("pwa", CSS);
      STATE.styleDone = true;
    } catch (e) {}
  }

  /* ------------------------------------------------------------------ */
  /* 右下角「装到桌面」胶囊                                              */
  /* ------------------------------------------------------------------ */
  function ensurePill() {
    if (!SHOW_PILL) return null;
    if (STATE.pill && document.body && document.body.contains(STATE.pill)) return STATE.pill;
    if (!document.body) return null;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "pwa-pill";
    btn.setAttribute("data-test", "pwa-install-pill");
    btn.setAttribute("aria-label", "装到桌面");
    btn.innerHTML = '<i aria-hidden="true">📲</i><span>装到桌面</span>';
    btn.addEventListener("click", function () {
      if (isInstalled()) { toast("已经装到桌面了 · 从主屏打开即可"); return; }
      if (canPrompt()) promptInstall();
      else showInstall();
    });
    // 挂在 #app 里而不是 body：#app 是 position:fixed 的 stacking context，
    // 这样胶囊(z400)才会真正低于抽屉(.sheet-mask z500)，不会浮在弹层上面。
    var host = document.getElementById("app") || document.body;
    host.appendChild(btn);
    STATE.pill = btn;
    return btn;
  }

  function syncPill() {
    try {
      var btn = ensurePill();
      if (!btn) return;
      var visible = !isInstalled() && (canPrompt() || STATE.eligible || isIOS());
      if (visible) btn.classList.add("on");
      else btn.classList.remove("on");
    } catch (e) {}
  }

  /* ------------------------------------------------------------------ */
  /* 原生安装提示                                                        */
  /* ------------------------------------------------------------------ */
  function promptInstall() {
    var ev = STATE.deferred;
    if (!ev) { showInstall(); return; }
    STATE.deferred = null; // beforeinstallprompt 只能 prompt 一次
    try {
      var p = ev.prompt();
      if (p && typeof p.then === "function") p["catch"](function () {});
      var choice = ev.userChoice;
      if (choice && typeof choice.then === "function") {
        choice.then(function (r) {
          if (r && r.outcome === "accepted") {
            toast("📲 正在安装…");
          } else {
            toast("已取消安装");
          }
          syncPill();
        })["catch"](function () {});
      }
    } catch (e) {
      showInstall(); // prompt 不可用时退回手动说明
    }
  }

  /* ------------------------------------------------------------------ */
  /* 手动安装说明抽屉                                                    */
  /* ------------------------------------------------------------------ */
  function stepsFor(p) {
    if (p === "ios") {
      return [
        '用 <em>Safari</em> 打开本页（微信 / QQ 内置浏览器不支持安装）',
        '点屏幕底部的 <em>⬆ 分享</em> 按钮',
        '在菜单里选 <em>「添加到主屏幕」</em>，再点右上角「添加」'
      ];
    }
    if (p === "android") {
      return [
        '点 Chrome 右上角的 <em>⋮</em> 菜单',
        '选 <em>「安装应用」</em>（部分机型叫「添加到主屏幕」）',
        '确认后桌面会出现 <em>「升温夜航」</em> 图标'
      ];
    }
    return [
      '点地址栏右侧的 <em>安装图标</em>（显示器 ⬇ / ⊕ 形状）',
      '在弹窗里选 <em>「安装」</em>',
      '之后从桌面 / 开始菜单打开，就是全屏 App'
    ];
  }

  function showInstall() {
    if (isInstalled()) { toast("已经装到桌面了 · 从主屏打开即可"); return; }
    var p = platform();
    var steps = stepsFor(p);
    var list = steps.map(function (s, i) {
      return '<div class="pwa-step"><b aria-hidden="true">' + (i + 1) + "</b><span>" + s + "</span></div>";
    }).join("");
    var actionLabel = canPrompt() ? "现在就装" : "知道了";
    var ref = null;
    try {
      ref = App.UI.sheet({
        title: "装到桌面",
        subtitle: "像 App 一样全屏打开 · 没有地址栏 · 离线也能继续夜航",
        cls: "pwa-sheet",
        html:
          '<div class="pwa-steps" data-test="pwa-install-sheet">' + list + "</div>" +
          '<div class="pwa-note">需要用 <b class="gold">https</b>（或本机 localhost）打开才支持安装；' +
          "iPad / iPhone 请用 Safari，安卓请用 Chrome。装好后数据仍在原浏览器里。</div>" +
          '<button class="btn primary wide" data-test="pwa-install-action">' + actionLabel + "</button>",
        onMount: function (panel, close) {
          var btn = panel.querySelector('[data-test="pwa-install-action"]');
          if (!btn) return;
          btn.addEventListener("click", function () {
            close();
            if (canPrompt()) promptInstall();
          });
        }
      });
    } catch (e) {
      return;
    }
    return ref;
  }

  /* ------------------------------------------------------------------ */
  /* Service Worker：注册 / 更新提示                                      */
  /* ------------------------------------------------------------------ */
  function notifyUpdateOnce() {
    if (STATE.updateToasted) return;
    STATE.updateToasted = true;
    toast("✨ 新版本已就绪，重开一次生效");
  }

  function watchUpdate(reg) {
    STATE.reg = reg;
    try {
      if (reg.waiting && navigator.serviceWorker.controller) notifyUpdateOnce();
      reg.addEventListener("updatefound", function () {
        var fresh = reg.installing;
        if (!fresh) return;
        fresh.addEventListener("statechange", function () {
          // 有 controller 才是「更新」而不是首次安装
          if (fresh.state === "installed" && navigator.serviceWorker.controller) notifyUpdateOnce();
        });
      });
    } catch (e) {}
  }

  function registerSW() {
    if (!isHttp()) return;                                   // file:// 等场景静默跳过
    if (!("serviceWorker" in navigator)) return;
    var go = function () {
      try {
        navigator.serviceWorker.register("./sw.js").then(function (reg) {
          watchUpdate(reg);
        })["catch"](function () {
          /* 注册失败（隐私策略 / 非安全上下文等）静默，不影响游戏 */
        });
      } catch (e) {}
    };
    if (document.readyState === "complete") go();
    else window.addEventListener("load", go);
  }

  /* ------------------------------------------------------------------ */
  /* 离线 / 联网 / 已安装 事件                                            */
  /* ------------------------------------------------------------------ */
  function bindEvents() {
    window.addEventListener("beforeinstallprompt", function (e) {
      try { e.preventDefault(); } catch (err) {}
      STATE.deferred = e;
      STATE.eligible = true;
      STATE.installed = false;
      syncPill();
    });

    window.addEventListener("appinstalled", function () {
      STATE.installed = true;
      STATE.deferred = null;
      toast("📲 已添加到桌面");
      syncPill();
    });

    window.addEventListener("offline", function () {
      if (STATE.online === false) return;
      STATE.online = false;
      toast("📴 已离线 · 夜航仍可继续");
    });

    window.addEventListener("online", function () {
      if (STATE.online === true) return;
      STATE.online = true;
      toast("🌐 已恢复联网");
    });
  }

  /* ------------------------------------------------------------------ */
  /* 初始化 + 对外 API                                                   */
  /* ------------------------------------------------------------------ */
  var PWA = {
    register: function () {
      if (STATE.booted) return;
      STATE.booted = true;
      injectStyle();
      ensurePill();
      syncPill();
      bindEvents();
      registerSW();
    },
    showInstall: showInstall,
    // 供屏幕/QA 使用的小工具
    platform: platform,
    canPrompt: canPrompt,
    isStandalone: isStandalone
  };

  // installed 用 getter：读 App.PWA.installed 永远是最新状态
  try {
    Object.defineProperty(PWA, "installed", {
      enumerable: true,
      get: function () { return isInstalled(); }
    });
  } catch (e) {
    PWA.installed = false;
  }

  App.PWA = PWA;
})();

/* ===== src/app.js ===== */
/* ===== V3 app.js：启动入口 ===== */
(function () {
  var App = (window.App = window.App || {});
  App.version = "3.0.0";

  function boot() {
    App.UI.syncSettings();
    App.Router.init(document.getElementById("screen"));

    // 路由联动
    App.Bus.on("route", function (e) {
      document.body.setAttribute("data-screen", e.name);
      document.getElementById("screen").scrollTop = 0;
      var s = App.Store.getSettings();
      App.Audio.setEnabled(s.sound !== false);
    });
    App.Bus.on("settings", function (s) {
      App.Audio.setEnabled(s.sound !== false);
      App.Motion.syncBodyClass();
    });
    App.Bus.on("session", function () {
      App.Motion.syncBodyClass();
    });

    // 首次交互解锁音频
    var unlocked = false;
    function unlock() {
      if (unlocked) return;
      unlocked = true;
      App.Audio.unlock();
      document.removeEventListener("pointerdown", unlock, true);
    }
    document.addEventListener("pointerdown", unlock, true);

    // 全局错误：不静默
    window.addEventListener("error", function (e) {
      if (window.console) console.error("[app]", e.message);
    });
    window.addEventListener("unhandledrejection", function (e) {
      if (window.console) console.warn("[app] promise", e.reason);
    });

    // 全局安全词（长按 1.5s 温柔收尾；play 屏由 play.js 自带的安全词代替）
    try { if (App.Safe && App.Safe.init) App.Safe.init(); } catch (e) {}

    // PWA（可选模块）
    try { if (App.PWA && App.PWA.register) App.PWA.register(); } catch (e) {}

    App.Router.reset("boot");
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
</body>
</html>
