var audioCtx=null;
function getAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function playBeep(freq,dur,type,vol){
  try{var ctx=getAudioCtx(),o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'sine';o.frequency.value=freq;g.gain.value=vol||0.15;
  o.connect(g);g.connect(ctx.destination);o.start();
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
  o.stop(ctx.currentTime+dur)}catch(e){}
}

/* ===== Utils ===== */
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pickRandom(arr,n){return shuffle(arr.slice()).slice(0,n)}
function randItem(a){return a[Math.floor(Math.random()*a.length)]}
function nextBatch(key,pool,count,exclude){
  var bag=window[key]||[];
  if(bag.length===0){
    var fresh=shuffle(pool.slice());
    if(exclude!==undefined&&fresh.length>1&&fresh[0]===exclude){fresh.push(fresh.shift());}
    bag=bag.concat(fresh);
    window[key]=bag;
  }
  return bag.splice(0,count);
}
function pickFresh(key,pool){
  var bag=window[key];
  if(!bag||bag.length===0){
    bag=shuffle(pool.slice());
    var last=window[key+'Last'];
    if(last!==undefined&&bag.length>1&&bag[0]===last){bag.push(bag.shift());}
    window[key]=bag;
  }
  var item=bag.pop();
  window[key+'Last']=item;
  return item;
}

/* ===== Canvas Wheel ===== */
function drawWheel(canvas,items,colors){
  var ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,R=W/2-12,n=items.length;
  var fs=n<=10?26:n<=15?24:n<=20?9:n<=30?8:7;
  ctx.clearRect(0,0,W,H);
  for(var i=0;i<40;i++){
    var a=(i/40)*Math.PI*2-Math.PI/2;
    var bx=cx+Math.cos(a)*(R+4),by=cy+Math.sin(a)*(R+4);
    ctx.beginPath();ctx.arc(bx,by,4,0,Math.PI*2);
    ctx.fillStyle=i%2===0?'#ffd700':'#ff6b9d';ctx.fill();
  }
  var arc=Math.PI*2/n;
  for(var i=0;i<n;i++){
    var sa=arc*i-Math.PI/2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,sa,sa+arc);ctx.closePath();
    ctx.fillStyle=colors[i%colors.length];ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(sa+arc/2);
    ctx.fillStyle='#fff';ctx.font='bold '+fs+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    var txt=items[i];if(txt.length>7) txt=txt.substring(0,7)+'…';
    ctx.fillText(txt,R*0.62,0);ctx.restore();
  }
}
function spinWheel(canvasId,items,angleKey,spinningKey,resultId,cb){
  if(window[spinningKey])return;
  window[spinningKey]=true;sndSpin();
  var angle=1080+Math.random()*720;
  window[angleKey]+=angle;
  var sessKey=spinningKey+'Sess';
  var mySess=(window[sessKey]||0)+1;window[sessKey]=mySess;
  var cv=document.getElementById(canvasId);
  cv.style.transition='transform 4.5s cubic-bezier(0.17,0.67,0.12,0.99)';
  cv.style.transform='rotate('+window[angleKey]+'deg)';
  var tm=setTimeout(function(){
    if(window[sessKey]!==mySess)return;
    if(!document.getElementById(resultId))return;
    window[spinningKey]=false;
    var n=items.length,seg=360/n;
    var finalAngle=window[angleKey]%360;
    var idx=Math.floor(((360-finalAngle)%360)/seg)%n;
    sndDing();vibrate(100);cb(idx);
  },4600);
  window[spinningKey+'Timer']=tm;
}

function renderBomb(c){
  var bomb=Math.floor(Math.random()*100)+1;
  window._bomb=bomb;window._bombMin=1;window._bombMax=100;window._bombGuesses=0;
  c.innerHTML='<div class="bomb-wrap">'
    +'<h2 style="margin-bottom:10px">💣 数字炸弹</h2>'
    +'<p style="color:#aaa;font-size:13px">炸弹藏在1-100之间，猜中就爆炸！</p>'
    +'<div class="bomb-range"><span id="bMin">1</span><span class="slash">—</span><span id="bMax">100</span></div>'
    +'<input class="bomb-input" id="bombInput" type="number" min="1" max="100" placeholder="?" onkeypress="if(event.key===\'Enter\')guessBomb()">'
    +'<div><button class="bomb-submit" style="background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff" onclick="guessBomb()">💥 猜！</button></div>'
    +'<div class="bomb-msg" id="bombMsg"></div>'
    +'<div style="font-size:13px;color:#aaa;margin-top:8px">已猜：<span id="bombCount">0</span>次 | 范围：<span id="bombRange">100</span></div>'
    +'<div class="wheel-btns" style="margin-top:14px"><button class="wheel-btn back" onclick="startGame(\'bomb\')">🔄 重来</button></div>'
    +'</div>';
}
function guessBomb(){
  var v=parseFloat(document.getElementById('bombInput').value);
  if(!Number.isInteger(v)||v<window._bombMin||v>window._bombMax){toast('请输入'+window._bombMin+'-'+window._bombMax+'的整数');return}
  window._bombGuesses++;
  sndDing();vibrate(30);
  if(v===window._bomb){
    sndBoom();vibrate([100,50,100,50,200]);
    var who=Math.random()<0.5?HE.him:HE.her;
    var punish=pickFresh('_bombsPick',GAMEDATA.bombs);
    document.getElementById('bombMsg').innerHTML='<div style="color:#ff4757;font-size:22px;margin:10px 0">💥 炸弹爆炸！！！</div><div>'+who+'：'+punish+'</div>';
    document.getElementById('bombInput').disabled=true;
    document.querySelector('.bomb-submit').disabled=true;
  }else if(v<window._bomb){
    window._bombMin=Math.max(window._bombMin,v+1);
  }else{
    window._bombMax=Math.min(window._bombMax,v-1);
  }
  document.getElementById('bMin').textContent=window._bombMin;
  document.getElementById('bMax').textContent=window._bombMax;
  document.getElementById('bombCount').textContent=window._bombGuesses;
  document.getElementById('bombRange').textContent=window._bombMax-window._bombMin+1;
  document.getElementById('bombInput').value='';
}

/* ===== 骰子 ===== */
function renderDice(c){
  var faces=['⚀','⚁','⚂','⚃','⚄','⚅'];
  c.innerHTML='<div class="dice-wrap">'
    +'<h2 style="margin-bottom:10px">🎲 骰子大冒险</h2>'
    +'<div class="dice-box" id="diceBox">🎲</div>'
    +'<div class="dice-result" id="diceResult">点击下方按钮摇骰子</div>'
    +'<button class="dice-submit" style="background:linear-gradient(135deg,#f39c12,#e67e22)" onclick="rollDice()">🎲 摇！</button>'
    +'<div class="wheel-btns" style="margin-top:14px"><button class="wheel-btn back" onclick="startGame(\'dice\')">🔄 重来</button></div>'
    +'</div>';
  window._faces=faces;
}
function rollDice(){
  if(window._diceRolling)return;
  window._diceRolling=true;
  sndSpin();
  var box=document.getElementById('diceBox');
  box.classList.add('rolling');
  var count=0;var iv=setInterval(function(){
    box.textContent=window._faces[Math.floor(Math.random()*6)];count++;
    if(count>20){
      clearInterval(iv);window._diceRolling=false;box.classList.remove('rolling');
      var result=Math.floor(Math.random()*6);
      box.textContent=window._faces[result];
      var val=result+1;sndDing();vibrate(80);
      var who=Math.random()<0.5?HE.him:HE.her;
      var punish=pickFresh('_punishPick',GAMEDATA.punish);
      document.getElementById('diceResult').innerHTML=
        '<div style="font-size:22px;margin-bottom:8px">🎲 '+val+'点！</div><div>'+who+'：'+punish+'</div>';
    }
  },80);
}

/* ===== 石头剪刀布 ===== */
function renderRPS(c){
  var moves=[{icon:'✊',name:'石头'},{icon:'✌️',name:'剪刀'},{icon:'✋',name:'布'}];
  window._rpsMoves=moves;window._rpsP1=null;window._rpsP2=null;window._rpsPhase=1;
  c.innerHTML='<div class="rps-wrap">'
    +'<h2 style="margin-bottom:10px">✊ 石头剪刀布</h2>'
    +'<div class="rps-phase" id="rpsPhase">'+HE.him+' 请出拳</div>'
    +'<div class="rps-picks" id="rpsPicks">'
    +'<div class="rps-pick" onclick="rpsPick(0)"><div class="rps-icon">✊</div><div class="rps-label">石头</div></div>'
    +'<div class="rps-pick" onclick="rpsPick(1)"><div class="rps-icon">✌️</div><div class="rps-label">剪刀</div></div>'
    +'<div class="rps-pick" onclick="rpsPick(2)"><div class="rps-icon">✋</div><div class="rps-label">布</div></div>'
    +'</div>'
    +'<div class="rps-result" id="rpsResult"></div>'
    +'<div class="wheel-btns" style="margin-top:14px"><button class="wheel-btn back" onclick="startGame(\'rps\')">🔄 重来</button></div>'
    +'</div>';
  window._rpsP1Name=HE.him;window._rpsP2Name=HE.her;
}
function rpsPick(choice){
  sndDing();vibrate(30);
  if(window._rpsPhase===0){window._rpsP1=choice;window._rpsPhase=2;
    document.getElementById('rpsPhase').textContent=window._rpsP2Name+' 请出拳（不要给'+window._rpsP1Name+'看到哦）';
    document.getElementById('rpsResult').innerHTML='<div style="color:#aaa">'+window._rpsP1Name+' 已出拳 ✅</div>';return}
  if(window._rpsPhase===1){
    window._rpsP1=choice;window._rpsPhase=2;
    document.getElementById('rpsPhase').textContent=window._rpsP2Name+' 请出拳（不要给'+window._rpsP1Name+'看到哦）';
    document.getElementById('rpsResult').innerHTML='<div style="color:#aaa">'+window._rpsP1Name+' 已出拳 ✅</div>';
  }else if(window._rpsPhase===2){
    window._rpsP2=choice;
    var m=window._rpsMoves;
    var diff=(window._rpsP1-window._rpsP2+3)%3;
    var resultHtml='<div style="margin:10px 0"><span class="rps-p1">'+m[window._rpsP1].icon+' '+m[window._rpsP1].name+'</span>'
      +'<span class="rps-vs">VS</span>'
      +'<span class="rps-p2">'+m[window._rpsP2].icon+' '+m[window._rpsP2].name+'</span></div>';
    if(diff===0){
      resultHtml+='<div style="font-size:18px;color:#ffd700">🤝 平局！再来一次！</div>';
      window._rpsPhase=1;
      document.getElementById('rpsPhase').textContent=window._rpsP1Name+' 请出拳';
    }else if(diff===1){
      var punish=pickFresh('_punishPick',GAMEDATA.punish);
      sndBuzz();vibrate([50,30,50]);
      resultHtml+='<div style="font-size:18px;color:#ff6b6b">😢 '+window._rpsP1Name+' 输了！</div><div>'+window._rpsP1Name+' 必须：'+punish+'</div>';
      window._rpsPhase=0;
    }else{
      var punish=pickFresh('_punishPick',GAMEDATA.punish);
      sndBuzz();vibrate([50,30,50]);
      resultHtml+='<div style="font-size:18px;color:#00cec9">🎉 '+window._rpsP1Name+' 赢了！</div><div>'+window._rpsP2Name+' 必须：'+punish+'</div>';
      window._rpsPhase=0;
    }
    document.getElementById('rpsResult').innerHTML=resultHtml;
    document.getElementById('rpsPhase').textContent=window._rpsPhase===0?'再点任意手势可开新局':'';
  }
}

/* ===== 惩罚转盘 ===== */
function renderPunish(c){
  var items=nextBatch('_punishBag',GAMEDATA.punish,12,window._punishLastShown);window._punishBagWheel=items;
  var colors=['#ff6b6b','#ee5a24','#e74c3c','#ff4757','#ff6348','#e55039','#eb4d4b','#fc5c65'];
  c.innerHTML='<div class="wheel-wrap">'
    +'<canvas id="pCanvas" width="1200" height="1200"></canvas>'
    +'<div class="wheel-pointer"></div>'
    +'<button class="wheel-go-btn" onclick="spinPunishWheel()">GO</button>'
    +'</div>'
    +'<div class="wheel-result" id="punishResult"><div class="text">点击GO抽取惩罚</div></div>'
    +'<div class="wheel-btns">'
    +'<button class="wheel-btn back" onclick="startGame(\'punish\')">🔄 换一批</button>'
    +'</div>';
  window._punishItems=items;window._punishShown=[];window._punishColors=colors;window._punishAngle=0;window._punishSpinning=false;
  window._punishSpinningSess=(window._punishSpinningSess||0)+1;
  if(window._punishSpinningTimer){clearTimeout(window._punishSpinningTimer);window._punishSpinningTimer=null;}
  setTimeout(function(){var cv=document.getElementById('pCanvas');if(cv)drawWheel(cv,items,colors)},50);
}
function spinPunishWheel(){
  var shown=window._punishShown||[];
  var rem=window._punishItems.filter(function(x){return shown.indexOf(x)<0;});
  if(rem.length===0){
    rem=nextBatch('_punishBag',GAMEDATA.punish,12,window._punishLastShown);
    window._punishShown=[];
  }
  window._punishItems=rem;
  var cv=document.getElementById('pCanvas');
  if(cv)drawWheel(cv,rem,window._punishColors);
  spinWheel('pCanvas',rem,'_punishAngle','_punishSpinning','punishResult',function(idx){
    var item=rem[idx];
    window._punishShown.push(item);
    window._punishLastShown=item;
    var who=Math.random()<0.5?HE.him:HE.her;
    document.getElementById('punishResult').innerHTML=
      '<div class="text">'+item+'</div><div class="player-tag">🎯 '+who+' 必须执行！</div>';
  });
}

/* ===== Init ===== */
if(HE.him!=='他'||HE.her!=='她'){document.getElementById('cpNames').innerHTML='<span style="color:#3498db">♂ '+HE.him+'</span><span class="vs">❤</span><span style="color:#e040fb">♀ '+HE.her+'</span>';}
renderHome();

</script>
