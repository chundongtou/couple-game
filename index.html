/* ===== 平面图 ===== */
(function () {
  var App = window.App;
  var U = App.util;
  var ROOMS = [
    { id: "balcony", cls: "room-balcony", illu: '<i class="rail"></i><i class="rainbit"></i><i class="bulb"></i>' },
    { id: "bedroom", cls: "room-bed", illu: '<i class="bedshape"></i><i class="bulb"></i>' },
    { id: "bathroom", cls: "room-bath", illu: '<i class="tub"></i><i class="bulb"></i>' },
    { id: "living", cls: "room-living", illu: '<i class="sofa"></i><i class="glasscup"></i><i class="bulb"></i>' },
    { id: "kitchen", cls: "room-kitchen", illu: '<i class="counter"></i><i class="bulb"></i>' }
  ];

  function meta(id) { return App.Balance.ROOM_META[id]; }

  App.Screens.plan = {
    mount: function (root) {
      var state = App.Store.getSession();
      if (!state || state.phase === "done") { App.Router.reset("boot"); return; }
      if (state.phase !== "plan") {
        var back = App.Engine.leaveRoom(state);
        App.Store.saveSession(back.state);
        state = back.state;
      }
      App.Night.paint(state);
      function paint() {
        state = App.Store.getSession();
        if (!state) { App.Router.reset("boot"); return; }
        var cap = App.Engine.capOf(state);
        var name = (App.Balance.INTENSITY[cap] && App.Balance.INTENSITY[cap].name) || "";
        var at = state.at || "foyer";
        root.innerHTML =
          '<div class="page">' +
            '<div class="night-bar">' +
              '<div><div class="kicker">' + U.escape(state.names.a) + " · " + U.escape(state.names.b) + "</div>" +
              '<div class="clock" data-test="clock">' + U.escape(App.Engine.clockLabel(state)) + " · " + U.escape(name) + "</div></div>" +
              '<div class="wine" aria-hidden="true"><i style="height:' + Math.max(8, state.heat) + '%"></i></div>' +
            '</div>' +
            '<div class="meter" data-test="heat" data-heat="' + state.heat + '"><div class="meter-track"><div class="meter-fill" style="width:' + state.heat + '%"></div></div>' +
            '<div class="tiny dim mt-8">' + U.escape(App.Balance.stageLabel(state.heat)) + " · " + state.heat + "</div></div>" +
            '<div class="apt mt-12" data-test="floor">' +
              ROOMS.map(function (r) {
                var m = meta(r.id);
                var lit = state.lit && state.lit[r.id];
                return '<button class="room ' + r.cls + (lit ? " lit" : "") + '" data-room="' + r.id + '" data-test="room-' + r.id + '" aria-label="走进' + m.name + '">' +
                  '<span class="illu">' + r.illu + "</span>" +
                  '<span class="room-name">' + m.name + "</span>" +
                  '<span class="room-hint">' + m.hint + (lit ? " · 亮着" : "") + "</span>" +
                  (at === r.id ? '<span class="we" data-test="token">我们</span>' : "") +
                "</button>";
              }).join("") +
              '<div class="foyer-cell"><span><b style="letter-spacing:.16em">门厅</b><span class="room-hint">从这里开始</span></span>' +
              (at === "foyer" || !at ? '<span class="we" data-test="token">我们</span>' : "") +
              "</div></div>" +
            '<div class="actions">' +
              '<button class="btn soft wide" data-test="stroll" data-act="stroll">在公寓里走一走</button>' +
              '<div class="choice-row">' +
                '<button class="btn soft" data-test="to-door" data-act="door">游戏门</button>' +
                '<button class="btn soft" data-test="close-night" data-act="close">关灯</button>' +
              "</div></div>" +
          "</div>";
        U.delegate(root, "[data-room]", "click", function (e, el) {
          var id = el.getAttribute("data-room");
          var ret = App.Engine.enterRoom(App.Store.getSession(), id);
          App.Store.saveSession(ret.state);
          App.Night.paint(ret.state);
          if (App.Audio) App.Audio.play("tick");
          App.Router.go("room");
        });
        U.delegate(root, "[data-act]", "click", function (e, el) {
          var act = el.getAttribute("data-act");
          if (act === "door") App.Router.go("door");
          else if (act === "stroll") {
            var ret = App.Engine.strollStart(App.Store.getSession());
            App.Store.saveSession(ret.state);
            App.Router.go("room");
          } else if (act === "close") {
            App.UI.confirm({ title: "把灯关掉", text: "已经走过的房间和做过的事会留在这一页上。", ok: "关灯", cancel: "再待一会儿" }).then(function (yes) {
              if (!yes) return;
              var fin = App.Engine.closeNight(App.Store.getSession());
              App.Store.addHistory(App.Store.makeHistoryEntry(fin.state));
              fin.state.archived = true;
              App.Store.saveSession(fin.state);
              App.Night.paint(null);
              App.Router.reset("close");
            });
          }
        });
      }
      paint();
    }
  };
})();

/* ===== src/ui/screens/kit.js ===== */
/* ===== 房间里的四种玩法，夜里和游戏门共用 ===== */
(function () {
  var App = window.App;
  var U = App.util;
  var OUT = { done: "做了", hold: "停在这里", pass: "先放下", deeper: "又往下问", reveal: "对过温度" };

  function tone(star, cap) {
    if (cap <= 1) return "轻声";
    if (star <= 2) return "靠近";
    if (star === 3) return "发烫";
    if (star === 4) return "直接";
    return "不收";
  }
  function esc(s) { return U.escape(s || ""); }
  function reduced() { return App.Motion && App.Motion.reduced && App.Motion.reduced(); }
  function labels(cap) { return App.Balance.THERMO_LABELS[cap] || App.Balance.THERMO_LABELS[1]; }
  function labelAt(cap, i) {
    var list = labels(cap);
    return list[Math.max(0, Math.min(list.length - 1, i))] || "";
  }

  function scene(room, title, sub) {
    var prop = {
      living: '<i class="sofa"></i><i class="glasscup"></i><i class="bulb"></i>',
      kitchen: '<i class="counter"></i><i class="bulb"></i>',
      balcony: '<i class="rail"></i><i class="rainbit"></i>',
      bathroom: '<i class="tub"></i><i class="bulb"></i>',
      bedroom: '<i class="bedshape"></i><i class="bulb"></i>'
    }[room] || "";
    return '<div class="scene scene-' + room + '"><div class="illu">' + prop + '</div><div class="cap"><b>' + esc(title) + '</b><span class="small muted">' + esc(sub) + "</span></div></div>";
  }

  function promptBlock(state, card, extra) {
    var cap = App.Engine.capOf(state);
    return '<article class="prompt" data-test="prompt"><p class="prompt-text">' + esc(card.text) + "</p>" +
      '<div class="prompt-meta">' + esc(tone(card.star || 1, cap)) + (extra ? " · " + esc(extra) : "") + "</div></article>";
  }

  function last(state) {
    var log = state.log || [];
    return log.length ? log[log.length - 1] : null;
  }

  function wheelHtml(state) {
    return '<div class="wheel-wrap"><div class="pointer"></div><div class="rotor" data-rotor>' +
      '<button class="hub" data-act="spin" data-test="spin" type="button">转</button></div></div>';
  }

  function top(title, leaveLabel) {
    return '<div class="topbar"><button class="back" data-act="leave" aria-label="' + esc(leaveLabel || "回到平面图") + '">←</button>' +
      '<div class="tb-title">' + esc(title) + '</div><div class="tb-right"></div></div>';
  }

  function livingHtml(state) {
    var cap = App.Engine.capOf(state);
    var sub = App.Night.line("living", cap);
    var html = top("客厅") + scene("living", "客厅", sub);
    if (!state.prompt) {
      var prev = last(state);
      if (prev && prev.room === "living") {
        html += '<p class="small dim">刚才：' + esc(OUT[prev.outcome] || "") + "</p>";
      }
      html += '<p class="title-md">谁先把这句话递出去</p><div class="choice-row mt-12">' +
        '<button class="btn soft" data-test="who-ask" data-act="offer" data-who="a" data-role="ask">' + esc(state.names.a) + " 先问</button>" +
        '<button class="btn soft" data-test="who-listen" data-act="offer" data-who="b" data-role="listen">' + esc(state.names.b) + " 先听</button>" +
        "</div>";
      return html;
    }
    var who = state.prompt.who === "b" ? state.names.b : state.names.a;
    var role = state.prompt.role === "listen" ? "先听" : "先问";
    html += promptBlock(state, state.prompt.card, who + role);
    html += '<div class="actions">' +
      '<button class="btn primary wide" data-test="hold" data-act="settle" data-how="hold">就停在这</button>' +
      '<button class="btn soft wide" data-test="deeper" data-act="deeper">再往下问</button>' +
      '<button class="btn ghost wide" data-test="pass" data-act="settle" data-how="pass">先放下</button></div>';
    return html;
  }

  function wheelScreen(state, kind) {
    var room = kind === "dare" ? "kitchen" : "bathroom";
    var title = kind === "dare" ? "厨房" : "浴室";
    var cap = App.Engine.capOf(state);
    var html = top(title) + scene(room, title, App.Night.line(room, cap));
    var spun = state.wheel && state.wheel.spun && state.prompt;
    if (!spun) {
      html += '<p class="center small dim">' + (kind === "dare" ? "停在哪一件，就做到哪一件。" : "停下之后，自己说，或者递到对方手里。") + "</p>";
      html += wheelHtml(state);
      var left = kind === "dare" ? state.dareRerolls : state.truthRerolls;
      html += '<p class="center tiny dim">重抽还剩 ' + (left || 0) + " 次</p>";
      return html;
    }
    html += promptBlock(state, state.prompt.card, kind === "dare" ? "厨房" : "浴室");
    if (kind === "truth" && !state.prompt.hand) {
      html += '<div class="choice-row mt-12">' +
        '<button class="btn primary" data-test="hand-self" data-act="hand" data-who="self">我来说</button>' +
        '<button class="btn soft" data-test="hand-other" data-act="hand" data-who="other">交给对方</button></div>';
    } else {
      var whoLine = "";
      if (kind === "truth") whoLine = state.prompt.hand === "other" ? "交给对方说" : "自己说";
      if (whoLine) html += '<p class="small dim mt-8">' + whoLine + "</p>";
      var left2 = kind === "dare" ? state.dareRerolls : state.truthRerolls;
      html += '<div class="actions">' +
        '<button class="btn primary wide" data-test="did" data-act="settle" data-how="done">' + (kind === "dare" ? "做到了" : "说了") + "</button>" +
        '<button class="btn soft wide" data-test="reroll" data-act="reroll"' + (left2 ? "" : " disabled") + ">再转一次</button>" +
        '<button class="btn ghost wide" data-test="pass" data-act="settle" data-how="pass">先放下</button></div>';
    }
    return html;
  }

  function thermoHtml(state) {
    var cap = App.Engine.capOf(state);
    var t = state.thermo || { max: 6, a: null, b: null };
    var html = top("阳台") + scene("balcony", "阳台", App.Night.line("balcony", cap));
    if (t.revealed) {
      html += '<article class="prompt" data-test="thermo-result"><p class="prompt-text">你们把温度摊开了。</p>' +
        '<p class="muted mt-8">' + esc(state.names.a) + " 放在「" + esc(labelAt(cap, t.a.place)) + "」，猜的是「" + esc(labelAt(cap, t.a.guess)) + "」。</p>" +
        '<p class="muted">' + esc(state.names.b) + " 放在「" + esc(labelAt(cap, t.b.place)) + "」，猜的是「" + esc(labelAt(cap, t.b.guess)) + "」。</p>" +
        '<p class="prompt-meta">接近 ' + Math.round((t.closeness || 0) * 100) + " · 夜里 +" + (t.delta || 0) + "</p></article>" +
        '<p class="small dim mt-12">' + ((t.closeness || 0) >= 0.75 ? "猜得很近。热度跟着上来了。" : "没贴准也没关系。温度本身已经放在桌上。") + "</p>" +
        '<div class="actions"><button class="btn soft wide" data-test="thermo-again" data-act="thermo-reset">再量一次</button></div>';
      return html;
    }
    if (!t.a) {
      html += sliders("a", state.names.a, cap, t.max, "盖住，递给 " + state.names.b);
      return html;
    }
    if (!t.passing) {
      html += '<div class="prompt pass-card" data-test="pass-phone"><p class="title-md">把手机递给 ' + esc(state.names.b) + '</p><p class="muted">刚才的刻度已经盖住了。</p>' +
        '<button class="btn primary" data-test="got-phone" data-act="thermo-pass">我拿到了</button></div>';
      return html;
    }
    if (!t.b) {
      html += sliders("b", state.names.b, cap, t.max, "揭开");
      return html;
    }
    html += '<button class="btn primary wide" data-test="thermo-reveal" data-act="thermo-reveal">揭开两边的温度</button>';
    return html;
  }

  function sliders(who, name, cap, max, submit) {
    return '<div data-test="thermo-' + who + '"><p class="title-md">' + esc(name) + "，先别给对方看</p>" +
      '<p class="small dim mt-12">你把今晚放在</p><p class="scale-label" data-place-label>' + esc(labelAt(cap, Math.round(max / 2))) + "</p>" +
      '<input data-place type="range" min="0" max="' + max + '" value="' + Math.round(max / 2) + '" aria-label="自己的温度">' +
      '<p class="small dim mt-12">你猜对方会放在</p><p class="scale-label" data-guess-label>' + esc(labelAt(cap, Math.round(max / 2))) + "</p>" +
      '<input data-guess type="range" min="0" max="' + max + '" value="' + Math.round(max / 2) + '" aria-label="猜对方的温度">' +
      '<button class="btn primary wide mt-16" data-test="thermo-lock-' + who + '" data-act="thermo-lock" data-who="' + who + '">' + esc(submit) + "</button></div>";
  }

  function bedroomHtml(state) {
    var cap = App.Engine.capOf(state);
    var html = top("卧室") + scene("bedroom", "卧室", App.Night.line("bedroom", cap));
    if (!state.bedroomMode) {
      html += '<p class="small dim">门没有锁。</p><div class="choice-row mt-12">' +
        '<button class="btn soft" data-test="bed-talk" data-act="bed" data-mode="talk">说话</button>' +
        '<button class="btn primary" data-test="bed-act" data-act="bed" data-mode="act">做事</button></div>';
      return html;
    }
    if (!state.prompt) {
      html += '<button class="btn primary wide" data-test="bed-draw" data-act="bed-draw">' + (state.bedroomMode === "act" ? "抽一件更近的事" : "抽一句更近的话") + "</button>";
      return html;
    }
    html += promptBlock(state, state.prompt.card, state.bedroomMode === "act" ? "做事" : "说话");
    html += '<div class="actions">' +
      '<button class="btn primary wide" data-test="did" data-act="settle" data-how="done">就这样</button>' +
      '<button class="btn soft wide" data-test="deeper" data-act="deeper">再近一点</button>' +
      '<button class="btn ghost wide" data-test="pass" data-act="settle" data-how="pass">先放下</button></div>';
    return html;
  }

  function strollHtml(state) {
    var tiles = App.Balance.STROLL_TILES;
    var pos = state.stroll ? state.stroll.pos : 0;
    var html = top(state.mode === "standalone" ? "走一走" : "公寓里走") +
      '<p class="small dim">一枚「我们」。不是比赛，走到哪间，就做那一间的事。</p>' +
      '<div class="stroll mt-12" data-test="stroll-board">' +
      tiles.map(function (tile, i) {
        return '<div class="tile' + (i === pos ? " on" : "") + '" data-test="tile-' + tile.id + '"><b>' + esc(tile.name) + "</b>" + esc(App.Balance.ROOM_META[tile.room].name) + "</div>";
      }).join("") + "</div>";
    var pending = state.stroll && state.stroll.pending;
    if (!pending) {
      html += '<button class="btn primary wide mt-16" data-test="stroll-roll" data-act="stroll-roll">一起走</button>';
      return html;
    }
    html += '<p class="small gold mt-12">走了 ' + state.stroll.lastDie + " 步 · " + esc(pending.tile.name) + "</p>";
    html += promptBlock(state, pending.card, App.Balance.ROOM_META[pending.tile.room].name);
    html += '<div class="actions"><button class="btn primary wide" data-test="did" data-act="stroll-settle" data-how="done">做了</button>' +
      '<button class="btn ghost wide" data-test="pass" data-act="stroll-settle" data-how="pass">先放下</button></div>';
    return html;
  }

  function body(state) {
    if (state.phase === "stroll") return strollHtml(state);
    if (state.room === "living") return livingHtml(state);
    if (state.room === "kitchen") return wheelScreen(state, "dare");
    if (state.room === "bathroom") return wheelScreen(state, "truth");
    if (state.room === "balcony") return thermoHtml(state);
    if (state.room === "bedroom") return bedroomHtml(state);
    return "<p>这间房还没准备好。</p>";
  }

  function prepare(state, api) {
    if (!state || state.phase === "stroll" || state.phase === "done") return state;
    var next = null;
    if (state.room === "kitchen" && (!state.wheel || state.wheel.kind !== "dare")) next = App.Engine.dealWheel(state, "dare");
    else if (state.room === "bathroom" && (!state.wheel || state.wheel.kind !== "truth")) next = App.Engine.dealWheel(state, "truth");
    else if (state.room === "balcony" && !state.thermo) next = App.Engine.thermoBegin(state);
    if (!next) return state;
    api.save(next.state);
    return next.state;
  }

  App.Kit = {
    open: function (root, api) {
      var timer = null;
      function get() { return api.get(); }
      function commit(ret, opts) {
        opts = opts || {};
        var s = ret && ret.state ? ret.state : ret;
        api.save(s);
        if (api.night) App.Night.paint(s);
        if (opts.spin) {
          var rotor = root.querySelector("[data-rotor]");
          var idx = s.wheel && s.wheel.index || 0;
          if (rotor) {
            var deg = 1440 - idx * 60;
            rotor.style.transition = reduced() ? "none" : "transform 1s cubic-bezier(.15,.8,.2,1)";
            rotor.style.transform = "rotate(" + deg + "deg)";
          }
          clearTimeout(timer);
          timer = setTimeout(render, reduced() ? 30 : 1000);
          return;
        }
        render();
      }
      function render() {
        var state = prepare(get(), api);
        if (!state) { api.onLeave(); return; }
        var heat = '<div class="tiny dim mb-8" data-test="room-heat" data-heat="' + (state.heat || 0) + '">' +
          esc(App.Balance.stageLabel(state.heat || 0)) + " · " + (state.heat || 0) +
          (state.mode === "standalone" ? " · 游戏门" : "") + "</div>";
        var paste = "";
        if (!api.night && state.mode === "standalone" && ((state.log && state.log.length) || (state.thermo && state.thermo.revealed))) {
          paste = '<button class="btn soft wide mt-12" data-test="paste-tonight" data-act="paste">带回今晚</button>';
        }
        root.innerHTML = '<div class="page">' + heat + body(state) + paste + "</div>";
        root.querySelectorAll("[data-place],[data-guess]").forEach(function (input) {
          input.addEventListener("input", function () {
            var cap = App.Engine.capOf(get());
            var slot = input.hasAttribute("data-place") ? "[data-place-label]" : "[data-guess-label]";
            var lab = root.querySelector(slot);
            if (lab) lab.textContent = labelAt(cap, parseInt(input.value, 10) || 0);
          });
        });
      }
      function bind() {
        U.delegate(root, "[data-act]", "click", function (e, el) {
          if (el.disabled) return;
          var act = el.getAttribute("data-act");
          var state = get();
          if (!state) return;
          if (act === "leave") { api.onLeave(); return; }
          if (act === "offer") {
            commit(App.Engine.livingOffer(state, { who: el.getAttribute("data-who"), role: el.getAttribute("data-role") }));
            return;
          }
          if (act === "deeper") { commit(App.Engine.pushDeeper(state)); return; }
          if (act === "settle") { commit(App.Engine.settlePrompt(state, el.getAttribute("data-how"))); return; }
          if (act === "spin") { commit(App.Engine.spinWheel(state), { spin: true }); return; }
          if (act === "reroll") {
            var r = App.Engine.rerollWheel(state);
            if (r.events[0] && r.events[0].type === "blocked") App.UI.toast("重抽用完了");
            commit(r);
            return;
          }
          if (act === "hand") { commit(App.Engine.handTruth(state, el.getAttribute("data-who"))); return; }
          if (act === "thermo-lock") {
            var who = el.getAttribute("data-who");
            var place = parseInt((root.querySelector("[data-place]") || {}).value, 10) || 0;
            var guess = parseInt((root.querySelector("[data-guess]") || {}).value, 10) || 0;
            var locked = App.Engine.thermoSet(state, who, place, guess);
            if (who === "b") commit(App.Engine.thermoReveal(locked.state));
            else commit(locked);
            return;
          }
          if (act === "thermo-pass") { commit(App.Engine.thermoPass(state)); return; }
          if (act === "thermo-reveal") { commit(App.Engine.thermoReveal(state)); return; }
          if (act === "thermo-reset") { commit(App.Engine.thermoBegin(state)); return; }
          if (act === "bed") {
            var mode = App.Engine.bedroomMode(state, el.getAttribute("data-mode"));
            commit(App.Engine.bedroomDraw(mode.state));
            return;
          }
          if (act === "bed-draw") { commit(App.Engine.bedroomDraw(state)); return; }
          if (act === "stroll-roll") { commit(App.Engine.strollRoll(state)); return; }
          if (act === "stroll-settle") { commit(App.Engine.strollSettle(state, el.getAttribute("data-how"))); return; }
          if (act === "paste" && api.onPaste) api.onPaste(App.Engine.standalonePack(state));
        });
      }
      render();
      bind();
      return function () { clearTimeout(timer); };
    }
  };
})();

(function () {
  var App = window.App;
  var U = App.util;
  var GAMES = [
    { id: "thermo", name: "温度", where: "阳台", text: "各自猜对方会把热放在哪一格。" },
    { id: "truth", name: "真话", where: "浴室", text: "转盘停下。自己说，或交到对方手里。" },
    { id: "dare", name: "动作", where: "厨房", text: "转到的事跟着今晚的热度走。" },
    { id: "stroll", name: "走一走", where: "整间公寓", text: "一枚「我们」，走到哪间做哪间的事。" }
  ];

  function menu(root) {
    root.innerHTML =
      '<div class="page">' +
        '<div class="topbar"><button class="back" data-act="back" aria-label="返回">←</button><div class="tb-title">游戏门</div><div class="tb-right"></div></div>' +
        '<p class="kicker">单独玩，或收进今晚</p>' +
        '<h1 class="title-lg mt-8">门后的四样</h1>' +
        '<div class="door-grid mt-16">' +
          GAMES.map(function (g) {
            return '<button class="door-card" data-test="game-' + g.id + '" data-game="' + g.id + '"><span class="tiny">' + g.where + '</span><b>' + g.name + '</b><span>' + g.text + '</span></button>';
          }).join("") +
        "</div></div>";
    U.delegate(root, "[data-act=back]", "click", function () { App.Router.back(); });
    U.delegate(root, "[data-game]", "click", function (e, el) {
      App.Router.go("door", { game: el.getAttribute("data-game") });
    });
  }

  function startGame(game) {
    var settings = App.Store.getSettings();
    var cur = App.Store.getStandalone();
    if (cur && cur.game === game && cur.phase !== "done" && ((cur.log && cur.log.length) || (cur.wheel && cur.wheel.spun) || (cur.thermo && (cur.thermo.a || cur.thermo.revealed)) || (cur.stroll && cur.stroll.turns))) {
      return cur;
    }
    var s = App.Engine.newStandalone(game, settings, Date.now() % 1000000);
    App.Store.saveStandalone(s);
    return s;
  }

  App.Screens.door = {
    mount: function (root, params) {
      params = params || {};
      var game = params.game || null;
      if (!game) { menu(root); return; }
      startGame(game);
      return App.Kit.open(root, {
        night: false,
        get: function () { return App.Store.getStandalone(); },
        save: function (s) { App.Store.saveStandalone(s); if (s) App.Night.paint(s); },
        onLeave: function () { App.Router.back(); },
        onPaste: function (pack) {
          if (!pack) return;
          var night = App.Store.getSession();
          if (night && night.phase !== "done" && night.mode !== "standalone") {
            var ret = App.Engine.pasteStandalone(night, pack);
            App.Store.saveSession(ret.state);
            App.Night.paint(ret.state);
            App.UI.toast(ret.events[0] && ret.events[0].already ? "这场已经在今晚里了" : "带回今晚了");
            App.Router.reset("plan");
            return;
          }
          App.Store.setPending(pack);
          App.UI.toast("先在门厅把名字和尺度定下来");
          App.Router.reset("foyer");
        }
      });
    }
  };
})();

/* ===== V3 ui/pwa.js：PWA 注册 / 装到桌面入口 / 离线提示 / 版本更新 =====
 *
 * 对外 API：
 *   App.PWA.register()    —— app.js 启动时调用（幂等）
 *   App.PWA.showInstall() —— 任意屏幕可调用，打开「装到桌面」说明抽屉
 *   App.PWA.installed     —— 只读布尔（standalone / 本次会话已安装）
 *
 * 行为：
 *   · 仅 http/https 注册 ./sw.js（load 后）；file:// 静默跳过，不报错；
 *   · 捕获 beforeinstallprompt（preventDefault 存起来），有原生安装能力时
 *     右下角出现小胶囊「装到桌面」；iOS 没有 beforeinstallprompt，始终给出手动入口；
 *   · 已安装 / standalone 不显示胶囊；
 *   · 胶囊 z-index 400 < 抽屉 500，绝不挡弹层；
 *   · offline / online / appinstalled / SW 新版本就绪 各 toast 一次；
 *   · 不发起任何外部网络请求，不改任何游戏/引擎数据。
 */
(function () {

  var STATE = {
    booted: false,
    styleDone: false,
    deferred: null,      // beforeinstallprompt 事件（一次性）
    eligible: false,     // 本次会话曾经可安装（prompt 用掉后仍保留手动入口）
    installed: false,    // 本次会话内触发过 appinstalled
    online: (typeof navigator.onLine === "boolean" ? navigator.onLine : true),
    updateToasted: false,
    reg: null,
    pill: null
  };
  /* 右下角「装到桌面」胶囊已移除；安装说明 API 保留。 */
  var SHOW_PILL = false;

  /* ------------------------------------------------------------------ */
  /* 环境判断                                                            */
  /* ------------------------------------------------------------------ */
  function isHttp() {
    return location.protocol === "http:" || location.protocol === "https:";
  }

  function isStandalone() {
    try {
      if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
      if (window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches) return true;
    } catch (e) {}
    if (navigator.standalone === true) return true; // iOS 主屏启动
    return false;
  }

  function isInstalled() {
    return STATE.installed || isStandalone();
  }

  function isIOS() {
    var ua = String(navigator.userAgent || "");
    if (/iPad|iPhone|iPod/.test(ua)) return true;
    return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
  }

  function platform() {
    var ua = String(navigator.userAgent || "");
    if (isIOS()) return "ios";
    if (/Android/i.test(ua)) return "android";
    return "desktop";
  }

  function canPrompt() {
    return !!STATE.deferred;
  }

  /* ------------------------------------------------------------------ */
  /* toast 兜底                                                          */
  /* ------------------------------------------------------------------ */
  function toast(msg) {
    try {
      if (App.UI && App.UI.toast) App.UI.toast(msg);
    } catch (e) {}
  }

  /* ------------------------------------------------------------------ */
  /* 样式（运行时注入一次，全部走 base.css 设计令牌）                    */
  /* ------------------------------------------------------------------ */
  var CSS = [
    /* 右下角小胶囊：不打扰、低于抽屉(z500) */
    ".pwa-pill{position:fixed;z-index:400;",
    "  right:calc(14px + env(safe-area-inset-right,0px));",
    "  bottom:calc(16px + var(--safe-b));",
    "  display:inline-flex;align-items:center;gap:7px;",
    "  min-height:46px;padding:0 16px 0 14px;border-radius:999px;",
    "  background:rgba(24,16,42,.84);border:1px solid var(--line2);",
    "  color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.06em;",
    "  box-shadow:var(--sh-1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);",
    "  opacity:0;transform:translateY(10px) scale(.96);pointer-events:none;",
    "  transition:opacity var(--t-mid) var(--ease-out),transform var(--t-mid) var(--ease-out),",
    "             color var(--t-fast),border-color var(--t-fast);",
    "  -webkit-user-select:none;user-select:none;}",
    ".pwa-pill i{font-style:normal;font-size:14px;line-height:1;}",
    ".pwa-pill.on{opacity:.94;transform:none;pointer-events:auto;}",
    ".pwa-pill:active{transform:scale(.95);}",
    ".pwa-pill:hover{color:var(--ink);border-color:rgba(243,200,121,.42);}",
    /* 安全词优先：play 屏右下角是「长按安全词」按钮，隐藏胶囊，绝不遮挡 */
    'body[data-screen="play"] .pwa-pill{display:none;}',
    "@media (max-width:340px){.pwa-pill{right:10px;bottom:12px;font-size:11.5px;min-height:44px;}}",
    /* 安装说明抽屉 */
    ".pwa-sheet .sheet-sub{margin-bottom:2px;}",
    ".pwa-steps{display:flex;flex-direction:column;gap:10px;margin-top:14px;}",
    ".pwa-step{display:flex;align-items:flex-start;gap:11px;",
    "  padding:12px 14px;border-radius:var(--r-md);",
    "  background:var(--glass);border:1px solid var(--line);}",
    ".pwa-step b{flex:0 0 auto;width:22px;height:22px;border-radius:50%;",
    "  display:inline-flex;align-items:center;justify-content:center;",
    "  font-size:11.5px;font-weight:800;color:#2a0f1c;",
    "  background:linear-gradient(135deg,var(--gold),var(--rose));}",
    ".pwa-step span{font-size:13px;line-height:1.62;color:var(--dim);}",
    ".pwa-step span em{font-style:normal;color:var(--ink);font-weight:700;}",
    ".pwa-note{margin-top:14px;font-size:11.5px;line-height:1.7;color:var(--dim2);",
    "  border-top:1px solid var(--line);padding-top:12px;}",
    ".pwa-sheet .btn{margin-top:16px;}"
  ].join("\n");

  function injectStyle() {
    if (STATE.styleDone) return;
    try {
      if (App.UI && App.UI.injectStyle) App.UI.injectStyle("pwa", CSS);
      STATE.styleDone = true;
    } catch (e) {}
  }

  /* ------------------------------------------------------------------ */
  /* 右下角「装到桌面」胶囊                                              */
  /* ------------------------------------------------------------------ */
  function ensurePill() {
    if (!SHOW_PILL) return null;
    if (STATE.pill && document.body && document.body.contains(STATE.pill)) return STATE.pill;
    if (!document.body) return null;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "pwa-pill";
    btn.setAttribute("data-test", "pwa-install-pill");
    btn.setAttribute("aria-label", "装到桌面");
    btn.innerHTML = '<i aria-hidden="true">📲</i><span>装到桌面</span>';
    btn.addEventListener("click", function () {
      if (isInstalled()) { toast("已经装到桌面了 · 从主屏打开即可"); return; }
      if (canPrompt()) promptInstall();
      else showInstall();
    });
    // 挂在 #app 里而不是 body：#app 是 position:fixed 的 stacking context，
    // 这样胶囊(z400)才会真正低于抽屉(.sheet-mask z500)，不会浮在弹层上面。
    var host = document.getElementById("app") || document.body;
    host.appendChild(btn);
    STATE.pill = btn;
    return btn;
  }

  function syncPill() {
    try {
      var btn = ensurePill();
      if (!btn) return;
      var visible = !isInstalled() && (canPrompt() || STATE.eligible || isIOS());
      if (visible) btn.classList.add("on");
      else btn.classList.remove("on");
    } catch (e) {}
  }

  /* ------------------------------------------------------------------ */
  /* 原生安装提示                                                        */
  /* ------------------------------------------------------------------ */
  function promptInstall() {
    var ev = STATE.deferred;
    if (!ev) { showInstall(); return; }
    STATE.deferred = null; // beforeinstallprompt 只能 prompt 一次
    try {
      var p = ev.prompt();
      if (p && typeof p.then === "function") p["catch"](function () {});
      var choice = ev.userChoice;
      if (choice && typeof choice.then === "function") {
        choice.then(function (r) {
          if (r && r.outcome === "accepted") {
            toast("📲 正在安装…");
          } else {
            toast("已取消安装");
          }
          syncPill();
        })["catch"](function () {});
      }
    } catch (e) {
      showInstall(); // prompt 不可用时退回手动说明
    }
  }

  /* ------------------------------------------------------------------ */
  /* 手动安装说明抽屉                                                    */
  /* ------------------------------------------------------------------ */
  function stepsFor(p) {
    if (p === "ios") {
      return [
        '用 <em>Safari</em> 打开本页（微信 / QQ 内置浏览器不支持安装）',
        '点屏幕底部的 <em>⬆ 分享</em> 按钮',
        '在菜单里选 <em>「添加到主屏幕」</em>，再点右上角「添加」'
      ];
    }
    if (p === "android") {
      return [
        '点 Chrome 右上角的 <em>⋮</em> 菜单',
        '选 <em>「安装应用」</em>（部分机型叫「添加到主屏幕」）',
        '确认后桌面会出现 <em>「升温夜航」</em> 图标'
      ];
    }
    return [
      '点地址栏右侧的 <em>安装图标</em>（显示器 ⬇ / ⊕ 形状）',
      '在弹窗里选 <em>「安装」</em>',
      '之后从桌面 / 开始菜单打开，就是全屏 App'
    ];
  }

  function showInstall() {
    if (isInstalled()) { toast("已经装到桌面了 · 从主屏打开即可"); return; }
    var p = platform();
    var steps = stepsFor(p);
    var list = steps.map(function (s, i) {
      return '<div class="pwa-step"><b aria-hidden="true">' + (i + 1) + "</b><span>" + s + "</span></div>";
    }).join("");
    var actionLabel = canPrompt() ? "现在就装" : "知道了";
    var ref = null;
    try {
      ref = App.UI.sheet({
        title: "装到桌面",
        subtitle: "像 App 一样全屏打开 · 没有地址栏 · 离线也能继续夜航",
        cls: "pwa-sheet",
        html:
          '<div class="pwa-steps" data-test="pwa-install-sheet">' + list + "</div>" +
          '<div class="pwa-note">需要用 <b class="gold">https</b>（或本机 localhost）打开才支持安装；' +
          "iPad / iPhone 请用 Safari，安卓请用 Chrome。装好后数据仍在原浏览器里。</div>" +
          '<button class="btn primary wide" data-test="pwa-install-action">' + actionLabel + "</button>",
        onMount: function (panel, close) {
          var btn = panel.querySelector('[data-test="pwa-install-action"]');
          if (!btn) return;
          btn.addEventListener("click", function () {
            close();
            if (canPrompt()) promptInstall();
          });
        }
      });
    } catch (e) {
      return;
    }
    return ref;
  }

  /* ------------------------------------------------------------------ */
  /* Service Worker：注册 / 更新提示                                      */
  /* ------------------------------------------------------------------ */
  function notifyUpdateOnce() {
    if (STATE.updateToasted) return;
    STATE.updateToasted = true;
    toast("✨ 新版本已就绪，重开一次生效");
  }

  function watchUpdate(reg) {
    STATE.reg = reg;
    try {
      if (reg.waiting && navigator.serviceWorker.controller) notifyUpdateOnce();
      reg.addEventListener("updatefound", function () {
        var fresh = reg.installing;
        if (!fresh) return;
        fresh.addEventListener("statechange", function () {
          // 有 controller 才是「更新」而不是首次安装
          if (fresh.state === "installed" && navigator.serviceWorker.controller) notifyUpdateOnce();
        });
      });
    } catch (e) {}
  }

  function registerSW() {
    if (!isHttp()) return;                                   // file:// 等场景静默跳过
    if (!("serviceWorker" in navigator)) return;
    var go = function () {
      try {
        navigator.serviceWorker.register("./sw.js").then(function (reg) {
          watchUpdate(reg);
        })["catch"](function () {
          /* 注册失败（隐私策略 / 非安全上下文等）静默，不影响游戏 */
        });
      } catch (e) {}
    };
    if (document.readyState === "complete") go();
    else window.addEventListener("load", go);
  }

  /* ------------------------------------------------------------------ */
  /* 离线 / 联网 / 已安装 事件                                            */
  /* ------------------------------------------------------------------ */
  function bindEvents() {
    window.addEventListener("beforeinstallprompt", function (e) {
      try { e.preventDefault(); } catch (err) {}
      STATE.deferred = e;
      STATE.eligible = true;
      STATE.installed = false;
      syncPill();
    });

    window.addEventListener("appinstalled", function () {
      STATE.installed = true;
      STATE.deferred = null;
      toast("📲 已添加到桌面");
      syncPill();
    });

    window.addEventListener("offline", function () {
      if (STATE.online === false) return;
      STATE.online = false;
      toast("📴 已离线 · 夜航仍可继续");
    });

    window.addEventListener("online", function () {
      if (STATE.online === true) return;
      STATE.online = true;
      toast("🌐 已恢复联网");
    });
  }

  /* ------------------------------------------------------------------ */
  /* 初始化 + 对外 API                                                   */
  /* ------------------------------------------------------------------ */
  var PWA = {
    register: function () {
      if (STATE.booted) return;
      STATE.booted = true;
      injectStyle();
      ensurePill();
      syncPill();
      bindEvents();
      registerSW();
    },
    showInstall: showInstall,
    // 供屏幕/QA 使用的小工具
    platform: platform,
    canPrompt: canPrompt,
    isStandalone: isStandalone
  };

  // installed 用 getter：读 App.PWA.installed 永远是最新状态
  try {
    Object.defineProperty(PWA, "installed", {
      enumerable: true,
      get: function () { return isInstalled(); }
    });
  } catch (e) {
    PWA.installed = false;
  }

  App.PWA = PWA;
})();

/* ===== src/app.js ===== */
/* ===== V3 app.js：启动入口 ===== */
(function () {
  var App = (window.App = window.App || {});
  App.version = "4.0.0";

  function hashRoute() {
    var h = String(location.hash || "").replace(/^#\/?/, "");
    var m = /^door(?:\/(thermo|truth|dare|stroll))?$/.exec(h);
    if (!m) return null;
    return { name: "door", params: { game: m[1] || null } };
  }

  function boot() {
    App.UI.syncSettings();
    App.Router.init(document.getElementById("screen"));

    // 路由联动
    App.Bus.on("route", function (e) {
      document.body.setAttribute("data-screen", e.name);
      document.getElementById("screen").scrollTop = 0;
      var s = App.Store.getSettings();
      App.Audio.setEnabled(s.sound !== false);
    });
    App.Bus.on("settings", function (s) {
      App.Audio.setEnabled(s.sound !== false);
      App.Motion.syncBodyClass();
    });
    App.Bus.on("session", function () {
      App.Motion.syncBodyClass();
    });

    // 首次交互解锁音频
    var unlocked = false;
    function unlock() {
      if (unlocked) return;
      unlocked = true;
      App.Audio.unlock();
      document.removeEventListener("pointerdown", unlock, true);
    }
    document.addEventListener("pointerdown", unlock, true);

    // 全局错误：不静默
    window.addEventListener("error", function (e) {
      if (window.console) console.error("[app]", e.message);
    });
    window.addEventListener("unhandledrejection", function (e) {
      if (window.console) console.warn("[app] promise", e.reason);
    });

    // 全局安全词（长按 1.5s 温柔收尾；play 屏由 play.js 自带的安全词代替）
    try { if (App.Safe && App.Safe.init) App.Safe.init(); } catch (e) {}

    // PWA（可选模块）
    try { if (App.PWA && App.PWA.register) App.PWA.register(); } catch (e) {}

    try { App.Store.getSession(); } catch (e) {}
    var note = App.Store.takeLegacyNote && App.Store.takeLegacyNote();
    var route = hashRoute();
    if (route) App.Router.reset(route.name, route.params);
    else App.Router.reset("boot");
    if (note) App.UI.toast("上一趟夜航已收进以前的夜");
    try {
      var live = App.Store.getSession();
      if (App.Night && live) App.Night.paint(live);
    } catch (e2) {}
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
</body>
</html>
