  var win=h>s?HE.him:HE.her;
  snapShot();logEvent('💰 '+win+' 拍得拍品'+(window._aucIdx+1));
  window._swapHandler=null;window._pardonHandler=null;
  var content=window._aucIdx===0
    ?('🍀 '+win+' 获得免罚金牌，下次被罚可抵一次！')
    :(window._aucIdx===1
      ?('👑 '+win+' 可命令 '+otherPlayer(win)+'：'+pickFresh('_punishPick',GAMEDATA.punish))
      :('🧥 '+win+' 可指定 '+otherPlayer(win)+' 脱一件！'));
  c.innerHTML='<div class="bomb-wrap"><h2 style="margin-bottom:10px">💰 勇气竞拍</h2><div class="cmd-card" style="text-align:center"><div style="color:#ffd700;font-size:16px">🏆 '+win+' 以 '+window._aucBid[win]+' 勇气拍得！</div><div style="font-size:15px;margin-top:8px">'+content+'</div></div><div class="wheel-btns"><button class="wheel-btn spin" onclick="aucNext()">下一件</button></div></div>';

function aucNext(){

function aucSettle(){
  var h=window._aucCourage[HE.him],s=window._aucCourage[HE.her];

/* 竞拍平局: 石头剪刀布加赛 */

function flSetGender(d){
  var s=window._flSetup;
  var combos=s.n===2?[[2,0],[1,1],[0,2]]:[[4,0],[3,1],[2,2],[1,3],[0,4]];
  var idx=combos.findIndex(function(x){return x[0]===s.m&&x[1]===s.f;});

function flightStart(){
  window._flSess=(window._flSess||0)+1; /* 会话号: 摇骰重开新局时作废旧回调 */
  var s=window._flSetup=window._flSetup||{n:2,m:1,f:1,mode:'A',laps:1,diff:SET.diff};
  var players=[];
  if(s.n===2){
    if(s.m===1&&s.f===1)players=[{name:HE.him,g:'M'},{name:HE.her,g:'F'}];
    else if(s.m===2)players=[{name:HE.him,g:'M'},{name:'玩家2',g:'M'}];
    else players=[{name:HE.her,g:'F'},{name:'玩家2',g:'F'}];
  }else{
    var names=['玩家1','玩家2','玩家3','玩家4'];
    var gs=[];for(var i=0;i<s.m;i++)gs.push('M');for(var j=0;j<s.f;j++)gs.push('F');
    gs=shuffle(gs);
    players=gs.map(function(g,i){return {name:names[i],g:g};});
  }
  players.forEach(function(p,i){
    p.id=i;p.pos=0;p.lane=0;p.color=['#3498db','#e040fb','#2ecc71','#f39c12'][i];
    p.drink=0;p.drinkMax=p.g==='M'?5:3;p.pardon=1;p.half=p.g==='F'?1:0;
    p.track='main';p.sidePos=-1;p.done=false;p.team=i<2?0:1;p.six=0;p.skip=false;p.lap=0;
    p.idCard=(p.g==='M'?FLIGHT_IDS_M:FLIGHT_IDS_F)[Math.floor(Math.random()*(p.g==='M'?4:4))];
  });
  window._flP=players;
  window._flMode=s.mode;
  window._flModeName={A:'🏁 冰与火对飞',B:'🎡 欲望环岛',C:'💞 命运双轨',D:'👑 旗舰融合'}[s.mode];
  window._flLaps=s.laps||1;
  window._flTurn=0;
  window._flOrder= s.n===2?[0,1] : [0,2,1,3];
  window._flTPos=[0,0]; /* A模式: 队伍棋子位置 */
  window._flSix=0;

  window._flWin=false;window._flSixNext=false;window._flSix=0;

  var cov=document.getElementById('flChoiceOverlay');if(cov)cov.classList.remove('show');
  buildFlightBoard(s.mode);

function flDist(len){ /* 按难度生成格子分布 */
  var d=SET.diff||3;
  var spec={safe:d===1?0.25:(d===2?0.16:(d===3?0.10:0.06)),
            drink:d===1?0.10:(d===2?0.14:(d===3?0.18:0.22)),
            spicy:d===1?0:(d===2?0.08:(d===3?0.12:0.16)), /* V5.1: Lv1纯爱温和不再有刺激格 */
            duo:d===1?0.10:0.08,duel:0.08,event:d===1?0.05:(d===2?0.07:(d===3?0.10:0.13))};
  var counts={};var rest=len;
  ['safe','drink','spicy','duo','duel','event'].forEach(function(k){counts[k]=Math.floor(len*spec[k]);rest-=counts[k];});
  var arr=[];
  Object.keys(counts).forEach(function(k){for(var i=0;i<counts[k];i++)arr.push(k);});
  for(var i=0;i<rest;i++)arr.push(i%2===0?'truth':'dare');
  return shuffle(arr);
}
function buildFlightBoard(mode){
  var fast=SET.fast; /* V9: 快局模式(棋盘缩短) */
  var ALEN=fast?12:20, RLEN=fast?20:32;
  window._flSideM=flDist(5);window._flSideF=flDist(5);
  if(mode==='A'){
    window._flCells=[flDist(ALEN),flDist(ALEN)];
    window._flCells[0][0]='start';window._flCells[1][0]='start';
    window._flCells[0][ALEN-1]='end';window._flCells[1][ALEN-1]='end';
  }else if(mode==='B'||mode==='D'){
    var ring=flDist(RLEN);ring[0]='start';
    if(mode==='D'){ring[Math.floor(RLEN/4)]='cross';ring[Math.floor(RLEN*3/4)]='cross';} /* 融合: 两个交汇角进支线 */
    window._flCells=ring;
  }else{ /* C 双轨 */
    var main=flDist(14);main[0]='start';main[3]='cross';main[10]='cross';main[13]='end';
    window._flCells=main;
  }
  snapShot();logEvent('✈️ 飞行棋开局：'+window._flModeName+' '+window._flP.length+'人 难度'+DIFF_NAMES[SET.diff-1]);
  window._swapHandler=flSwapTask;
  window._pardonHandler=flGlobalPardon;
  flRender();
}

function flDiceFaces(){
  /* 1点: 中心 / 2点: 对角 / 3点: 斜线 / 4点: 四角 / 5点: 四角+中心 / 6点: 两列 */
  var pips={1:['4'],2:['0','8'],3:['0','4','8'],4:['0','2','6','8'],5:['0','2','4','6','8'],6:['0','3','6','1','4','7']};
  var html='';
  for(var f=1;f<=6;f++){
    var cells=[];
    for(var r=0;r<3;r++)for(var c2=0;c2<3;c2++)cells.push('<span class="'+(pips[f].indexOf(String(r*3+c2))>=0?'pip':'')+'" style="grid-area:'+(r+1)+'/'+(c2+1)+'"></span>');
    html+='<div class="df df'+f+'"><div class="pips">'+cells.join('')+'</div></div>';
  }
  return html;
}

function flDiceRoll(v,cb){
  /* V4.4: 居中弹出式3D骰子 — 摇时弹出, 停稳显示点数1秒, 淡出后结算 */
  var sess=window._flSess||0; /* 本次摇骰所属局, 防止重开后旧回调串场 */
  var ov=document.getElementById('flDiceOverlay');
  var wrap=document.getElementById('flDiceOverlayWrap');
  if(!ov||!wrap){(cb||function(){})();return;}
  var d=wrap.querySelector('.dice3d');
  d.innerHTML=flDiceFaces();
  var lbl=document.getElementById('flDiceOverlayLabel');
  var who='';
  var st=window._flDuelState;
  if(st){who=st.r1===null?st.p1.name:st.p2.name;}
  else{var p=window._flP[window._flOrder[window._flTurn]];if(p)who=p.name;}
  lbl.textContent='';
  ov.classList.add('show');
  wrap.classList.add('shaking');
  sndSpin();
  var target={1:'rotateX(0deg) rotateY(0deg)',2:'rotateX(0deg) rotateY(-90deg)',3:'rotateX(0deg) rotateY(180deg)',4:'rotateX(0deg) rotateY(90deg)',5:'rotateX(-90deg) rotateY(0deg)',6:'rotateX(90deg) rotateY(0deg)'}[v];
  var txn=target.indexOf('-90deg')>=0||target.indexOf('180deg')>=0?-1:1;
  var sx=txn<0?-720:720, sy=(v===5||v===6)?900:720+Math.floor(Math.random()*360);
  d.style.transition='none';
  d.style.transform='rotateX('+sx+'deg) rotateY('+sy+'deg)';
  void d.offsetWidth;
  d.style.transition='transform 1.5s cubic-bezier(0.22,0.78,0.25,1)';
  d.style.transform=target;
  setTimeout(function(){
    wrap.classList.remove('shaking');
    lbl.textContent=who+' 摇出 '+v+' 点！';
    sndDing();vibrate([40,30,60]);
    /* 停稳显示点数1秒后淡出, 再结算(校验会话防串场) */
    setTimeout(function(){
      ov.classList.remove('show');
      setTimeout(function(){if(window._flSess===sess)cb();},330);
    },1000);
  },1550);
}
function flTeamPlayer(lane){ /* 2人=各自1道, 4人=按队分道 */
  return window._flP.length===2?window._flP[lane]:window._flP[lane*2];
}
function flPieceHtml(p){ /* 棋子: 当前回合玩家的棋子加金圈脉冲 */
  var cur=window._flP[window._flOrder[window._flTurn]]===p;
  return '<span class="fl-piece'+(cur?' cur':'')+'" style="background:'+p.color+'">'+(p.g==='M'?'♂':'♀')+'</span>';
}
function flBoardA(){
  function row(lane,rot){
    var cells=window._flCells[lane];
    var pl=flTeamPlayer(lane);
    var html=cells.map(function(t,i){
      var tp=window._flTPos[lane];
      var piece=(tp===i&&!window._flWin)?flPieceHtml(pl):'';
      return '<span class="fl-cell t-'+t+(t==='start'?' start':'')+(t==='end'?' start':'')+'">'+flIcon(t)+piece+'</span>';
    }).join('');
    var curP=window._flP[window._flOrder[window._flTurn]];
    var active=curP&&curP.team===lane;
    return '<div class="fl-lane'+(rot?' rot':'')+(active?' fl-lane-active':'')+'"><div class="fl-lane-label">'+(lane===0?window._flP[0].name+' 道':pl.name+' 道')+'</div><div class="fl-cells">'+html+'</div></div>';
  }
  return '<div class="vs-stage"><div class="vs-zone vs-top">'+row(1,true)+'</div><div class="vs-mid" style="font-size:12px;color:#aaa">对撞=抢格对决，输者后退2格+罚酒</div><div class="vs-zone vs-bottom">'+row(0,false)+'</div></div>';
}
function flBoardRing(){
  var cells=window._flCells;
  var html='<div class="fl-ring">';
  var rlen=cells.length;
  var fastRing=rlen===20;
  for(var i=0;i<rlen;i++){
    var row,col;
    if(fastRing){
      if(i<5){row=1;col=i+1;}
      else if(i<10){row=i-4;col=9;}
      else if(i<15){row=9;col=9-(i-10);}

/* --- 掷骰子 --- */
function flRoll(){
  var p=window._flP[window._flOrder[window._flTurn]];
  if(!p){return;}
  if(p.skip){p.skip=false;flNextTurn();return;}
  if(window._flRolled)return;
  if(p.track!=='main'){ /* 支线: 每回合自动走1步 */
    window._flRolled=true;
    flSideStep(p);
    return;
  }
  window._flRolled=true;
  var btn=document.getElementById('flRollBtn');if(btn)btn.disabled=true;
  var v=Math.floor(Math.random()*6)+1;
  flDiceRoll(v,function(){flMove(p,v);});
}
function flMove(p,v){
  logEvent('✈️ '+p.name+' 掷出 '+v+' 点');
  if(v===6){ /* 掷6再掷一次, 连3个6罚停 */
    window._flSix++;
    if(window._flSix>=3){
      window._flSix=0;window._flSixNext=false;
      p.drink=Math.min(p.drink+0.5,p.drinkMax);
      toast('⚡ '+p.name+' 连掷3个6！罚停+罚半杯');
      logEvent('✈️ '+p.name+' 连掷3个6被罚停');
    }else{
      window._flSixNext=true;
      toast('🎲 '+p.name+' 掷出6！再掷一次');
    }
  }else{
    window._flSix=0;window._flSixNext=false;
  }
  var mode=window._flMode;
  if(mode==='A'){
    var lane=p.team;
    var target=window._flTPos[lane]+v;
    if(target>=window._flCells[lane].length-1){
      window._flTPos[lane]=window._flCells[lane].length-1;
      flRender();flWin(lane,'team');return;
    }
    window._flTPos[lane]=target;
    flRender();
    var other=1-lane;
    if(window._flTPos[other]===target&&target>0&&target<window._flCells[lane].length-1){
      flDuel(flTeamPlayer(lane),flTeamPlayer(other));return;
    }
    flLand(p,window._flCells[lane][target],target);
  }else if(mode==='B'||mode==='D'){
    p.pos+=v;
    if(p.pos>=window._flCells.length){
      p.lap++;
      if(p.lap>=window._flLaps){flRender();flWin(p.id,'solo');return;}
    }
    flRender();
    var cell=window._flCells[p.pos%window._flCells.length];
    if(mode==='D'){
      var occ=window._flP.filter(function(x){return x.id!==p.id&&!x.done&&x.track==='main'&&x.pos%window._flCells.length===p.pos%window._flCells.length;});
      if(occ.length){flDuel(p,occ[0]);return;}
    }
    flLand(p,cell,p.pos%window._flCells.length);
  }else{ /* C */
    p.pos+=v;
    if(p.pos>=window._flCells.length-1){p.pos=window._flCells.length-1;flRender();flWin(p.id,'solo');return;}
    flRender();
    flLand(p,window._flCells[p.pos],p.pos);
  }
}
function flSideStep(p){

var PAIR_PARTS=(function(){var a=[];GAMEDATA.pairs.forEach(function(x){var p=x.split('｜');if(p[0])a.push(p[0]);if(p[1])a.push(p[1]);});return a;})();
/* 套用原版转盘配色: 真心话=紫系, 大冒险=红系 */
var TRUTH_COLORS=['#6c2bd9','#7c3aed','#8b5cf6','#a855f7','#7c3aed','#8b5cf6','#6c2bd9','#a855f7'];
var DARE_COLORS=['#ff6b6b','#ee5a24','#e74c3c','#ff4757','#ff6348','#e55039','#eb4d4b','#fc5c65'];
function flWheelTask(o){
  snapShot();
  o.curCat=o.curCat||o.defaultCat||null;
  window._flWheel=o;
  flWheelBuild(o.target);
}
function flWheelBuild(target){
  var o=window._flWheel||{};
  var segs=[target];
  var guard=0;
  while(segs.length<8&&guard<300){
    guard++;
    var d=randItem(o.pool||GAMEDATA.truths);
    if(segs.indexOf(d)<0)segs.push(d);
  }
  while(segs.length<8)segs.push('💖 惊喜互动');
  for(var i=segs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=segs[i];segs[i]=segs[j];segs[j]=tmp;}
  window._flWheelSegs=segs;
  window._flWheelSel=segs.indexOf(target);
  if(window._flWheelSel<0)window._flWheelSel=0;
  window._flWheelColors=(o.colorCat&&o.curCat)?o.colorCat(o.curCat):(o.curCat==='dare'?DARE_COLORS:TRUTH_COLORS);
  var ov=document.getElementById('flWheelOverlay');
  if(ov)ov.classList.add('show');
  var rs=document.getElementById('flWheelResult');
  if(rs)rs.innerHTML='';
  flWheelTabs();
  window._flWheelAngle=window._flWheelAngle||0; /* 必须初始化为0, 否则NaN导致扇区画不出来 */
  sndSpin();
  flWheelDraw();
  flWheelSpin();
}
function flWheelTabs(){
  /* V4.9: 真心话/大冒险选项卡(套用原版双转盘) */
  var o=window._flWheel;

  }).join('');
}
function flWheelTab(cat){
  var o=window._flWheel;
  if(!o||cat===o.curCat)return;
  o.curCat=cat;
  o.title=(cat==='truth'?'💜 真心话':'🔥 大冒险');

  flWheelBuild(o.target);

function flWheelDraw(){
  /* V4.9: 套用原版转盘样式(外圈40颗金粉灯珠+扇区文字) */
  var c=document.getElementById('flWheelCanvas');if(!c)return;
  var ctx=c.getContext('2d');
  var W=c.width,H=c.height,cx=W/2,cy=H/2,R=W/2-12,n=window._flWheelSegs.length;
  var colors=window._flWheelColors||TRUTH_COLORS;
  ctx.clearRect(0,0,W,H);
  for(var i=0;i<40;i++){
    var a=(i/40)*Math.PI*2-Math.PI/2;
    var bx=cx+Math.cos(a)*(R+4),by=cy+Math.sin(a)*(R+4);
    ctx.beginPath();ctx.arc(bx,by,4,0,Math.PI*2);
    ctx.fillStyle=i%2===0?'#ffd700':'#ff6b9d';ctx.fill();
  }
  var arc=Math.PI*2/n;
  for(var i=0;i<n;i++){
    var sa=arc*i-Math.PI/2+(window._flWheelAngle||0)*Math.PI/180;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,sa,sa+arc);ctx.closePath();
    ctx.fillStyle=colors[i%colors.length];ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(sa+arc/2);
    ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    var txt=window._flWheelSegs[i];if(txt.length>7)txt=txt.substring(0,7)+'…';
    ctx.fillText(txt,R*0.62,0);ctx.restore();
  }
  ctx.beginPath();ctx.arc(cx,cy,24,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.fillStyle='#e040fb';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('GO',cx,cy);
}
function flWheelSpin(){
  if(window._flWheelTv)cancelAnimationFrame(window._flWheelTv);
  var sel=window._flWheelSel,n=window._flWheelSegs.length,seg=360/n;
  var cur=(window._flWheelAngle||0)%360;
  var base=((-sel*seg)%360+360)%360;
  var turns=5+Math.floor(Math.random()*2);
  var end=cur+turns*360+(base-cur+360)%360;
  var t0=null,dur=window._flWheelDur||2800;
  function step(ts){
    if(!t0)t0=ts;
    var k=Math.min(1,(ts-t0)/dur);
    var e=1-Math.pow(1-k,3);
    window._flWheelAngle=cur+(end-cur)*e;
    flWheelDraw();
    if(k<1){window._flWheelTv=requestAnimationFrame(step);}
    else{flWheelStop();}
  }
  window._flWheelTv=requestAnimationFrame(step);
}
function flWheelStop(){
  sndDing();vibrate([40,30,60]);
  var o=window._flWheel;
  var rs=document.getElementById('flWheelResult');
  if(rs){

      poolCat:function(cat){return cat==='dare'?GAMEDATA.flightF.dare:GAMEDATA.flightF.truth;}});

      cats:['dare','truth'],defaultCat:'dare',
      drawCat:function(cat){return pickFresh(cat==='dare'?'_flMDarePick':'_flMTruthPick',cat==='dare'?GAMEDATA.flightM.dare:GAMEDATA.flightM.truth);},
      poolCat:function(cat){return cat==='dare'?GAMEDATA.flightM.dare:GAMEDATA.flightM.truth;}});
    return;
  }
  if(e.fx==='stare'){
    var duo=flDrawDuo();
    logEvent('✈️ 事件卡：'+e.t);
    flWheelTask({who:'👀 对视30秒不许笑',title:'🎁 '+e.t+' · 然后一起完成',target:duo,pool:GAMEDATA.flightD.dare.concat(GAMEDATA.flightD.truth),btns:['done','pardon'],
      cats:['dare','truth'],defaultCat:'dare',

      poolCat:function(cat){return cat==='dare'?GAMEDATA.flightD.dare:GAMEDATA.flightD.truth;}});
    return;
  }
  if(e.fx==='dare2'){
    var d1=pickFresh('_darePick',GAMEDATA.dare);

      cats:['dare','truth'],defaultCat:'dare',

      poolCat:function(cat){return cat==='dare'?GAMEDATA.dare:GAMEDATA.truths;}});
    return;
  }
  if(e.fx==='choice'){

      +'<h2 style="margin-bottom:10px">💰 真心话保险箱</h2>'
      +'<div style="text-align:center;color:#ffd700">'+ask+' 押注：'+vaultBetText(window._vBet,mult)+(mult>1?'（连续不答 ×'+mult+'）':'')+'</div>'
      +'<div class="cmd-card" style="font-size:16px;line-height:1.7">💜 '+ans+' 请回答：<br><b>'+window._vQ+'</b></div>'
      +'<div class="wheel-btns" style="display:block">'
      +'<button class="wheel-btn spin" onclick="vaultAnswer(true)">✅ 真答</button>'
      +'<button class="wheel-btn back" onclick="vaultAnswer(false)">🙊 不答，赔注</button>'
      +'<button class="wheel-btn back" onclick="window._pardonHandler()">🚩 弃权本轮</button>'
      +'</div></div>';
  }
}
function vaultSetBet(b){
  window._vBet=b;
  window._vQ=flDrawTruth({g:window._vAsk===HE.him?'F':'M'});
  renderVaultPanel(document.getElementById('gContent'));
}
function vaultAnswer(ok){
  var ans=otherPlayer(window._vAsk);
  var key=ans===HE.him?'him':'her';
  var mult=Math.pow(2,Math.min(window._vStreak,2));
  if(ok){
    window._vStreak=0;
    logEvent('💰 '+ans+' 真答：'+window._vQ.slice(0,20));
    toast('✅ 真答！安全过关');
    vNextTurn();
  }else{
    window._vRefused[key]++;
    window._vStreak++;
    logEvent('💰 '+ans+' 不答，赔注 ×'+mult);
    var n=window._vBet===4?mult*2:mult;
    var lines=[];
    if(window._vBet===1){lines.push(pickDrink());}
    else if(window._vBet===2){for(var i=0;i<n;i++)lines.push(randItem(KISS_POOL));}
    else{for(var i=0;i<n;i++)lines.push(pickFresh('_darePick',GAMEDATA.dare));}
    var c=document.getElementById('gContent');
    c.innerHTML='<div class="bomb-wrap">'
      +'<h2 style="margin-bottom:10px">🙊 不答！赔注</h2>'
      +'<div class="cmd-card" style="font-size:16px;line-height:1.9">'+ans+' 必须执行：<br>'+lines.join('<br>')+'</div>'
      +'<div class="wheel-btns"><button class="wheel-btn spin" onclick="vNextTurn()">✅ 执行完了</button></div></div>';
  }
}
function vNextTurn(){
  window._vRounds++;
  if(window._vRounds>=8){
    var hr=window._vRefused.him,er=window._vRefused.her;
    var loser=hr===er?null:(hr>er?HE.him:HE.her);
    logEvent('💰 保险箱结算：'+HE.him+'拒'+hr+'次 / '+HE.her+'拒'+er+'次');
    var c=document.getElementById('gContent');
    c.innerHTML='<div class="bomb-wrap">'
      +'<h2 style="margin-bottom:10px">🏁 保险箱结算</h2>'
      +'<div style="text-align:center;font-size:15px">'+HE.him+' 拒答 '+hr+' 次 ｜ '+HE.her+' 拒答 '+er+' 次</div>'
      +(loser?'<div class="cmd-card" style="margin-top:10px">😈 '+loser+' 拒答更多，额外惩罚：<br>'+pickFresh('_punishPick',GAMEDATA.punish)+'</div>':'<div class="cmd-card" style="margin-top:10px">🤝 平手！互相亲一个收工</div>')
      +'<div class="wheel-btns"><button class="wheel-btn spin" onclick="renderVaultBody(document.getElementById(\'gContent\'))">🔄 再来一局</button></div></div>';
  }else{
    window._vAsk=otherPlayer(window._vAsk);
    window._vBet=null;
    window._vQ=null;
    renderVaultPanel(document.getElementById('gContent'));
  }
}
/* ===== V6-P6 👑 五分钟国王 ===== */
function renderKing5(c){renderDuel(c,function(){renderKing5Body(c);});}
function renderKing5Body(c){
  window._k5King=window._duelWinner;
  window._k5Courage={};window._k5Courage[HE.him]=3;window._k5Courage[HE.her]=3; /* 键名必须用玩家昵称 */
  window._k5Cmds=null;
  window._k5Reign=0;
  window._swapHandler=function(){k5Draw(document.getElementById('gContent'));};
  window._pardonHandler=function(){toast('🚩 本轮跳过');k5Next();};
  snapShot();logEvent('👑 五分钟国王 · '+window._k5King+' 登基');
  k5Draw(c);
}
function k5Draw(c){
  window._k5Cmds=[pickFresh('_k5softPick',GAMEDATA.flightD.dare.concat(GAMEDATA.flightD.truth)),pickFresh('_darePick',GAMEDATA.dare),randItem(GAMEDATA.exercise)];
  var k=window._k5King,sub=otherPlayer(k);
  c.innerHTML='<div class="bomb-wrap">'
    +'<h2 style="margin-bottom:10px">👑 五分钟国王</h2>'
    +'<p style="color:#aaa;font-size:13px">规则：'+k+' 登基，每统治 3 道命令换庄。三道命令牌各抽 1 张，国王选 1 张下令。'+sub+' 可花 1 点勇气换掉全部命令牌，勇气用完只能服从</p>'
    +'<div style="text-align:center;margin:8px 0">'
    +'<span class="mini-btn">👑 '+k+' 在位</span> <span class="mini-btn">王权 '+(window._k5Reign+1)+'/3</span> '
    +'<span class="mini-btn">💪 '+sub+' 勇气 '+(window._k5Courage[sub]||0)+'</span></div>'
    +'<div class="cmd-card" onclick="k5Choose(0)">🕊️ 温柔：'+window._k5Cmds[0]+'</div>'
    +'<div class="cmd-card" onclick="k5Choose(1)">🔥 刺激：'+window._k5Cmds[1]+'</div>'
    +'<div class="cmd-card" onclick="k5Choose(2)">🏋️ 体能：'+window._k5Cmds[2]+'</div>'
    +'<div class="wheel-btns">'
    +'<button class="wheel-btn back" onclick="k5Reroll()">🔄 换一批（'+sub+' 勇气-1）</button>'
    +'<button class="wheel-btn back" onclick="renderKing5Body(document.getElementById(\'gContent\'))">🔁 重新开局</button>'
    +'</div></div>';
}
function k5Reroll(){
  var sub=otherPlayer(window._k5King);
  if((window._k5Courage[sub]||0)<=0){toast('💪 勇气已用完，只能服从！');return;}
  window._k5Courage[sub]--;
  logEvent('👑 '+sub+' 花1勇气换命令');
  k5Draw(document.getElementById('gContent'));
}
function k5Choose(i){
  var k=window._k5King,sub=otherPlayer(k);
  logEvent('👑 '+k+' 下令：'+window._k5Cmds[i].slice(0,20));
  var c=document.getElementById('gContent');
  c.innerHTML='<div class="bomb-wrap">'
    +'<h2 style="margin-bottom:10px">👑 国王命令</h2>'
    +'<div class="cmd-card" style="font-size:17px;line-height:1.8">'+k+' 下令，'+sub+' 执行：<br><b>'+window._k5Cmds[i]+'</b></div>'
    +'<div class="wheel-btns" style="display:block">'
    +'<button class="wheel-btn spin" onclick="k5Next()">✅ 服从，执行完了</button>'
    +'<button class="wheel-btn back" onclick="k5Reroll()">💪 花 1 勇气换命令（剩 '+(window._k5Courage[sub]||0)+'）</button>'
    +'</div></div>';
}
function k5Next(){
  window._k5Reign++;
  if(window._k5Reign>=3){
    window._k5King=otherPlayer(window._k5King);
    window._k5Reign=0;
    toast('👑 王权更替！'+window._k5King+' 登基');
    logEvent('👑 王权更替：'+window._k5King+' 登基');
  }
  k5Draw(document.getElementById('gContent'));
}
/* ===== V6-P7 🎲 盲盒骰子 ===== */
function renderBlindDice(c){renderDuel(c,function(){renderBlindDiceBody(c);});}
function renderBlindDiceBody(c){
  window._bdTurn=window._duelWinner;
  window._bdRerollUsed=false;
  window._bdResult=null;
  window._bdBusy=false;
  window._swapHandler=function(){bdReroll();};
  window._pardonHandler=function(){toast('🚩 本轮跳过');bdNext();};
  snapShot();logEvent('🎲 盲盒骰子 · '+window._bdTurn+' 先摇');
  bdPanel(c);
}
function bdPanel(c){
  var t=window._bdTurn;
  if(!window._bdResult){
    c.innerHTML='<div class="bomb-wrap">'
      +'<h2 style="margin-bottom:10px">🎲 盲盒骰子</h2>'
      +'<p style="color:#aaa;font-size:13px">规则：'+t+' 摇骰子，六面惩罚未知：1酒 2吻 3大冒险 4真心话 5安全 6刺激。摇到 5 可指定对方执行；不满意可花替换卡重摇一次</p>'
      +'<div class="wheel-btns"><button class="wheel-btn spin" onclick="bdRoll()">🎲 '+t+' 摇骰子</button></div>'
      +'<div style="text-align:center;color:#777;font-size:12px;margin-top:8px">1️⃣🍷 2️⃣💋 3️⃣🔥 4️⃣💜 5️⃣🛡️ 6️⃣💣</div>'
      +'<div class="wheel-btns"><button class="wheel-btn back" onclick="renderBlindDiceBody(document.getElementById(\'gContent\'))">🔄 重来</button></div>'
      +'</div>';
  }else if(window._bdResult.face===5){
    c.innerHTML='<div class="bomb-wrap">'
      +'<h2 style="margin-bottom:10px">🛡️ 安全面！</h2>'
      +'<div class="cmd-card">'+t+' 摇到安全面，二选一：</div>'
      +'<div class="wheel-btns" style="display:block">'
      +'<button class="wheel-btn spin" onclick="bdSafeOrder()">😈 指定对方做一条大冒险</button>'
      +'<button class="wheel-btn back" onclick="bdNext()">🍀 自己免罚收工</button>'
      +'</div></div>';
  }else{
    c.innerHTML='<div class="bomb-wrap">'
      +'<h2 style="margin-bottom:10px">🎲 摇出 '+window._bdResult.face+' 点</h2>'
      +'<div class="cmd-card" style="font-size:16px;line-height:1.8">'+window._bdResult.text+'</div>'
      +'<div class="wheel-btns" style="display:block">'
      +'<button class="wheel-btn spin" onclick="bdNext()">✅ 执行完了</button>'
      +(window._bdRerollUsed?'':'<button class="wheel-btn back" onclick="bdReroll()">🃏 花替换卡重摇（'+ITEMS.swap+'）</button>')
      +'</div></div>';
  }
}
function bdRoll(){
  if(window._bdBusy)return;
  window._bdBusy=true;
  var v=1+Math.floor(Math.random()*6);
  flDiceRoll(v,function(){window._bdBusy=false;bdResolve(v);});
}
function bdResolve(v){
  var t=window._bdTurn;
  var faceText={1:function(){return '🍷 '+pickDrink();},
                2:function(){return '💋 '+randItem(KISS_POOL);},
                3:function(){return '🔥 '+pickFresh('_darePick',GAMEDATA.dare);},
                4:function(){return '💜 '+flDrawTruth({g:t===HE.him?'M':'F'});},
                6:function(){return '💣 '+flDrawSpicy({g:t===HE.him?'M':'F'});}};
  window._bdResult={face:v,text:v===5?null:faceText[v]()};
  logEvent('🎲 盲盒骰子：'+t+' 摇出 '+v+' 点');
  bdPanel(document.getElementById('gContent'));
}
function bdSafeOrder(){
  var o=otherPlayer(window._bdTurn);
  logEvent('🛡️ '+window._bdTurn+' 指定 '+o+' 做大冒险');
  var c=document.getElementById('gContent');
  c.innerHTML='<div class="bomb-wrap">'
    +'<h2 style="margin-bottom:10px">🛡️ 安全面</h2>'
    +'<div class="cmd-card" style="font-size:16px">'+o+' 必须执行：<br>'+pickFresh('_darePick',GAMEDATA.dare)+'</div>'
    +'<div class="wheel-btns"><button class="wheel-btn spin" onclick="bdNext()">✅ 执行完了</button></div></div>';
}
function bdReroll(){
  if(window._bdRerollUsed){toast('🃏 本回合已重摇过');return;}
  if(ITEMS.swap<=0){toast('🃏 替换卡不足');return;}
  ITEMS.swap--;saveItems();renderCtrl();
  window._bdRerollUsed=true;
  window._bdResult=null;
  logEvent('🎲 盲盒骰子：花替换卡重摇');
  bdRoll();
}
function bdNext(){
  window._bdTurn=otherPlayer(window._bdTurn);
  window._bdRerollUsed=false;
  window._bdResult=null;
  bdPanel(document.getElementById('gContent'));
}
/* ===== V7-P5 🕯️ 主题之夜 ===== */
function renderNight(c){renderDuel(c,function(){renderNightBody(c);});}
function renderNightBody(c){
  window._ntScene=null;
  window._swapHandler=function(){ntDraw(document.getElementById('gContent'));};
  window._pardonHandler=function(){toast('🚩 本幕跳过');ntNext();};
  snapShot();logEvent('🕯️ 主题之夜 · 选剧本');
  c.innerHTML='<div class="bomb-wrap">'
    +'<h2 style="margin-bottom:10px">🕯️ 主题之夜</h2>'
    +'<p style="color:#aaa;font-size:13px">三个剧本可选：酒店之夜（四幕剧情25条）、角色扮演之夜（24组角色入戏）、蒙眼之夜（感官引导）。全程带进度条，可随时跳过/暂停</p>'
    +'<div class="cmd-card" onclick="ntSet(\'hotel\')"><b>🏨 酒店之夜</b><br><span style="font-size:12px;color:#aaa">入场→浴室→正题→安抚，四幕渐进</span></div>'
    +'<div class="cmd-card" onclick="ntSet(\'role\')"><b>🎭 角色扮演之夜</b><br><span style="font-size:12px;color:#aaa">24组角色入戏，跳戏罚酒</span></div>'
    +'<div class="cmd-card" onclick="ntSet(\'blind\')"><b>🕯️ 蒙眼之夜</b><br><span style="font-size:12px;color:#aaa">一方蒙眼，全程触觉引导</span></div>'
    +'</div>';
}
function ntSet(s){
  window._ntScene=s;
  window._ntStage=0;
  window._ntDealt=0;
  window._ntTotal=s==='hotel'?25:(s==='role'?10:10);
  if(s==='hotel')window._ntPool=['a1','a2','a3','a4'];
  if(s==='role'){window._ntPair=randItem(GAMEDATA.roles).split('|');}
  logEvent('🕯️ 主题之夜：'+(s==='hotel'?'酒店之夜':(s==='role'?'角色扮演':'蒙眼之夜')));
  ntDraw(document.getElementById('gContent'));
}
function ntDraw(c){
  var s=window._ntScene;
  if(s==='hotel'){
    if(window._ntDealt>=window._ntTotal){ntFinish(c);return;}
    var stages=['a1','a2','a3','a4'];
    var labels=['🛎️ 第一幕 · 入场','🚿 第二幕 · 浴室升温','🛏️ 第三幕 · 正题','🌙 第四幕 · 事后安抚'];
    var cum=[0,5,11,19]; /* 各幕累计起点: 5+6+8+6=25 */
    var stage=window._ntDealt<5?0:(window._ntDealt<11?1:(window._ntDealt<19?2:3));
    var pool=HOTEL[stages[stage]];
    var task=pool[(window._ntDealt-cum[stage])%pool.length];
    c.innerHTML='<div class="bomb-wrap">'
      +'<h2 style="margin-bottom:8px">🏨 酒店之夜</h2>'
      +'<div style="text-align:center;color:#ffd700;font-size:13px">'+labels[stage]+'（'+window._ntDealt+'/'+window._ntTotal+'）</div>'
      +'<div class="cmd-card" style="font-size:17px;line-height:1.8;margin-top:10px">'+task+'</div>'
      +'<div class="wheel-btns" style="display:block;margin-top:12px">'
      +'<button class="wheel-btn spin" onclick="ntDone()">✅ 完成，下一幕</button>'
      +'<button class="wheel-btn back" onclick="ntDraw(document.getElementById(\'gContent\'))">🔄 换一条</button>'
      +'<button class="wheel-btn back" onclick="ntNext()">⏭️ 跳过这条</button>'
      +'</div></div>';
  }else if(s==='role'){
    var pair=window._ntPair;
    if(window._ntDealt>=window._ntTotal){ntFinish(c);return;}
    var task=Math.random()<0.5?randItem(GAMEDATA.flightD.dare):pickFresh('_darePick',GAMEDATA.dare);
    c.innerHTML='<div class="bomb-wrap">'
      +'<h2 style="margin-bottom:8px">🎭 角色扮演之夜</h2>'
      +'<div style="text-align:center;color:#ffd700;font-size:14px">'+pair[0]+' × '+pair[1]+'（'+window._ntDealt+'/'+window._ntTotal+'）</div>'
      +'<div class="cmd-card" style="font-size:17px;line-height:1.8;margin-top:10px">入戏执行：<b>'+task+'</b><br><span style="font-size:12px;color:#aaa">跳戏罚酒一杯</span></div>'
      +'<div class="wheel-btns" style="display:block;margin-top:12px">'
      +'<button class="wheel-btn spin" onclick="ntDone()">✅ 入戏完成</button>'
      +'<button class="wheel-btn back" onclick="ntRoleSwap()">🎭 换一对角色</button>'
      +'<button class="wheel-btn back" onclick="ntNext()">⏭️ 跳过</button>'
      +'</div></div>';
  }else{
    var tasks=BLIND_NIGHT;
    if(window._ntDealt>=window._ntTotal){ntFinish(c);return;}
    var task2=tasks[window._ntDealt%tasks.length];
    c.innerHTML='<div class="bomb-wrap">'
      +'<h2 style="margin-bottom:8px">🕯️ 蒙眼之夜</h2>'
      +'<div style="text-align:center;color:#ffd700;font-size:13px">第 '+(window._ntDealt+1)+'/'+window._ntTotal+' 项 · 一方蒙眼执行</div>'
      +'<div class="cmd-card" style="font-size:17px;line-height:1.8;margin-top:10px">'+task2+'</div>'
      +'<div class="wheel-btns" style="display:block;margin-top:12px">'
      +'<button class="wheel-btn spin" onclick="ntDone()">✅ 完成</button>'
      +'<button class="wheel-btn back" onclick="ntSpeak()">🔊 语音引导</button>'
      +'<button class="wheel-btn back" onclick="ntNext()">⏭️ 跳过</button>'
      +'</div></div>';
  }
}
function ntSpeak(){
  try{
    if('speechSynthesis' in window){
      var u=new SpeechSynthesisUtterance(window._ntScene==='blind'?BLIND_NIGHT[window._ntDealt%BLIND_NIGHT.length]:'');
      u.lang='zh-CN';speechSynthesis.speak(u);
      toast('🔊 语音引导中');
    }else{toast('当前浏览器不支持语音');}
  }catch(e){toast('语音不可用');}
}
function ntRoleSwap(){
  window._ntPair=randItem(GAMEDATA.roles).split('|');
  ntDraw(document.getElementById('gContent'));
}
function ntDone(){
  window._ntDealt++;
  taskDone();
  ntDraw(document.getElementById('gContent'));
}
function ntNext(){
  window._ntDealt++;
  ntDraw(document.getElementById('gContent'));
}
function ntFinish(c){
  logEvent('🕯️ 主题之夜完成！');
  c.innerHTML='<div class="bomb-wrap">'
    +'<h2 style="margin-bottom:10px">🌙 剧本完成！</h2>'
    +'<div class="cmd-card" style="text-align:center;font-size:16px">今晚的主题之夜圆满收官~<br>奖励：互相说一句最想说的话，然后亲一下</div>'
    +'<div class="wheel-btns"><button class="wheel-btn spin" onclick="renderNightBody(document.getElementById(\'gContent\'))">🔄 换个剧本</button></div></div>';
}
</script>
<!-- V4.4 居中弹出式骰子层: 摇时出现, 停稳显示点数后消失 -->
<div id="flDiceOverlay">
  <div class="fl-ov-zoom"><div class="dice3d-wrap" id="flDiceOverlayWrap"><div class="dice3d"></div></div></div>
  <div id="flDiceOverlayLabel"></div>
</div>
<!-- V4.8 任务大转盘浮层(抽任务时弹出, 不影响棋盘) -->
<div id="flWheelOverlay">
  <div id="flWheelTabs"></div>
  <div class="fl-wheel-wrap"><canvas id="flWheelCanvas" width="300" height="300"></canvas><div class="fl-wheel-pointer">▼</div></div>
  <div id="flWheelResult"></div>
</div>
<!-- V4.8 二选一选项浮层 -->
<div id="flChoiceOverlay"></div>
<!-- V8 导演模式浮层 -->
<div id="dirOverlay" class="dir-overlay"></div>
</body>
