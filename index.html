var audioCtx=null;
function getAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function playBeep(freq,dur,type,vol){
  try{var ctx=getAudioCtx(),o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'sine';o.frequency.value=freq;g.gain.value=vol||0.15;
  o.connect(g);g.connect(ctx.destination);o.start();
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
  o.stop(ctx.currentTime+dur)}catch(e){}
}
function sndSpin(){if(!SET.sound)return;playBeep(400,0.3,'sine',0.1);setTimeout(function(){playBeep(600,0.2,'sine',0.1)},100)}

/* ===== Utils ===== */
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pickRandom(arr,n){return shuffle(arr.slice()).slice(0,n)}
function randItem(a){return a[Math.floor(Math.random()*a.length)]}
function nextBatch(key,pool,count,exclude){
  var bag=window[key]||[];
  if(bag.length===0){
    var fresh=shuffle(pool.slice());
    if(exclude!==undefined&&fresh.length>1&&fresh[0]===exclude){fresh.push(fresh.shift());}
    bag=bag.concat(fresh);
    window[key]=bag;
  }
  return bag.splice(0,count);
}
function pickFresh(key,pool){
  if(SET&&SET.gentle)pool=poolFilter(pool);
  var bag=window[key];
  if(!bag||bag.length===0){
    bag=shuffle(pool.slice());
    var last=window[key+'Last'];
    if(last!==undefined&&bag.length>1&&bag[0]===last){bag.push(bag.shift());}
    window[key]=bag;
  }
  var item=bag.pop();
  window[key+'Last']=item;
  return item;
}

/* ===== Canvas Wheel ===== */
function drawWheel(canvas,items,colors){
  var ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,R=W/2-12,n=items.length;
  var fs=n<=10?26:n<=15?24:n<=20?9:n<=30?8:7;
  ctx.clearRect(0,0,W,H);
  for(var i=0;i<40;i++){
    var a=(i/40)*Math.PI*2-Math.PI/2;
    var bx=cx+Math.cos(a)*(R+4),by=cy+Math.sin(a)*(R+4);
    ctx.beginPath();ctx.arc(bx,by,4,0,Math.PI*2);
    ctx.fillStyle=i%2===0?'#ffd700':'#ff6b9d';ctx.fill();
  }
  var arc=Math.PI*2/n;
  for(var i=0;i<n;i++){
    var sa=arc*i-Math.PI/2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,sa,sa+arc);ctx.closePath();
    ctx.fillStyle=colors[i%colors.length];ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(sa+arc/2);
    ctx.fillStyle='#fff';ctx.font='bold '+fs+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    var txt=items[i];if(txt.length>7) txt=txt.substring(0,7)+'…';
    ctx.fillText(txt,R*0.62,0);ctx.restore();
  }
}
function spinWheel(canvasId,items,angleKey,spinningKey,resultId,cb){
  if(window[spinningKey])return;
  window[spinningKey]=true;sndSpin();
  var angle=1080+Math.random()*720;
  window[angleKey]+=angle;
  var sessKey=spinningKey+'Sess';
  var mySess=(window[sessKey]||0)+1;window[sessKey]=mySess;
  var cv=document.getElementById(canvasId);
  var dur=3400+Math.random()*2400; /* 随机时长+随机缓动, 不可预判 */
  var bez=['cubic-bezier(0.17,0.67,0.12,0.99)','cubic-bezier(0.1,0.7,0.3,1)','cubic-bezier(0.23,0.9,0.16,1)'][Math.floor(Math.random()*3)];
  cv.style.transition='transform '+dur+'ms '+bez;
  cv.style.transform='rotate('+window[angleKey]+'deg)';
  function finish(){
    if(window[sessKey]!==mySess)return;
    if(!document.getElementById(resultId))return;
    window[spinningKey]=false;
    var n=items.length,seg=360/n;
    var finalAngle=window[angleKey]%360;
    var idx=Math.floor(((360-finalAngle)%360)/seg)%n;
    sndDing();vibrate(100);cb(idx);
  }
  var tm=setTimeout(finish,dur+80);
  window[spinningKey+'Timer']=tm;
  cv.onclick=function(){ /* 点击立即停盘 */
    if(!window[spinningKey])return;
    cv.style.transition='transform 0.5s cubic-bezier(0.17,0.67,0.12,0.99)';
    clearTimeout(tm);
    setTimeout(finish,520);
    cv.onclick=null;
  };
}

function dareLocal(){window._dareLocal=!window._dareLocal;renderDare(document.getElementById('gContent'));}
function spinDareWheel(){
  var shown=window._dareShown||[];
  var rem=window._dareItems.filter(function(x){return shown.indexOf(x)<0;});
  if(rem.length===0){
    rem=nextBatch('_dareBag',window._dareLocal?localFilter(GAMEDATA.dare):GAMEDATA.dare,12,window._dareLastShown);
    window._dareShown=[];
  }
  window._dareItems=rem;
  var cv=document.getElementById('dareCanvas');
  if(cv)drawWheel(cv,rem,window._dareColors);
  spinWheel('dareCanvas',rem,'_dareAngle','_dareSpinning','dareResult',function(idx){
    var item=rem[idx];
    window._dareShown.push(item);
    window._dareLog=window._dareLog||[];window._dareLog.push(item);
    window._dareLastShown=item;
    var who=Math.random()<0.5?HE.him:HE.her;

      '<div class="text">'+item+'</div><div class="star">🔥 大冒险</div><div class="player-tag">'+who+' 必须执行！</div><div class="wheel-btns"><button class="wheel-btn spin" onclick="renderDare(document.getElementById(\'gContent\'))">🔄 换一批</button></div>';
  });
}

/* ===== 数字炸弹 ===== */
function bombRangeSet(n){window._bombMaxChoice=n;renderBomb(document.getElementById('gContent'));}
function renderBomb(c){
  var max=window._bombMaxChoice||100;
  var bomb=Math.floor(Math.random()*max)+1;
  window._bomb=bomb;window._bombMin=1;window._bombMax=max;window._bombGuesses=0;
  c.innerHTML='<div class="bomb-wrap">'
    +'<h2 style="margin-bottom:10px">💣 数字炸弹</h2>'
    +'<p style="color:#aaa;font-size:13px">炸弹藏在1-'+max+'之间，16次没猜中则平手共罚！</p>'
    +'<div style="text-align:center;margin:6px 0"><span class="mini-btn'+(max===50?' on':'')+'" onclick="bombRangeSet(50)">1-50</span><span class="mini-btn'+(max===100?' on':'')+'" onclick="bombRangeSet(100)">1-100</span></div>'
    +'<div class="bomb-range"><span id="bMin">1</span><span class="slash">—</span><span id="bMax">'+max+'</span></div>'
    +'<input class="bomb-input" id="bombInput" type="number" min="1" max="'+max+'" placeholder="?" onfocus="this.scrollIntoView({block:\'center\',behavior:\'smooth\'})" onkeypress="if(event.key===\'Enter\')guessBomb()">'
    +'<div><button class="bomb-submit" style="background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff" onclick="guessBomb()">💥 猜！</button></div>'
    +'<div class="bomb-msg" id="bombMsg"></div>'
    +'<div style="font-size:13px;color:#aaa;margin-top:8px">已猜：<span id="bombCount">0</span>次 | 范围：<span id="bombRange">'+max+'</span></div>'
    +'<div class="wheel-btns" style="margin-top:14px"><button class="wheel-btn back" onclick="startGame(\'bomb\')">🔄 重来</button></div>'
    +'</div>';
}
function guessBomb(){
  var v=parseFloat(document.getElementById('bombInput').value);
  if(!Number.isInteger(v)||v<window._bombMin||v>window._bombMax){toast('请输入'+window._bombMin+'-'+window._bombMax+'的整数');return}
  window._bombGuesses++;
  sndDing();vibrate(30);
  if(v===window._bomb){
    sndBoom();vibrate([100,50,100,50,200]);
    var who=Math.random()<0.5?HE.him:HE.her;
    var punish=pickFresh('_bombsPick',GAMEDATA.bombs);
    document.getElementById('bombMsg').innerHTML='<div style="color:#ff4757;font-size:22px;margin:10px 0">💥 炸弹爆炸！！！</div><div>'+who+'：'+punish+'</div>';
    document.getElementById('bombInput').disabled=true;
    document.querySelector('.bomb-submit').disabled=true;
  }else if(v<window._bomb){
    window._bombMin=Math.max(window._bombMin,v+1);
  }else{
    window._bombMax=Math.min(window._bombMax,v-1);
  }
  if(window._bombGuesses>=16&&!document.getElementById('bombInput').disabled){
    sndBoom();vibrate([100,50,100,50,200]);
    var pa=pickFresh('_bombsPick',GAMEDATA.bombs),pb=pickFresh('_bombsPick',GAMEDATA.bombs);
    document.getElementById('bombMsg').innerHTML='<div style="color:#ffd700;font-size:20px;margin:10px 0">🤝 16次没猜中，平手！</div><div>'+HE.him+'：'+pa+'</div><div>'+HE.her+'：'+pb+'</div>';
    document.getElementById('bombInput').disabled=true;
    document.querySelector('.bomb-submit').disabled=true;
    return;
  }
  document.getElementById('bMin').textContent=window._bombMin;
  document.getElementById('bMax').textContent=window._bombMax;
  document.getElementById('bombCount').textContent=window._bombGuesses;
  document.getElementById('bombRange').textContent=window._bombMax-window._bombMin+1;
  document.getElementById('bombInput').value='';
}

function renderDice(c){
  var faces=['⚀','⚁','⚂','⚃','⚄','⚅'];
  c.innerHTML='<div class="dice-wrap">'
    +'<h2 style="margin-bottom:10px">🎲 骰子大冒险</h2>'
    +'<div class="dice-box" id="diceBox">🎲</div>'
    +'<div class="dice-result" id="diceResult">点击下方按钮摇骰子</div>'
    +'<button class="dice-submit" style="background:linear-gradient(135deg,#f39c12,#e67e22)" onclick="rollDice()">🎲 摇！</button>'
    +'<div class="wheel-btns" style="margin-top:14px"><button class="wheel-btn back" onclick="startGame(\'dice\')">🔄 重来</button></div>'
    +'</div>';
  window._faces=faces;
}
function rollDice(){
  if(window._diceRolling)return;
  window._diceRolling=true;
  sndSpin();
  var box=document.getElementById('diceBox');
  box.classList.add('rolling');
  var count=0;var iv=setInterval(function(){
    box.textContent=window._faces[Math.floor(Math.random()*6)];count++;
    if(count>20){
      clearInterval(iv);window._diceRolling=false;box.classList.remove('rolling');
      var result=Math.floor(Math.random()*6);
      box.textContent=window._faces[result];
      var val=result+1;sndDing();vibrate([40,30,60]);
      var who=Math.random()<0.5?HE.him:HE.her;
      var punish=pickFresh('_punishPick',GAMEDATA.punish);
      document.getElementById('diceResult').innerHTML=
        '<div style="font-size:22px;margin-bottom:8px">🎲 '+val+'点！</div><div>'+who+'：'+punish+'</div>';
    }
  },80);
}

function rpsPick(choice){
  sndDing();vibrate(30);
  if(window._rpsPhase===0){
    window._rpsPhase=1;
    document.getElementById('rpsPhase').textContent=window._rpsP1Name+' 请出拳';
    document.getElementById('rpsResult').innerHTML='';
    rpsZones();
    return;
  }
  if(window._rpsPhase===1){
    window._rpsP1=choice;window._rpsPhase=2;
    document.getElementById('rpsPhase').textContent=window._rpsP2Name+' 请出拳（别让'+window._rpsP1Name+'看到）';
    document.getElementById('rpsResult').innerHTML='<div style="color:#aaa">'+window._rpsP1Name+' 已出拳 ✅</div>';
    rpsZones();
  }else if(window._rpsPhase===2){
    window._rpsP2=choice;
    var m=window._rpsMoves;
    var diff=(window._rpsP1-window._rpsP2+3)%3;
    window._rpsStreak=window._rpsStreak||{};
    var resultHtml='<div style="margin:10px 0"><span class="rps-p1">'+m[window._rpsP1].icon+' '+m[window._rpsP1].name+'</span>'
      +'<span class="rps-vs">VS</span>'
      +'<span class="rps-p2">'+m[window._rpsP2].icon+' '+m[window._rpsP2].name+'</span></div>';
    if(diff===0){
      resultHtml+='<div style="font-size:18px;color:#ffd700">🤝 平局！再来一次！</div>';
      window._rpsPhase=1;
      document.getElementById('rpsPhase').textContent=window._rpsP1Name+' 请出拳';
    }else if(diff===1){
      var streak1=(window._rpsStreak[window._rpsP1Name]||0);
      sndBuzz();vibrate([50,30,50]);
      if(streak1>=3){
        resultHtml+='<div style="font-size:18px;color:#ffd700">🔥 复仇成功！'+window._rpsP1Name+' 连败后首胜，本轮免罚！</div>';
      }else{
        resultHtml+='<div style="font-size:18px;color:#ff6b6b">😢 '+window._rpsP1Name+' 输了！</div><div>'+window._rpsP1Name+' 必须：'+pickFresh('_punishPick',GAMEDATA.punish)+'</div>';
      }
      window._rpsStreak[window._rpsP1Name]=0;
      window._rpsStreak[window._rpsP2Name]=(window._rpsStreak[window._rpsP2Name]||0)+1;
      window._rpsPhase=0;
    }else{
      var streak2=(window._rpsStreak[window._rpsP2Name]||0);
      sndBuzz();vibrate([50,30,50]);
      if(streak2>=3){
        resultHtml+='<div style="font-size:18px;color:#ffd700">🔥 复仇成功！'+window._rpsP2Name+' 连败后首胜，本轮免罚！</div>';
      }else{
        resultHtml+='<div style="font-size:18px;color:#00cec9">🎉 '+window._rpsP1Name+' 赢了！</div><div>'+window._rpsP2Name+' 必须：'+pickFresh('_punishPick',GAMEDATA.punish)+'</div>';
      }
      window._rpsStreak[window._rpsP2Name]=0;
      window._rpsStreak[window._rpsP1Name]=(window._rpsStreak[window._rpsP1Name]||0)+1;
      window._rpsPhase=0;
    }
    document.getElementById('rpsResult').innerHTML=resultHtml;
    document.getElementById('rpsPhase').textContent='再点手势可开新局';
    rpsZones();
  }
}

  spinWheel('rouCanvas',window._rouItems,'_rouAngle','_rouSpinning','rouResult',function(idx){
    var label=window._rouItems[idx];

    var other=otherPlayer(who);
    var el=document.getElementById('rouResult');
    if(label.indexOf('免罚')>=0){
      el.innerHTML='<div class="text">🍀 免罚！'+other+' 必须执行：'+pickFresh('_punishPick',GAMEDATA.punish)+'</div>';

      if(who===HE.him)window._clothHim=Math.max(0,window._clothHim-1);

      if(window._clothHim+window._clothHer===0){
        el.innerHTML='<div class="text">🧥 双方都脱光了！终极惩罚三连：'+pickFresh('_punishPick',GAMEDATA.punish)+' / '+pickFresh('_punishPick',GAMEDATA.punish)+' / '+pickFresh('_punishPick',GAMEDATA.punish)+'</div>';
        window._clothHim=6;window._clothHer=6;renderCloth();
      }else{
        el.innerHTML='<div class="text">🧥 '+who+' 脱一件！</div>';

      el.innerHTML='<div class="text">💜 真心话 · '+who+' 必须回答：'+pickFresh('_truthPick',GAMEDATA.truths)+'</div>';

      el.innerHTML='<div class="text">💋 亲吻 · '+who+' 执行：'+randItem(KISS_POOL)+'</div>';
    }else{
      el.innerHTML='<div class="text">💣 惩罚 · '+who+' 必须执行：'+pickFresh('_punishPick',GAMEDATA.punish)+'</div>';

function escRefuse(){

    +'<button class="wheel-btn spin" onclick="kingCmd(\'punish\')">💣 惩罚</button>'

function kingCmd(type){
  if(window._kingSlots>=window._kingSlotsMax)return;
  var pool=type==='truth'?GAMEDATA.truths:(type==='dare'?GAMEDATA.dare:GAMEDATA.punish);
  var key=type==='truth'?'_truthPick':(type==='dare'?'_darePick':'_punishPick');
  var cands=[pickFresh(key,pool),pickFresh(key,pool),pickFresh(key,pool)];
  window._kingCands=cands;
  document.getElementById('kingList').innerHTML='<div style="font-size:13px;color:#aaa">👑 国王请从三条中挑一条：</div>'
    +cands.map(function(x,i){return '<div class="mini-btn" style="display:block;text-align:left;margin:4px 0;padding:6px 10px" onclick="kingPick('+i+')">'+(i+1)+'. '+x+'</div>';}).join('');
}
function kingPick(i){
  var item=window._kingCands[i];
  window._kingSlots++;
  window._kingLog.push(item);
  var list=document.getElementById('kingList');
  list.innerHTML='';
  window._kingLog.forEach(function(x,k){list.innerHTML+='<div style="margin:4px 0;color:#eee">'+(k+1)+'. '+x+'</div>';});
  if(window._kingSlots>=window._kingSlotsMax){
    window._king=otherPlayer(window._king);
    window._kingSlots=0;
    window._kingLog=[];
    document.getElementById('kingName').textContent=window._king;
    list.innerHTML+='<div style="color:#ffd700">命令用完，王位易主！</div>';
    toast('王位易主！');
  }
}

function gSurrender(){

function gUltimate(){

function gDouble(){

function gDone(){

    gShow();

  }

function duelHeader(inner){return '<h2 style="margin-bottom:10px">⚔️ 开局对决</h2><p style="color:#aaa;font-size:13px">赢家做主，输家先执行！</p>'+inner;}
function duelStreak(name){return (window._duelStreak&&window._duelStreak[name])||0;}
function duelRecord(w){var l=otherPlayer(w);window._duelStreak=window._duelStreak||{};window._duelStreak[l]=(window._duelStreak[l]||0)+1;window._duelStreak[w]=0;}
function duelSkip(){
  window._duelReactState='done';
  if(window._duelTapState==='go')window._duelTapState='done';
  window._duelSkip=(window._duelSkip||0)+1;
  window._duelWinner=(window._duelSkip%2===1)?HE.him:HE.her;
  toast('已跳过对决：本轮 '+window._duelWinner+' 做主（轮流）');
  window._duelDone();
}
function renderDuel(c,onDone){
  window._duelDone=onDone;
  window._duelWinner=null;
  var types=['react','tap','dice'];
  var t=types[(window._duelSeq=(window._duelSeq||0)+1)%3]; /* D8 轮换制 */
  if(t==='react')renderReactDuel(c);
  else if(t==='tap')renderTapDuel(c);
  else renderDiceDuel(c);
}
function duelFinish(c){
  var w=window._duelWinner;
  duelRecord(w);
  c.innerHTML=duelHeader(
    '<div class="cmd-card" style="text-align:center"><div style="font-size:34px">👑</div><div style="font-size:19px;margin:6px 0">'+w+' 获胜！</div><div style="color:#aaa;font-size:13px">本局 '+w+' 做主，'+otherPlayer(w)+' 先执行</div></div>'
    +'<div class="wheel-btns"><button class="wheel-btn spin" onclick="window._duelDone()">🎮 开始游戏</button></div>');
}
/* 反应对决 */
function renderReactDuel(c){
  window._duelReactState='wait';
  c.innerHTML=duelHeader('')
    +'<div class="vs-stage">'
    +'<div class="vs-zone vs-top"><div class="vs-status" id="duelMsgTop">'+HE.her+' 准备！</div>'
    +'<button class="vs-btn" id="reactHer">'+HE.her+' 👆</button></div>'
    +'<div class="vs-mid" id="duelMsgMid">⚔️ 抢拍对决</div>'
    +'<div class="vs-zone vs-bottom"><div class="vs-status" id="duelMsgBot">'+HE.him+' 准备！</div>'
    +'<button class="vs-btn" id="reactHim">'+HE.him+' 👆</button></div>'
    +'</div>'
    +'<div style="text-align:center;margin-top:12px"><button class="wheel-btn spin" onclick="duelGo()">🎬 3-2-1 开始</button></div>'
    +'<div style="text-align:center;margin-top:6px"><button class="wheel-btn back" onclick="duelSkip()">🕊️ 跳过对决（轮流做主）</button></div>';
  window._duelWarnSide=null;
  var bh=document.getElementById('reactHim'),be=document.getElementById('reactHer');
  if(bh)bh.addEventListener('pointerdown',function(e){e.preventDefault();duelReact(1);});
  if(be)be.addEventListener('pointerdown',function(e){e.preventDefault();duelReact(2);});
}
function duelGo(){
  if(window._duelReactState!=='wait')return;
  window._duelReactState='ready';
  var mt=document.getElementById('duelMsgTop'),mb=document.getElementById('duelMsgBot');
  if(mt)mt.textContent='盯住屏幕，变绿立刻拍！';
  if(mb)mb.textContent='盯住屏幕，变绿立刻拍！';
  duelGoAgain();
}
function duelGoAgain(){
  setTimeout(function(){
    if(window._duelReactState!=='ready')return;
    window._duelReactState='go';
    var a=document.getElementById('duelMsgTop'),b2=document.getElementById('duelMsgBot');
    if(!a&&!b2)return;
    if(a){a.textContent='🟢 拍！！！';a.style.color='#51cf66';a.style.fontWeight='bold';}
    if(b2){b2.textContent='🟢 拍！！！';b2.style.color='#51cf66';b2.style.fontWeight='bold';}
    sndDing();vibrate([80,40,80,40,160]); /* D1等待≤3秒 + D7色盲友好强振动 */
  },1500+Math.random()*1500);
}
function duelReact(side){
  var st=window._duelReactState;
  if(st==='done'||st==='wait')return;
  if(st==='go'){
    window._duelReactState='done';
    window._duelWarnSide=null;
    window._duelWinner=side===1?HE.him:HE.her;
    sndDing();
    duelFinish(document.getElementById('gContent'));
  }else{ /* 抢跑: 警告制 D2 */
    if(window._duelWarnSide===side){
      window._duelReactState='done';
      window._duelWinner=side===1?HE.her:HE.him;
      sndBuzz();
      duelFinish(document.getElementById('gContent'));
    }else{
      window._duelWarnSide=side;
      window._duelReactState='ready';
      var mt=document.getElementById('duelMsgTop'),mb=document.getElementById('duelMsgBot');
      if(mt)mt.textContent='⚠️ 抢跑警告！重新等待';
      if(mb)mb.textContent='⚠️ 抢跑警告！重新等待';
      sndBuzz();toast((side===1?HE.him:HE.her)+' 抢跑警告！再抢一次判负');
      duelGoAgain();
    }
  }
}
/* 手速对决 */
function renderTapDuel(c){
  window._duelTapTime=window._duelTapTime||6;
  window._duelTap=[0,0];window._duelTapState='wait';
  c.innerHTML=duelHeader('')
    +'<div class="vs-stage">'
    +'<div class="vs-zone vs-top"><div class="vs-status">'+HE.her+' 连点数：<span id="tapHer">0</span></div>'
    +'<button class="vs-btn" id="tapBtnHer">'+HE.her+' 👆</button></div>'
    +'<div class="vs-mid"><div class="count-bar"><div class="count-fill" id="duelBar2"></div></div></div>'
    +'<div class="vs-zone vs-bottom"><div class="vs-status"><span id="tapHim">0</span> ：连点数 '+HE.him+'</div>'
    +'<button class="vs-btn" id="tapBtnHim">'+HE.him+' 👆</button></div>'
    +'</div>'
    +'<div style="text-align:center;margin-top:12px">'
    +'<span class="mini-btn'+(window._duelTapTime===3?' on':'')+'" onclick="duelTapSet(3)">3秒</span>'
    +'<span class="mini-btn'+(window._duelTapTime===6?' on':'')+'" onclick="duelTapSet(6)">6秒</span>'
    +'<span class="mini-btn'+(window._duelTapTime===10?' on':'')+'" onclick="duelTapSet(10)">10秒</span>'
    +'</div>'
    +'<div style="text-align:center;margin-top:8px"><button class="wheel-btn spin" onclick="duelTapGo()">🕐 倒计时开赛</button></div>'
    +'<div style="text-align:center;margin-top:6px"><button class="wheel-btn back" onclick="duelSkip()">🕊️ 跳过对决（轮流做主）</button></div>';
  var a=document.getElementById('tapBtnHim'),b2=document.getElementById('tapBtnHer');
  if(a)a.addEventListener('pointerdown',function(e){e.preventDefault();duelTap(0);});
  if(b2)b2.addEventListener('pointerdown',function(e){e.preventDefault();duelTap(1);});
}
function duelTapSet(n){window._duelTapTime=n;var c=document.getElementById('gContent');if(c)renderTapDuel(c);}
function duelTapGo(){
  if(window._duelTapState!=='wait')return;
  window._duelTapState='go';
  var T=window._duelTapTime||6;
  function runRound(){
    window._duelTap=[0,0];
    var himEl=document.getElementById('tapHim'),herEl=document.getElementById('tapHer');
    if(himEl)himEl.textContent='0';
    if(herEl)herEl.textContent='0';
    var left=T;
    var iv=setInterval(function(){
      var bar=document.getElementById('duelBar2');
      if(!bar){clearInterval(iv);return;}
      left-=0.1;
      bar.style.width=Math.max(0,left/T*100)+'%';
      if(left<=0){
        clearInterval(iv);
        if(window._duelTap[0]===window._duelTap[1]){
          toast('🤝 平局！加赛 '+T+' 秒'); /* D4 加赛直到分出胜负 */
          runRound();
          return;
        }
        window._duelTapState='done';
        window._duelWinner=window._duelTap[0]>window._duelTap[1]?HE.him:HE.her;
        sndDing();
        duelFinish(document.getElementById('gContent'));
      }
    },100);
  }
  runRound();
}
function duelTap(side){
  if(window._duelTapState!=='go')return;
  window._duelTap[side]++;
  document.getElementById(side===0?'tapHim':'tapHer').textContent=window._duelTap[side];
}
/* 骰子对决 */
function renderDiceDuel(c){
  window._duelDice=[null,null];
  window._duelRerollUsed={};
  var rerollHim=duelStreak(HE.him)>=3?'<button class="mini-btn" id="rerollHim" style="display:none" onclick="duelReroll(0)">🎲 连败保护重掷</button>':'';
  var rerollHer=duelStreak(HE.her)>=3?'<button class="mini-btn" id="rerollHer" style="display:none" onclick="duelReroll(1)">🎲 连败保护重掷</button>':'';
  c.innerHTML=duelHeader('')
    +'<div class="vs-stage">'
    +'<div class="vs-zone vs-top"><div class="duel-dice" id="ddHer">🎲</div>'
    +'<button class="wheel-btn spin" style="width:100%" id="rollHer">'+HE.her+' 掷</button>'
    +rerollHer+'</div>'
    +'<div class="vs-mid" id="duelDiceMsg" style="color:#aaa;font-size:14px">各自掷骰，点数保密（🎲 ? = 对方已掷，先不看），最后一起揭晓</div>'
    +'<div class="vs-zone vs-bottom"><div class="duel-dice" id="ddHim">🎲</div>'
    +'<button class="wheel-btn spin" style="width:100%" id="rollHim">'+HE.him+' 掷</button>'
    +rerollHim+'</div>'
    +'</div>'
    +'<div style="text-align:center;margin-top:6px"><button class="wheel-btn back" onclick="duelSkip()">🕊️ 跳过对决（轮流做主）</button></div>';
  var a=document.getElementById('rollHim'),b2=document.getElementById('rollHer');
  if(a)a.onclick=function(){duelRoll(0);};
  if(b2)b2.onclick=function(){duelRoll(1);};
}
function duelReroll(side){
  if(window._duelRerollUsed[side])return;
  window._duelRerollUsed[side]=true;
  window._duelDice[side]=null;
  var die=document.getElementById(side===0?'ddHim':'ddHer');
  if(die)die.textContent='🎲';
  var btn=document.getElementById(side===0?'rerollHim':'rerollHer');
  if(btn)btn.style.display='none';
  duelRoll(side);
}
function duelRoll(side){
  if(window._duelDice[side]!==null)return;
  var faces=['⚀','⚁','⚂','⚃','⚄','⚅'];
  var v=Math.floor(Math.random()*6)+1;
  window._duelDice[side]=v;
  document.getElementById(side===0?'ddHim':'ddHer').textContent=faces[v-1]+' '+v;
  if(window._duelDice[0]===null||window._duelDice[1]===null){
    var otherId=side===0?'ddHer':'ddHim';
    document.getElementById(otherId).textContent='🎲 ?'; /* 保密: 对方点数暂不显示 */
  }
  if(window._duelDice[0]!==null&&window._duelDice[1]!==null){
    if(window._duelDice[0]===window._duelDice[1]){
      document.getElementById('duelDiceMsg').textContent='平局！重新掷';
      window._duelDice=[null,null];
      setTimeout(function(){
        var a=document.getElementById('ddHim'),b2=document.getElementById('ddHer');
        if(a){a.textContent='🎲';b2.textContent='🎲';}
      },600);
      return;
    }
    window._duelWinner=window._duelDice[0]>window._duelDice[1]?HE.him:HE.her;
    sndDing();
    /* 对比画面: 双方点数并排揭晓, 确认后进游戏 */
    var c=document.getElementById('gContent');
    c.innerHTML=duelHeader('')
      +'<div class="vs-stage">'
      +'<div class="vs-zone vs-top" style="'+(window._duelWinner===HE.her?'border:2px solid #ffd700':'')+'"><div class="duel-dice" style="font-size:64px">'+faces[window._duelDice[1]-1]+'</div><div style="text-align:center;font-size:20px">'+HE.her+' · '+window._duelDice[1]+' 点</div></div>'
      +'<div class="vs-mid"><div style="font-size:26px;color:#ffd700">VS</div><button class="wheel-btn spin" style="margin-top:8px;width:100%" onclick="window._duelDone()">🎮 开始游戏</button></div>'
      +'<div class="vs-zone vs-bottom" style="'+(window._duelWinner===HE.him?'border:2px solid #ffd700':'')+'"><div class="duel-dice" style="font-size:64px">'+faces[window._duelDice[0]-1]+'</div><div style="text-align:center;font-size:20px">'+HE.him+' · '+window._duelDice[0]+' 点</div></div>'
      +'</div>'
      +'<div class="cmd-card" style="text-align:center"><div style="font-size:22px">👑 '+window._duelWinner+' 获胜！</div><div style="color:#aaa;font-size:13px;margin-top:4px">本局 '+window._duelWinner+' 做主，'+otherPlayer(window._duelWinner)+' 先执行</div></div>';
  }
}


/* ===== 7款新游戏包装(开局对决) ===== */
function renderChoice(c){renderDuel(c,function(){renderChoiceBody(c);});}
function renderCards(c){renderDuel(c,function(){renderCardsBody(c);});}
function renderGrid(c){renderDuel(c,function(){renderGridBody(c);});}
function renderPotato(c){renderDuel(c,function(){renderPotatoBody(c);});}
function renderFit(c){renderDuel(c,function(){renderFitBody(c);});}
function renderRole(c){renderDuel(c,function(){renderRoleBody(c);});}
function renderAuction(c){renderDuel(c,function(){renderAuctionBody(c);});}

/* ===== 🎰 命运二选一 ===== */
function renderChoiceBody(c){
  var pair=randItem(GAMEDATA.pairs).split('｜');
  window._chPair=pair;
  window._chAddUsed=false;
  var loser=otherPlayer(window._duelWinner);
  c.innerHTML='<div class="bomb-wrap">'
    +'<h2 style="margin-bottom:10px">🎰 命运二选一</h2>'
    +'<p style="color:#aaa;font-size:13px">规则：'+loser+' 必须二选一执行；'+window._duelWinner+' 每局有 1 次「加码」特权，可让对方两条都做</p>'
    +'<div class="choice-card" id="chA" onclick="chPick(0)"><div class="ch-tag">A</div><div>'+pair[0]+'</div></div>'
    +'<div class="choice-card" id="chB" onclick="chPick(1)"><div class="ch-tag">B</div><div>'+pair[1]+'</div></div>'
    +'<div class="wheel-btns" id="chBtns" style="margin-top:12px">'
    +'<button class="wheel-btn back" '+(window._chAddUsed?'disabled style="opacity:0.4"':'')+' onclick="chAdd()">🃏 '+window._duelWinner+' 加码：两条都做'+(window._chAddUsed?'（已用）':'')+'</button>'
    +'<button class="wheel-btn back" onclick="chBothRefuse()">🚩 两条都拒绝（自罚一条）</button>'
    +'</div>'
    +'<div class="wheel-btns"><button class="wheel-btn back" onclick="renderChoiceBody(document.getElementById(\'gContent\'))">🔄 下一组</button></div>'
    +'<div style="font-size:11px;color:#777;text-align:center;margin-top:8px">🍷 未成年人请勿饮酒，适量为宜</div>'
    +'</div>';
}
function chPick(i){
  var pair=window._chPair||[];
  if(pair.length<2)return;
  document.getElementById('chA').style.background=i===0?'rgba(255,215,0,0.25)':'rgba(255,255,255,0.05)';
  document.getElementById('chB').style.background=i===1?'rgba(255,215,0,0.25)':'rgba(255,255,255,0.05)';
  toast(otherPlayer(window._duelWinner)+' 执行：'+pair[i]);
}
function chAdd(){
  if(window._chAddUsed)return;
  window._chAddUsed=true;
  renderChoiceBody(document.getElementById('gContent'));
  toast('🃏 加码生效！两条都必须做！');
}
function chBothRefuse(){
  toast('🚩 两条都拒绝：自罚一条');
  document.getElementById('chBtns').innerHTML='<div style="color:#ff4757;font-size:14px;text-align:center">🚩 保底：'+otherPlayer(window._duelWinner)+' 自罚一条<br>'+pickFresh('_punishPick',GAMEDATA.punish)+'</div>';
}

/* ===== 🂡 出牌对决 ===== */
function renderCardsBody(c){
  window._cardTurn=window._duelWinner;
  window._cardHands={};
  window._cardHands[HE.him]=[];
  window._cardHands[HE.her]=[];
  window._cardPicked=null;
  cardsDrawUI();
}
function cardDeck(){return ['truth','dare','punish','drink','free','double','truth','dare','punish','drink','truth','dare'];}
function cardsDrawUI(){
  var c=document.getElementById('gContent');
  var turn=window._cardTurn;
  var hand=window._cardHands[turn];
  if(hand.length===0){for(var k=0;k<5;k++)hand.push(randItem(cardDeck()));}
  window._cardPicked=null;
  c.innerHTML='<div class="bomb-wrap">'
    +'<h2 style="margin-bottom:10px">🂡 出牌对决</h2>'
    +'<p style="color:#aaa;font-size:13px">规则：轮到 '+turn+' 出牌。手牌 5 张背面朝上，悄悄选 1 张后点「揭晓」（揭晓前可换选），牌面任务由 '+otherPlayer(turn)+' 执行，然后换人出牌</p>'
    +'<div class="duel-row" id="cardRow">'
    +'<button class="card-back" onclick="cardsPick(0)">🂠</button>'
    +'<button class="card-back" onclick="cardsPick(1)">🂠</button>'
    +'<button class="card-back" onclick="cardsPick(2)">🂠</button>'
    +'<button class="card-back" onclick="cardsPick(3)">🂠</button>'
    +'<button class="card-back" onclick="cardsPick(4)">🂠</button>'
    +'</div>'
    +'<div class="wheel-btns" style="margin-top:14px"><button class="wheel-btn spin" id="cardFlipBtn" onclick="cardsFlip()">🎴 揭晓</button></div>'
    +'<div class="cmd-card" id="cardResult" style="text-align:center;color:#aaa">选出牌后点揭晓</div>'
    +'<div class="wheel-btns"><button class="wheel-btn back" onclick="renderCardsBody(document.getElementById(\'gContent\'))">🔄 重来</button></div>'
    +'<div style="font-size:11px;color:#777;text-align:center">🍷 未成年人请勿饮酒</div>'
    +'</div>';
}
function cardsPick(i){
  window._cardPicked=i;
  var btns=document.querySelectorAll('#cardRow .card-back');
  for(var k=0;k<btns.length;k++){btns[k].style.background=k===i?'rgba(255,215,0,0.3)':'rgba(255,255,255,0.1)';}
}
function cardDraw(type){
  if(type==='truth')return '💜 真心话：'+pickFresh('_truthPick',GAMEDATA.truths);
  if(type==='dare')return '🔥 大冒险：'+pickFresh('_darePick',GAMEDATA.dare);
  if(type==='punish')return '💣 惩罚：'+pickFresh('_punishPick',GAMEDATA.punish);
  if(type==='drink')return '🍷 喝酒：'+pickFresh('_drinkPick',GAMEDATA.drink);
  if(type==='free')return '🍀 免罚：对方这轮直接跳过！';
  return '💥 翻倍：对方连做两条！';
}
function cardsFlip(){
  if(window._cardPicked===null){toast('先选一张牌');return;}
  var turn=window._cardTurn;
  var hand=window._cardHands[turn];
  var type=hand.splice(window._cardPicked,1)[0];
  var who=otherPlayer(turn);
  var res=document.getElementById('cardResult');
  if(type==='free'){
    res.innerHTML='<div style="font-size:15px">🍀 免罚！'+who+' 这轮跳过~</div>';
  }else if(type==='double'){
    res.innerHTML='<div style="font-size:15px">💥 翻倍！'+who+' 连做两条：<br>'+cardDraw('punish')+'<br>'+cardDraw('punish')+'</div>';
  }else{
    res.innerHTML='<div style="font-size:15px">'+cardDraw(type)+'<br><span style="color:#aaa;font-size:13px">由 '+who+' 执行</span></div>';
  }
  var btn=document.getElementById('cardFlipBtn');
  if(btn)btn.outerHTML='<button class="wheel-btn spin" onclick="cardsNext()">✅ 执行完，换人出牌</button>';
}
function cardsNext(){
  window._cardTurn=otherPlayer(window._cardTurn);
  cardsDrawUI();
}

/* ===== 📦 九宫格盲盒 ===== */
function gridCellLabel(type){
  if(type==='truth')return '💜\n真心话';
  if(type==='dare')return '🔥\n大冒险';
  if(type==='punish')return '💣\n惩罚';
  if(type==='drink')return '🍷\n喝酒';
  if(type==='cmd')return '👑\n命令权';
  return '🍀\n免罚';
}
function renderGridBody(c){
  if(!c)return;
  var cells=['truth','truth','dare','dare','punish','punish','drink','cmd','free'];
  window._gridCells=shuffle(cells.slice());
  window._gridOpened=[false,false,false,false,false,false,false,false,false];
  window._gridTurn=window._duelWinner;
  gridUI();
}
function gridUI(){
  var c=document.getElementById('gContent');
  if(!c)return;
  var html='<div class="bomb-wrap"><h2 style="margin-bottom:10px">📦 九宫格盲盒</h2>'
    +'<p style="color:#aaa;font-size:13px">规则：9 格背后藏着真心话×2、大冒险×2、惩罚×2、喝酒×1、命令权×1、免罚×1。轮到 '+window._gridTurn+' 开格；开出的任务由 '+otherPlayer(window._gridTurn)+' 执行（免罚除外）</p>'
    +'<div class="grid9">';
  for(var i=0;i<9;i++){
    var label=window._gridOpened[i]?gridCellLabel(window._gridCells[i]):'❓';
    html+='<button class="grid-cell" id="gc'+i+'" onclick="gridOpen('+i+')">'+label+'</button>';
  }
  html+='</div><div class="cmd-card" id="gridMsg" style="text-align:center;color:#aaa">开一格看看？</div>'
    +'<div class="wheel-btns"><button class="wheel-btn back" onclick="renderGridBody(document.getElementById(\'gContent\'))">🔄 新一局</button></div>'
    +'<div style="font-size:11px;color:#777;text-align:center">🍷 未成年人请勿饮酒</div>'
    +'</div>';

function aucTimer(){
  if(window._aucTv)clearInterval(window._aucTv);

  var left=T;
  window._aucLeft=T;
  var iv=setInterval(function(){
    var bar=document.getElementById('aucBar');
    if(!bar){clearInterval(iv);return;}
    left-=0.1;
    bar.style.width=Math.max(0,left/T*100)+'%';
    if(left<=0){clearInterval(iv);aucEnd();}
  },100);
  window._aucTv=iv;
}
function aucBid(side){

  if(bid)bid.textContent=window._aucBid[who];
  var cour=document.getElementById(side===1?'courHim':'courHer');

}
/* 竞拍平局: 石头剪刀布加赛 */
function aucRpsStart(c){
  window._aucRps=[null,null];window._aucRpsPhase=1;
  c.innerHTML='<div class="bomb-wrap"><h2 style="margin-bottom:10px">💰 勇气竞拍 · 平局加赛</h2>'
    +'<div class="cmd-card" style="text-align:center"><div style="font-size:18px">🤝 出价相同！石头剪刀布定归属</div>'
    +'<div id="aucRpsMsg" style="font-size:14px;color:#ffd700;margin-top:6px">'+HE.him+' 先出拳（别让对方看到）</div></div>'
    +'<div class="vs-stage">'
    +'<div class="vs-zone vs-top" id="aucRpsHerZone"><div class="vs-status">'+HE.her+' 等待…</div></div>'
    +'<div class="vs-zone vs-bottom" id="aucRpsHimZone"><div class="rps-picks">'
    +'<div class="rps-pick" onclick="aucRpsPick(0)"><div class="rps-icon">✊</div></div>'
    +'<div class="rps-pick" onclick="aucRpsPick(1)"><div class="rps-icon">✌️</div></div>'
    +'<div class="rps-pick" onclick="aucRpsPick(2)"><div class="rps-icon">✋</div></div>'
    +'</div></div>'
    +'</div></div>';
}
function aucRpsPick(ch){
  if(window._aucRpsPhase===1){
    window._aucRps[0]=ch;window._aucRpsPhase=2;
    document.getElementById('aucRpsMsg').textContent=HE.her+' 出拳（别让对方看到）';
    document.getElementById('aucRpsHimZone').innerHTML='<div class="vs-status">'+HE.him+' 已出拳 ✅</div>';
    document.getElementById('aucRpsHerZone').innerHTML='<div class="rps-picks">'
      +'<div class="rps-pick" onclick="aucRpsPick(0)"><div class="rps-icon">✊</div></div>'
      +'<div class="rps-pick" onclick="aucRpsPick(1)"><div class="rps-icon">✌️</div></div>'
      +'<div class="rps-pick" onclick="aucRpsPick(2)"><div class="rps-icon">✋</div></div>'
      +'</div>';
  }else if(window._aucRpsPhase===2){
    window._aucRps[1]=ch;
    var diff=(window._aucRps[0]-window._aucRps[1]+3)%3;
    var c=document.getElementById('gContent');
    if(diff===0){
      c.innerHTML='<div class="bomb-wrap"><h2 style="margin-bottom:10px">💰 勇气竞拍</h2><div class="cmd-card" style="text-align:center"><div style="font-size:20px">🤝 又平了！</div><div style="font-size:14px;margin-top:8px">'+pickDrink()+'</div></div><div class="wheel-btns"><button class="wheel-btn spin" onclick="aucNext()">下一件</button></div></div>';
      return;
    }
    var win=diff===1?HE.him:HE.her;
    var content=window._aucIdx===0
      ?('🍀 '+win+' 获得免罚金牌，下次被罚可抵一次！')
      :(window._aucIdx===1
        ?('👑 '+win+' 可命令 '+otherPlayer(win)+'：'+pickFresh('_punishPick',GAMEDATA.punish))
        :('🧥 '+win+' 可指定 '+otherPlayer(win)+' 脱一件！'));
    c.innerHTML='<div class="bomb-wrap"><h2 style="margin-bottom:10px">💰 勇气竞拍</h2><div class="cmd-card" style="text-align:center"><div style="color:#ffd700;font-size:16px">🏆 '+win+' 猜拳胜出，拍得！</div><div style="font-size:15px;margin-top:8px">'+content+'</div></div><div class="wheel-btns"><button class="wheel-btn spin" onclick="aucNext()">下一件</button></div></div>';
  }
}

/* ===== Init ===== */
if(HE.him!=='他'||HE.her!=='她'){document.getElementById('cpNames').innerHTML='<span style="color:#3498db">♂ '+HE.him+'</span><span class="vs">❤</span><span style="color:#e040fb">♀ '+HE.her+'</span>';}
renderHome();

</script>
